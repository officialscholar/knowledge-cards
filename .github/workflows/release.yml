# Auto release: triggered only when the LATEST COMMIT SUBJECT (first line) on main carries the [release] marker.
# Local one-key script (release.ps1) appends that marker to the subject; ordinary pushes do not publish.
# NOTE: matching the full message would also hit the marker mentioned in the commit body, so we gate on the
#       subject line only inside a bash step.
# Version: read the latest semver tag, bump PATCH by one (v1.0.0 -> v1.0.1).
# Asset: root index.html uploaded as knowledge-cards-vX.Y.Z.html.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history (tags + commits for notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Gate: check release marker in commit subject only"
        id: gate
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject=$(printf '%s' "$COMMIT_MSG" | head -n1)
          echo "commit subject: $subject"
          # grep -F: treat "[release]" as a literal string, not a glob character class; match subject only.
          if printf '%s' "$subject" | grep -Fq "[release]"; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "release marker found in subject -> proceed"
          else
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "no [release] marker in subject -> skip release"
          fi

      - name: Compute next patch version
        id: ver
        if: steps.gate.outputs.trigger == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            major=1; minor=0; patch=0; prev=""
          else
            v=${latest#v}
            IFS='.' read -r major minor patch <<< "$v"
            patch=$((patch + 1))
            prev="$latest"
          fi
          next="v${major}.${minor}.${patch}"
          echo "latest=${latest:-none} previous=${prev:-none} next=${next}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Stage release asset with versioned name
        if: steps.gate.outputs.trigger == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp index.html "knowledge-cards-${{ steps.ver.outputs.next }}.html"
          ls -l "knowledge-cards-${{ steps.ver.outputs.next }}.html"

      - name: Build release notes from this release's commit list
        if: steps.gate.outputs.trigger == 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          prev="${{ steps.ver.outputs.prev }}"
          next="${{ steps.ver.outputs.next }}"
          {
            echo "## 本次更新（${prev:-首次发布} → ${next}）"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s' "$prev"..HEAD | sed 's/ \[release\]$//'
            else
              git log --pretty=format:'- %s' HEAD
            fi
            echo
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/officialscholar/knowledge-cards/compare/${prev}...${next}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release and upload asset
        if: steps.gate.outputs.trigger == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.next }}
          name: knowledge-cards ${{ steps.ver.outputs.next }}
          body_path: RELEASE_NOTES.md
          files: knowledge-cards-*.html
          fail_on_unmatched_files: true
