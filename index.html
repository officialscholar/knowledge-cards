  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      /* iOS 状态栏避让：在 PWA standalone 模式下，头部需要额外下移 */
      --status-bar-offset: 0px;
    }

    /* iOS PWA standalone 检测：状态栏黑色半透明时，内容会被状态栏覆盖 */
    @supports (-webkit-touch-callout: none) {
      @media (display-mode: standalone) {
        :root {
          --status-bar-offset: 0px;
        }
      }
    }

    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f7fc;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1e293b;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      -webkit-user-select: none;
      user-select: none;
      /* 防止 iOS 双击缩放 */
      touch-action: manipulation;
    }

    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }

    /* 防止 iOS 自动放大字体 */
    input, textarea, select, button {
      font-size: 16px;
    }

    .app-header {
      padding: 12px 16px 8px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      gap: 8px;
      /* iOS PWA 下状态栏黑色半透明，需要留出状态栏高度 */
      padding-top: calc(12px + var(--status-bar-offset));
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .mode-toggle {
      display: flex;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 40px;
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: #fff;
      color: #1e3a8a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-weight: 600;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: #fff;
      border-right: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
    }

    .sidebar.hidden-sidebar { display: none; }

    .sidebar-header {
      padding: 16px 16px 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header span:last-child {
      background: #eef2f6;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #334155;
    }

    .knowledge-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .group-section { margin-bottom: 8px; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .group-header:hover { background: #f1f5f9; }

    .group-header .group-arrow {
      font-size: 0.65rem;
      color: #94a3b8;
      display: inline-block;
      width: 12px;
      text-align: center;
      transition: transform 0.2s;
    }

    .group-section.collapsed .group-arrow { transform: rotate(-90deg); }
    .group-section.collapsed .group-items { display: none; }

    .group-header .group-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-header .group-count {
      background: #eef2f6;
      color: #64748b;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .group-items { padding-left: 6px; }

    .group-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; }
    .group-header:hover .group-actions { opacity: 1; }

    .group-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1;
    }

    .group-action-btn.delete-group:hover { background: #fee2e2; color: #dc2626; }

    .ungrouped-label {
      font-size: 0.7rem;
      color: #94a3b8;
      padding: 8px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      font-style: italic;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 4px 0;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #eef2f6;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      word-break: break-word;
      line-height: 1.4;
    }

    .knowledge-item:hover { background: #f8fafc; border-color: #cbd5e1; }

    .knowledge-item.active {
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 12px 8px 8px 12px;
      font-weight: 600;
      color: #1e3a8a;
    }

    .knowledge-item.mastered { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .knowledge-item.mastered.active { background: #dcfce7; border-left-color: #16a34a; color: #14532d; }

    .mastered-badge {
      font-size: 0.65rem;
      color: #16a34a;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      margin-right: 2px;
    }

    .group-items .knowledge-item { margin-left: 4px; font-size: 0.9rem; padding: 10px 12px; }

    .item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.1s; }
    .knowledge-item:hover .item-actions,
    .knowledge-item.active .item-actions { opacity: 1; }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      line-height: 1;
    }

    .delete-btn:hover { background: #fee2e2; color: #dc2626; }

    .empty-list-msg {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      padding: 30px 10px;
      font-style: italic;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f7fc;
      -webkit-overflow-scrolling: touch;
      /* iOS 平滑滚动 */
      scroll-behavior: smooth;
    }

    .content-area.full-width { padding: 16px 16px 32px; }

    .content-area.recite-full {
      padding: 0;
      align-items: stretch;
      overflow: hidden;
    }

    .card-wrapper { width: 100%; max-width: 680px; margin: 0 auto; }

    .recite-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .recite-slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .recite-slide-inner {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .knowledge-card {
      background: #fff;
      border-radius: 28px;
      padding: 28px 28px 32px;
      box-shadow: 0 12px 30px rgba(0,20,50,0.08), 0 4px 8px rgba(0,0,0,0.02);
      border: 1px solid rgba(255,255,255,0.6);
      transition: background 0.25s ease, border-color 0.25s ease;
      word-break: break-word;
      cursor: pointer;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .card-content {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #1e293b;
      word-break: break-word;
      -webkit-user-select: none;
      user-select: none;
    }

    .card-images {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-images img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 3px solid #eef2ff;
    }

    .card-title-row .card-title {
      flex: 1;
      min-width: 0;
    }

    .speak-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #eff6ff;
      color: #2563eb;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin-top: -2px;
    }

    .speak-btn.speaking {
      background: #2563eb;
      color: #fff;
    }

    .mastery-slider-row { margin-top: 24px; width: 100%; }

    .mastery-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .mastery-slider-container {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      touch-action: none;
    }

    .mastery-track {
      position: absolute;
      left: 0; right: 0;
      height: 12px;
      border-radius: 6px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .mastery-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(to right, #94a3b8, #16a34a);
      border-radius: 6px 0 0 6px;
    }

    .mastery-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #94a3b8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transform: translate(-50%, -50%);
      cursor: grab;
      z-index: 2;
    }

    .mastery-thumb.dragging {
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .slide-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
      padding: 0 4px;
    }

    .slide-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
      border-radius: 50%;
    }

    .slide-nav-btn svg { width: 34px; height: 34px; display: block; }
    .slide-nav-btn svg path { fill: currentColor; }
    .slide-nav-btn:disabled { opacity: 0.22; cursor: not-allowed; }

    .slide-nav-position {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      padding: 4px 14px;
      background: rgba(255,255,255,0.75);
      border-radius: 20px;
      min-width: 64px;
      text-align: center;
    }

    .global-group-section { width: 100%; margin-bottom: 28px; }

    .global-group-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }

    .global-group-divider .divider-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .global-group-divider .divider-count {
      background: #eef2f6;
      color: #64748b;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .global-group-divider .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #e2e8f0, transparent);
    }

    .global-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .global-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 6px 16px rgba(0,20,50,0.08);
      border: 1px solid rgba(255,255,255,0.8);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 140px;
      overflow: hidden;
      position: relative;
      touch-action: none;
      user-select: none;
    }

    .global-card.mastered-global {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-color: #bbf7d0;
    }

    .global-card .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #eef2ff;
      color: #0f172a;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.7em;
      max-height: 2.7em;
    }

    .global-card.mastered-global .card-title { color: #14532d; border-bottom-color: #bbf7d0; }

    .global-card .card-content {
      font-size: 0.8rem;
      line-height: 1.5;
      color: #475569;
      overflow: hidden;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .mastered-check {
      position: absolute;
      bottom: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #16a34a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .drag-handle {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 0.7rem;
      color: #cbd5e1;
      letter-spacing: 2px;
      opacity: 0;
      pointer-events: none;
    }

    .global-card:hover .drag-handle { opacity: 1; }

    .edit-card {
      background: #fff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,20,50,0.08);
    }

    .input-group { margin-bottom: 18px; }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      font-size: 16px;
      font-family: inherit;
      background: #fafcff;
      outline: none;
      /* iOS 上防自动缩放 */
      -webkit-text-size-adjust: 100%;
    }

    .input-group input:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }

    .button-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

    .btn {
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1 0 auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background: #1e3a8a;
      color: #fff;
      border: none;
      box-shadow: 0 6px 14px rgba(30,58,138,0.25);
    }

    .btn-primary:hover { background: #1e40af; }
    .btn-secondary { background: #fff; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #f8fafc; }
    .btn:active { transform: scale(0.98); }

    .edit-data-actions { margin-top: 16px; display: flex; gap: 10px; }

    .edit-data-actions .data-btn {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .edit-data-actions .data-btn:hover { background: #f8fafc; color: #1e3a8a; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      background: #fff;
      border-radius: 28px;
      width: 100%;
    }

    .empty-state p { font-size: 1.1rem; margin-bottom: 16px; }

    .rich-editor-wrap {
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      background: #fafcff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .rich-editor-wrap:focus-within {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }

    .rich-toolbar {

  <script>
    // ============================================================
    // 尽早执行的 iOS PWA 检测：设置 --status-bar-offset
    // 目的：当 PWA 全屏时（standalone 模式），
    // apple-mobile-web-app-status-bar-style = black-translucent 会让内容延伸到状态栏下方。
    // 需要在顶部预留状态栏高度，否则 app-header 会被刘海/状态栏遮挡。
    // ============================================================
    (function() {
      function isStandalone() {
        return window.navigator.standalone === true ||
               window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches;
      }
      function update() {
        if (isStandalone()) {
          // 状态栏高度因设备而异，保守用 44px（iPhone 刘海/灵动岛）
          // 非刘海机型状态栏约 20px，44px 会稍微多留白但不会遮挡
          var isNotch = window.innerHeight >= 780;
          var offset = isNotch ? '44px' : '20px';
          document.documentElement.style.setProperty('--status-bar-offset', offset);
        } else {
          document.documentElement.style.setProperty('--status-bar-offset', '0px');
        }
      }
      update();
      window.addEventListener('resize', update);
      window.addEventListener('orientationchange', () => setTimeout(update, 100));
    })();
  </script>

  <script>
    (function(){
      'use strict';

      const SPEECH_CONFIG = { rate: 0.85, pitch: 1.0, volume: 1.0, lang: 'zh-CN' };
      const MASTERED_THRESHOLD = 100;
      const CLICK_DELAY = 250;
      const IMG_MAX_SIZE = 1200;
      const IMG_QUALITY = 0.8;
      const DB_NAME = 'knowledge_cards_db';
      const DB_VERSION = 1;
      const STORE_IMAGES = 'images';
      const STORAGE_KEY_ITEMS = 'knowledge_card_items_v3';
      const STORAGE_KEY_COLLAPSED = 'knowledge_collapsed_groups_v3';

      const PRESET_TEXT_COLORS = [
        { name: '正红', value: '#D0021B' },
        { name: '纯黑', value: '#000000' },
        { name: '深蓝', value: '#0B4F9E' },
        { name: '深绿', value: '#0F7B3A' },
        { name: '橙红', value: '#E85D04' }
      ];

      const PRESET_BG_COLORS = [
        { name: '亮黄', value: '#FFEB3B' },
        { name: '亮橙', value: '#FFB74D' },
        { name: '亮绿', value: '#81C784' },
        { name: '亮蓝', value: '#64B5F6' },
        { name: '亮粉', value: '#F48FB1' }
      ];

      const DEFAULT_TEXT_COLOR = PRESET_TEXT_COLORS[0].value;
      const DEFAULT_BG_COLOR = PRESET_BG_COLORS[0].value;

      const DEFAULT_ITEMS = [
        { id: '1', title: 'HTML 语义化', content: '使用恰当的 HTML 标签来构建页面结构，例如 header、nav、main、article、section、aside、footer。语义化有助于 SEO、可访问性和代码可读性。', group: '前端基础', masteryLevel: 0, images: [] },
        { id: '2', title: 'CSS 盒模型', content: '每个元素都是一个盒子。由内容(content)、内边距(padding)、边框(border)、外边距(margin)组成。box-sizing: border-box 使 width 包含 padding 和 border。', group: '前端基础', masteryLevel: 0, images: [] },
        { id: '3', title: 'JavaScript 闭包', content: '闭包是指函数能够记住并访问它的词法作用域，即使函数在其词法作用域之外执行。常用于创建私有变量和回调函数。', group: '前端基础', masteryLevel: 0, images: [] },
        { id: '4', title: 'HTTP 状态码', content: '1xx 信息，2xx 成功，3xx 重定向，4xx 客户端错误，5xx 服务端错误。常见：200 OK，301 永久重定向，404 未找到，500 服务器内部错误。', group: '网络基础', masteryLevel: 0, images: [] },
        { id: '5', title: 'Flex 布局', content: 'display: flex 创建弹性容器。justify-content 主轴对齐，align-items 交叉轴对齐，flex-direction 方向。flex: 1 占满剩余空间。', group: '前端基础', masteryLevel: 0, images: [] },
        { id: '6', title: 'Vue 响应式原理', content: 'Vue2 使用 Object.defineProperty 劫持数据，Vue3 使用 Proxy。当数据变化时触发依赖更新，重新渲染视图。', group: '框架', masteryLevel: 0, images: [] }
      ];

      const state = {
        items: [],
        activeId: null,
        mode: 'recite',
        isCreatingNew: false,
        collapsedGroups: {},
        reciteIndex: 0,
        importMode: 'merge',
        speakingId: null,
        confirmCallback: null,
        draftImages: [],
        editingSessionId: null,
        pendingCardClickTimer: null,
        lastTextColor: DEFAULT_TEXT_COLOR,
        lastBgColor: DEFAULT_BG_COLOR,
        formatPainterClip: null,
        formatPainterArmed: false,
        formatPainterEditorId: null
      };

      const $ = (sel) => document.querySelector(sel);
      const el = {
        knowledgeList: $('#knowledgeList'),
        contentArea: $('#contentArea'),
        globalModeBtn: $('#globalModeBtn'),
        reciteModeBtn: $('#reciteModeBtn'),
        editModeBtn: $('#editModeBtn'),
        counterBadge: $('#counterBadge'),
        sidebar: $('#sidebar'),
        offlineBanner: $('#offlineBanner'),
        toast: $('#toast'),
        exportModal: $('#exportModal'),
        exportTextarea: $('#exportTextarea'),
        exportStatus: $('#exportStatus'),
        importModal: $('#importModal'),
        importTextarea: $('#importTextarea'),
        importStatus: $('#importStatus'),
        fileDropZone: $('#fileDropZone'),
        fileInput: $('#fileInput'),
        importModeSelector: $('#importModeSelector'),
        confirmOverlay: $('#confirmOverlay'),
        confirmTitle: $('#confirmTitle'),
        confirmMessage: $('#confirmMessage'),
        confirmOk: $('#confirmOk'),
        confirmCancel: $('#confirmCancel')
      };

      let toastTimer = null;
      function showToast(msg, isError) {
        el.toast.textContent = msg;
        el.toast.className = 'toast show' + (isError ? ' error' : '');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2400);
      }

      function clearPendingCardClick() {
        if (state.pendingCardClickTimer) {
          clearTimeout(state.pendingCardClickTimer);
          state.pendingCardClickTimer = null;
        }
      }

      // ============================================================
      // 调色板注册表
      // ============================================================
      const paletteRegistry = new Map();
      let paletteBusBound = false;

      function bindPaletteBus() {
        if (paletteBusBound) return;
        paletteBusBound = true;

        // ★ iOS 修复：用 pointerdown 关闭，但要判断是不是刚打开（用时间戳抑制）
        let lastOpenTime = 0;
        const markOpen = () => { lastOpenTime = Date.now(); };
        window.__markPaletteOpen = markOpen;

        document.addEventListener('pointerdown', (e) => {
          // 刚打开 200ms 内不关闭，避免点击箭头本身触发 pointerdown 误关
          if (Date.now() - lastOpenTime < 200) return;
          if (!e.target.closest('.color-btn-group') && !e.target.closest('.color-palette')) {
            closeAllPalettes();
          }
        });

        document.addEventListener('click', (e) => {
          const palette = e.target.closest('.color-palette');
          if (!palette) return;
          const editorId = palette.dataset.paletteFor;
          const reg = paletteRegistry.get(editorId);
          if (!reg) return;

          const swatch = e.target.closest('.color-swatch');
          if (swatch) {
            e.preventDefault();
            e.stopPropagation();
            const kind = palette.dataset.paletteKind;
            const value = swatch.dataset.colorValue;
            reg.editor.focus({ preventScroll: true });
            reg.restoreSelection();
            reg.applyColor(kind, value);
            reg.updatePaletteSelection(palette, kind);
            closeAllPalettes();
            return;
          }
        });

        document.addEventListener('input', (e) => {
          const input = e.target.closest('.color-custom-input');
          if (!input) return;
          const palette = input.closest('.color-palette');
          if (!palette) return;
          const editorId = palette.dataset.paletteFor;
          const reg = paletteRegistry.get(editorId);
          if (!reg) return;
          const kind = palette.dataset.paletteKind;
          reg.editor.focus({ preventScroll: true });
          reg.restoreSelection();
          reg.applyColor(kind, input.value);
          reg.updatePaletteSelection(palette, kind);
        });
      }

      function closeAllPalettes() {
        document.querySelectorAll('.color-palette.show').forEach(p => p.classList.remove('show'));
        document.querySelectorAll('.color-btn-group.open').forEach(g => g.classList.remove('open'));
      }

      function positionPalette(palette, anchorEl) {
        const rect = anchorEl.getBoundingClientRect();
        const pw = palette.offsetWidth || 260;
        const ph = palette.offsetHeight || 200;

        let left = rect.left;
        if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
        if (left < 8) left = 8;
        palette.style.left = left + 'px';

        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < ph + 12 && rect.top > ph + 12) {
          palette.style.top = 'auto';
          palette.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
        } else {
          palette.style.bottom = 'auto';
          palette.style.top = (rect.bottom + 6) + 'px';
        }
      }

      // ---------- IndexedDB（iOS 首次打开延迟重试）----------
      let dbPromise = null;
      function getDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) { reject(new Error('IndexedDB 不可用')); return; }
          let retried = false;
          const tryOpen = () => {
            try {
              const req = indexedDB.open(DB_NAME, DB_VERSION);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_IMAGES)) {
                  db.createObjectStore(STORE_IMAGES, { keyPath: 'id' });
                }
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => {
                if (!retried) {
                  retried = true;
                  // iOS 上首次 IndexedDB 打开可能失败，延时重试一次
                  setTimeout(() => { dbPromise = null; tryOpen(); }, 300);
                } else {
                  reject(req.error);
                }
              };
            } catch (e) {
              reject(e);
            }
          };
          tryOpen();
        });
        return dbPromise;
      }

      async function saveImage(id, dataUrl) {
        const db = await getDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_IMAGES, 'readwrite');
          tx.objectStore(STORE_IMAGES).put({ id, dataUrl });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function getImage(id) {
        try {
          const db = await getDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_IMAGES, 'readonly');
            const req = tx.objectStore(STORE_IMAGES).get(id);
            req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
            req.onerror = () => reject(req.error);
          });
        } catch (e) { return null; }
      }

      const imageCache = new Map();
      const pendingImageLoads = new Map();

      async function resolveImageArray(images) {
        if (!Array.isArray(images) || images.length === 0) return [];
        const results = [];
        for (const ref of images) {
          if (!ref) continue;
          if (ref.startsWith('data:image/')) {
            results.push(ref);
          } else if (ref.startsWith('img://')) {
            const id = ref.slice(6);
            if (imageCache.has(id)) {
              results.push(imageCache.get(id));
            } else {
              let promise = pendingImageLoads.get(id);
              if (!promise) {
                promise = getImage(id).then((dataUrl) => {
                  pendingImageLoads.delete(id);
                  if (dataUrl) imageCache.set(id, dataUrl);
                  return dataUrl;
                });
                pendingImageLoads.set(id, promise);
              }
              const dataUrl = await promise;
              if (dataUrl) results.push(dataUrl);
            }
          } else if (/^https?:\/\//i.test(ref)) {
            results.push(ref);
          }
        }
        return results;
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function htmlToPlainText(html) {
        if (!html) return '';
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function hasHtmlTags(str) {
        return /<[a-z][\s\S]*>/i.test(str || '');
      }

      function toHtmlContent(content) {
        if (!content) return '';
        if (hasHtmlTags(content)) return sanitizeHtml(content);
        return escapeHtml(content).replace(/\n/g, '<br>');
      }

      const ALLOWED_TAGS = new Set(['B', 'STRONG', 'U', 'I', 'EM', 'SPAN', 'BR', 'DIV', 'P', 'MARK', 'FONT']);
      const ALLOWED_ATTRS = {
        'SPAN': ['style'], 'DIV': ['style'], 'P': ['style'],
        'FONT': ['color', 'style'], 'MARK': ['style']
      };
      const ALLOWED_STYLE_PROPS = new Set([
        'font-weight', 'text-decoration', 'color', 'background-color',
        'background', 'font-style'
      ]);

      function sanitizeStyle(style) {
        const result = [];
        String(style).split(';').forEach(decl => {
          const idx = decl.indexOf(':');
          if (idx === -1) return;
          const prop = decl.slice(0, idx).trim().toLowerCase();
          const val = decl.slice(idx + 1).trim();
          if (!ALLOWED_STYLE_PROPS.has(prop)) return;
          if (/expression|javascript:|url\s*\(/i.test(val)) return;
          result.push(`${prop}: ${val}`);
        });
        return result.join('; ');
      }

      function sanitizeHtml(html) {
        if (!html) return '';
        const template = document.createElement('template');
        template.innerHTML = String(html);
        const walker = document.createTreeWalker(
          template.content,
          NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT,
          null
        );
        const toRemove = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeType === Node.COMMENT_NODE) { toRemove.push(node); continue; }
          const tag = node.tagName;
          if (!ALLOWED_TAGS.has(tag)) {
            const frag = document.createDocumentFragment();
            while (node.firstChild) frag.appendChild(node.firstChild);
            node.parentNode.replaceChild(frag, node);
            continue;
          }
          const allowed = ALLOWED_ATTRS[tag] || [];
          Array.from(node.attributes).forEach(attr => {
            if (!allowed.includes(attr.name.toLowerCase())) node.removeAttribute(attr.name);
          });
          if (node.hasAttribute('style')) {
            const safeStyle = sanitizeStyle(node.getAttribute('style'));
            if (safeStyle) node.setAttribute('style', safeStyle);
            else node.removeAttribute('style');
          }
        }
        toRemove.forEach(n => n.parentNode && n.parentNode.removeChild(n));
        return template.innerHTML;
      }

      const masteryColorCache = new Map();
      function getMasteryColor(level) {
        level = Math.max(0, Math.min(100, level));
        if (masteryColorCache.has(level)) return masteryColorCache.get(level);
        const t = level / 100;
        const r = Math.round(148 + (22 - 148) * t);
        const g = Math.round(163 + (163 - 163) * t);
        const b = Math.round(184 + (74 - 184) * t);
        const color = `rgb(${r}, ${g}, ${b})`;
        masteryColorCache.set(level, color);
        return color;
      }

      function getCardBackground(level) {
        if (level === 0) return '#ffffff';
        const t = level / 100;
        const r = Math.round(255 + (220 - 255) * t);
        const g = Math.round(255 + (252 - 255) * t);
        const b = Math.round(255 + (231 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function getCardBorderColor(level) {
        if (level === 0) return 'rgba(255, 255, 255, 0.6)';
        const t = level / 100;
        const r = Math.round(255 + (187 - 255) * t);
        const g = Math.round(255 + (247 - 255) * t);
        const b = Math.round(255 + (208 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function normalizeItem(item) {
        let level = 0;
        if (typeof item.masteryLevel === 'number') {
          level = Math.max(0, Math.min(100, item.masteryLevel));
        } else if (item.mastered === true) {
          level = 100;
        }
        let images = [];
        if (Array.isArray(item.images)) {
          images = item.images.filter(x => typeof x === 'string' && x);
        }
        return {
          id: item.id || generateId(),
          title: item.title || '无标题',
          content: toHtmlContent(item.content || ''),
          group: item.group || '',
          masteryLevel: level,
          images
        };
      }

      function loadFromStorage() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_ITEMS);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed
                .filter(item => item && item.title !== undefined)
                .map(normalizeItem);
            }
          }
        } catch (e) { console.warn('读取失败', e); }
        return DEFAULT_ITEMS.map(item => ({ ...item, content: toHtmlContent(item.content) }));
      }

      function loadCollapsedState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_COLLAPSED);
          return stored ? JSON.parse(stored) : {};
        } catch (e) { return {}; }
      }

      let saveTimer = null;
      function saveToStorage() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          saveTimer = null;
          try {
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(state.items));
          } catch (e) {
            console.warn('保存失败', e);
            showToast('⚠️ 保存失败，数据量过大', true);
          }
        }, 300);
      }

      function saveCollapsedState() {
        try {
          localStorage.setItem(STORAGE_KEY_COLLAPSED, JSON.stringify(state.collapsedGroups));
        } catch (e) {}
      }

      const speechSupported = 'speechSynthesis' in window;

      function stopSpeaking() {
        if (speechSupported) window.speechSynthesis.cancel();
        state.speakingId = null;
        document.querySelectorAll('.speak-btn.speaking').forEach(btn => {
          btn.classList.remove('speaking');
          btn.textContent = '🔊';
        });
      }

      function getChineseVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return null;
        return voices.find(v => v.lang === 'zh-CN' && v.localService)
          || voices.find(v => v.lang === 'zh-CN')
          || voices.find(v => v.lang && v.lang.startsWith('zh'))
          || null;
      }

      function normalizeSpeechText(raw) {
        if (!raw) return '';
        return String(raw)
          .replace(/\n+/g, '。')
          .replace(/。{2,}/g, '。')
          .replace(/\s+([，。！？；：、])/g, '$1')
          .replace(/([，。！？；：、])\s+/g, '$1')
          .trim();
      }

      function speakItem(item) {
        if (!speechSupported) { showToast('当前浏览器不支持语音朗读', true); return; }
        if (state.speakingId === item.id) { stopSpeaking(); return; }
        window.speechSynthesis.cancel();

        const title = normalizeSpeechText(item.title);
        const content = normalizeSpeechText(htmlToPlainText(item.content || ''));
        let text = title;
        if (content) text += '。' + content;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = SPEECH_CONFIG.rate;
        utterance.pitch = SPEECH_CONFIG.pitch;
        utterance.volume = SPEECH_CONFIG.volume;
        utterance.lang = SPEECH_CONFIG.lang;
        const voice = getChineseVoice();
        if (voice) utterance.voice = voice;

        utterance.onend = utterance.onerror = () => {
          state.speakingId = null;
          const btn = document.querySelector(`.speak-btn[data-speak-id="${item.id}"]`);
          if (btn) { btn.classList.remove('speaking'); btn.textContent = '🔊'; }
        };

        state.speakingId = item.id;
        const btn = document.querySelector(`.speak-btn[data-speak-id="${item.id}"]`);
        if (btn) { btn.classList.add('speaking'); btn.textContent = '⏸'; }
        window.speechSynthesis.speak(utterance);
      }

      function showConfirm(title, message, onConfirm) {
        el.confirmTitle.textContent = title;
        el.confirmMessage.textContent = message;
        state.confirmCallback = onConfirm;
        el.confirmOverlay.classList.add('show');
      }

      function closeConfirm() {
        el.confirmOverlay.classList.remove('show');
        state.confirmCallback = null;
      }

      el.confirmOk.addEventListener('click', () => {
        const cb = state.confirmCallback;
        closeConfirm();
        if (cb) cb();
      });
      el.confirmCancel.addEventListener('click', closeConfirm);
      el.confirmOverlay.addEventListener('click', (e) => {
        if (e.target === el.confirmOverlay) closeConfirm();
      });

      // ---------- 侧边栏 ----------
      let sidebarRendered = false;

      function renderSidebar(force) {
        if (!force && sidebarRendered) { updateSidebarActive(); return; }
        sidebarRendered = true;

        if (state.items.length === 0) {
          el.knowledgeList.innerHTML = '<div class="empty-list-msg">暂无知识点</div>';
          el.counterBadge.textContent = '0';
          return;
        }

        const groups = getAllGroups();
        const ungroupedItems = state.items.filter(item => !item.group || !item.group.trim());
        let html = '';

        groups.forEach(groupName => {
          const groupItems = state.items.filter(item => item.group && item.group.trim() === groupName);
          const isCollapsed = state.collapsedGroups[groupName] === true;
          html += `
            <div class="group-section ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(groupName)}">
              <div class="group-header" data-action="toggle-group" data-group="${escapeHtml(groupName)}">
                <span class="group-arrow">▼</span>
                <span class="group-name">${escapeHtml(groupName)}</span>
                <span class="group-count">${groupItems.length}</span>
                <div class="group-actions">
                  <button class="group-action-btn delete-group" data-action="delete-group" data-group="${escapeHtml(groupName)}" title="删除该组">✕</button>
                </div>
              </div>
              <div class="group-items">
                ${groupItems.map(renderKnowledgeItem).join('')}
              </div>
            </div>
          `;
        });

        if (ungroupedItems.length > 0) {
          if (groups.length > 0) html += '<div class="ungrouped-label">未分组</div>';
          html += ungroupedItems.map(renderKnowledgeItem).join('');
        }

        el.knowledgeList.innerHTML = html;
        el.counterBadge.textContent = state.items.length;
      }

      function updateSidebarActive() {
        const items = el.knowledgeList.querySelectorAll('.knowledge-item');
        items.forEach(item => {
          const id = item.dataset.id;
          const active = id === state.activeId && !state.isCreatingNew;
          item.classList.toggle('active', active);
          const data = state.items.find(i => i.id === id);
          if (data) item.classList.toggle('mastered', (data.masteryLevel || 0) >= MASTERED_THRESHOLD);
        });
      }

      function renderKnowledgeItem(item) {
        const isActive = item.id === state.activeId && !state.isCreatingNew;
        const displayTitle = item.title.length > 12 ? item.title.slice(0, 10) + '…' : item.title;
        const masteredClass = (item.masteryLevel || 0) >= MASTERED_THRESHOLD ? 'mastered' : '';
        const masteredBadge = masteredClass ? '<span class="mastered-badge">✓</span>' : '';
        return `
          <div class="knowledge-item ${isActive ? 'active' : ''} ${masteredClass}" data-id="${item.id}" data-action="select-item">
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${masteredBadge}${escapeHtml(displayTitle)}</span>
            <div class="item-actions">
              <button class="delete-btn" data-action="delete-item" data-id="${item.id}" title="删除">✕</button>
            </div>
          </div>
        `;
      }

      function getAllGroups() {
        const groups = new Set();
        state.items.forEach(item => {
          if (item.group && item.group.trim()) groups.add(item.group.trim());
        });
        return Array.from(groups).sort();
      }

      el.knowledgeList.addEventListener('click', (e) => {
        const action = e.target.closest('[data-action]');
        if (!action) return;
        const act = action.dataset.action;

        if (act === 'toggle-group') {
          const groupName = action.dataset.group;
          if (!groupName) return;
          state.collapsedGroups[groupName] = !state.collapsedGroups[groupName];
          saveCollapsedState();
          const section = action.closest('.group-section');
          if (section) section.classList.toggle('collapsed', state.collapsedGroups[groupName]);
          return;
        }

        if (act === 'delete-group') { e.stopPropagation(); deleteGroup(action.dataset.group); return; }
        if (act === 'delete-item') { e.stopPropagation(); deleteKnowledgeItem(action.dataset.id); return; }

        if (act === 'select-item') {
          const id = action.dataset.id;
          if (!id) return;
          if (id !== state.activeId || state.isCreatingNew) {
            state.activeId = id;
            state.isCreatingNew = false;
            state.editingSessionId = null;
            state.draftImages = [];
            state.formatPainterArmed = false;
            state.formatPainterClip = null;
            state.formatPainterEditorId = null;
            clearPendingCardClick();
            if (state.mode === 'global') {
              setMode('recite');
            } else {
              updateSidebarActive();
              renderContent();
            }
          } else if (state.mode === 'global') {
            setMode('recite');
          }
        }
      });

      function deleteGroup(groupName) {
        const count = state.items.filter(item => item.group === groupName).length;
        showConfirm('删除分组', `确定要删除分组「${groupName}」吗？\n组内 ${count} 个知识点将变为未分组状态。`, () => {
          state.items.forEach(item => {
            if (item.group === groupName) item.group = '';
          });
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast('已删除分组');
        });
      }

      function deleteKnowledgeItem(id) {
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        showConfirm('删除知识点', `确定要删除知识点「${item.title}」吗？`, () => {
          if (state.speakingId === id) stopSpeaking();
          const idx = state.items.findIndex(i => i.id === id);
          if (idx !== -1) state.items.splice(idx, 1);
          if (state.activeId === id) {
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
            state.isCreatingNew = false;
          }
          state.editingSessionId = null;
          state.draftImages = [];
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast('已删除');
        });
      }

      function renderContent() {
        validateActiveId();

        if (state.mode === 'global') {
          el.sidebar.classList.add('hidden-sidebar');
          el.contentArea.classList.add('full-width');
          el.contentArea.classList.remove('recite-full');
        } else if (state.mode === 'recite') {
          el.sidebar.classList.add('hidden-sidebar');
          el.contentArea.classList.add('recite-full');
          el.contentArea.classList.remove('full-width');
        } else {
          el.sidebar.classList.remove('hidden-sidebar');
          el.contentArea.classList.remove('full-width');
          el.contentArea.classList.remove('recite-full');
        }

        if (state.speakingId) stopSpeaking();

        if (state.mode === 'global') renderGlobalMode();
        else if (state.mode === 'recite') renderReciteMode();
        else renderEditMode();

        updateSidebarAddButton();
      }

      function validateActiveId() {
        if (state.isCreatingNew) return;
        if (!state.items.some(item => item.id === state.activeId)) {
          state.activeId = state.items.length > 0 ? state.items[0].id : null;
        }
      }

      // ---------- 全局模式 ----------
      let globalClickBound = false;

      function renderGlobalMode() {
        if (state.items.length === 0) {
          el.contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const groups = getAllGroups();
        const ungroupedItems = state.items.filter(item => !item.group || !item.group.trim());
        let html = '';

        groups.forEach(groupName => {
          const groupItems = state.items.filter(item => item.group && item.group.trim() === groupName);
          if (groupItems.length === 0) return;
          const sorted = [
            ...groupItems.filter(i => (i.masteryLevel || 0) < MASTERED_THRESHOLD),
            ...groupItems.filter(i => (i.masteryLevel || 0) >= MASTERED_THRESHOLD)
          ];
          html += `
            <div class="global-group-section" data-group="${escapeHtml(groupName)}">
              <div class="global-group-divider">
                <span class="divider-name"><span>📁</span>${escapeHtml(groupName)}</span>
                <span class="divider-count">${groupItems.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${sorted.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        });

        if (ungroupedItems.length > 0) {
          const sorted = [
            ...ungroupedItems.filter(i => (i.masteryLevel || 0) < MASTERED_THRESHOLD),
            ...ungroupedItems.filter(i => (i.masteryLevel || 0) >= MASTERED_THRESHOLD)
          ];
          html += `
            <div class="global-group-section ungrouped-section" data-group="">
              <div class="global-group-divider">
                <span class="divider-name"><span>📄</span>未分组</span>
                <span class="divider-count">${ungroupedItems.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${sorted.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        }

        el.contentArea.innerHTML = html;

        if (!globalClickBound) {
          el.contentArea.addEventListener('click', globalCardClickHandler);
          globalClickBound = true;
        }

        initGlobalDragSort();
      }

      function globalCardClickHandler(e) {
        const card = e.target.closest('.global-card');
        if (!card) return;
        if (card.dataset.dragMoved === 'true') return;
        const id = card.dataset.id;
        if (id) {
          state.activeId = id;
          state.isCreatingNew = false;
          clearPendingCardClick();
          setMode('recite');
        }
      }

      function renderGlobalCard(item) {
        const masteredClass = (item.masteryLevel || 0) >= MASTERED_THRESHOLD ? 'mastered-global' : '';
        const masteredCheck = masteredClass ? '<span class="mastered-check">✓</span>' : '';
        const plainText = htmlToPlainText(item.content) || '';
        const hasImages = Array.isArray(item.images) && item.images.length > 0;
        const imgBadge = hasImages ? '<span style="position:absolute;top:6px;right:8px;font-size:0.7rem;">🖼️</span>' : '';
        return `
          <div class="global-card ${masteredClass}" data-id="${item.id}">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-content">${escapeHtml(plainText) || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
            ${masteredCheck}
            ${imgBadge}
            <span class="drag-handle">⠿</span>
          </div>
        `;
      }

      // ---------- 全局拖拽 ----------
      let globalDragCleanup = null;

      function initGlobalDragSort() {
        if (globalDragCleanup) globalDragCleanup();

        let draggedElement = null;
        let placeholder = null;
        let startX = 0, startY = 0;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let activeMoveHandler = null;
        let activeUpHandler = null;

        const cards = el.contentArea.querySelectorAll('.global-card');
        cards.forEach(card => {
          card.addEventListener('mousedown', onMouseDown);
          card.addEventListener('touchstart', onTouchStart, { passive: true });
        });

        function onMouseDown(e) {
          if (e.button !== 0) return;
          startDrag(e.clientX, e.clientY, e.currentTarget);
        }
        function onTouchStart(e) {
          const touch = e.touches[0];
          startDrag(touch.clientX, touch.clientY, e.currentTarget);
        }

        function startDrag(clientX, clientY, card) {
          startX = clientX;
          startY = clientY;
          isDragging = false;
          card.dataset.dragMoved = 'false';
          const rect = card.getBoundingClientRect();
          dragOffsetX = clientX - rect.left;
          dragOffsetY = clientY - rect.top;

          activeMoveHandler = (moveEvent) => {
            const moveX = moveEvent.clientX !== undefined ? moveEvent.clientX : moveEvent.touches[0].clientX;
            const moveY = moveEvent.clientY !== undefined ? moveEvent.clientY : moveEvent.touches[0].clientY;
            const deltaX = Math.abs(moveX - startX);
            const deltaY = Math.abs(moveY - startY);
            if (!isDragging && (deltaX > 6 || deltaY > 6)) {
              isDragging = true;
              beginDrag(card);
            }
            if (isDragging) {
              moveEvent.preventDefault();
              updateDragPosition(moveX, moveY);
              handleDragOver(moveX, moveY);
            }
          };

          activeUpHandler = () => {
            document.removeEventListener('mousemove', activeMoveHandler);
            document.removeEventListener('mouseup', activeUpHandler);
            document.removeEventListener('touchmove', activeMoveHandler);
            document.removeEventListener('touchend', activeUpHandler);
            if (isDragging) endDrag();
            setTimeout(() => { if (card) card.dataset.dragMoved = 'false'; }, 0);
          };

          document.addEventListener('mousemove', activeMoveHandler);
          document.addEventListener('mouseup', activeUpHandler);
          document.addEventListener('touchmove', activeMoveHandler, { passive: false });
          document.addEventListener('touchend', activeUpHandler);
        }

        function beginDrag(card) {
          draggedElement = card;
          card.classList.add('dragging');
          card.dataset.dragMoved = 'true';
          placeholder = document.createElement('div');
          placeholder.className = 'global-card';
          placeholder.style.visibility = 'hidden';
          placeholder.style.height = card.offsetHeight + 'px';
          placeholder.style.width = card.offsetWidth + 'px';
          placeholder.style.pointerEvents = 'none';
          placeholder.dataset.placeholder = 'true';

          const rect = card.getBoundingClientRect();
          card.style.position = 'fixed';
          card.style.left = rect.left + 'px';
          card.style.top = rect.top + 'px';
          card.style.width = rect.width + 'px';
          card.style.height = rect.height + 'px';
          card.style.zIndex = '1000';
          card.style.pointerEvents = 'none';
          card.parentNode.insertBefore(placeholder, card);
        }

        function updateDragPosition(clientX, clientY) {
          if (!draggedElement) return;
          draggedElement.style.left = (clientX - dragOffsetX) + 'px';
          draggedElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragOver(clientX, clientY) {
          if (!draggedElement || !placeholder) return;
          const elemBelow = document.elementFromPoint(clientX, clientY);
          if (!elemBelow) return;
          const targetCard = elemBelow.closest('.global-card');
          if (!targetCard || targetCard === draggedElement || targetCard === placeholder) return;
          const targetGrid = targetCard.closest('.global-grid');
          if (!targetGrid) return;

          const targetRect = targetCard.getBoundingClientRect();
          const middleY = targetRect.top + targetRect.height / 2;
          const middleX = targetRect.left + targetRect.width / 2;
          const insertBefore = (clientY < middleY) ||
            (Math.abs(clientY - middleY) < targetRect.height / 2 && clientX < middleX);

          if (insertBefore) targetGrid.insertBefore(placeholder, targetCard);
          else if (targetCard.nextSibling) targetGrid.insertBefore(placeholder, targetCard.nextSibling);
          else targetGrid.appendChild(placeholder);
        }

        function endDrag() {
          if (!draggedElement || !placeholder) return;
          placeholder.parentNode.insertBefore(draggedElement, placeholder);
          placeholder.remove();
          draggedElement.classList.remove('dragging');
          draggedElement.style.position = '';
          draggedElement.style.left = '';
          draggedElement.style.top = '';
          draggedElement.style.width = '';
          draggedElement.style.height = '';
          draggedElement.style.zIndex = '';
          draggedElement.style.pointerEvents = '';

          updateDataOrderFromDOM();
          draggedElement = null;
          placeholder = null;
          isDragging = false;
        }

        globalDragCleanup = () => {
          if (activeMoveHandler) document.removeEventListener('mousemove', activeMoveHandler);
          if (activeUpHandler) document.removeEventListener('mouseup', activeUpHandler);
          if (activeMoveHandler) document.removeEventListener('touchmove', activeMoveHandler);
          if (activeUpHandler) document.removeEventListener('touchend', activeUpHandler);
        };
      }

      function updateDataOrderFromDOM() {
        const sections = el.contentArea.querySelectorAll('.global-group-section');
        const newOrderedIds = [];
        const idToGroup = {};
        sections.forEach(section => {
          const groupName = section.dataset.group || '';
          section.querySelectorAll('.global-card:not([data-placeholder])').forEach(card => {
            const id = card.dataset.id;
            if (id) {
              newOrderedIds.push(id);
              idToGroup[id] = groupName;
            }
          });
        });
        if (newOrderedIds.length !== state.items.length) return;

        const itemMap = new Map(state.items.map(i => [i.id, i]));
        const newItems = [];
        newOrderedIds.forEach(id => {
          const item = itemMap.get(id);
          if (item) {
            item.group = idToGroup[id] || '';
            newItems.push(item);
          }
        });
        state.items = newItems;
        saveToStorage();
        renderSidebar(true);
      }

      // ---------- 背诵模式 ----------
      let reciteRenderToken = 0;

      async function renderReciteMode() {
        clearPendingCardClick();

        if (state.items.length === 0) {
          el.contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const currentIndex = state.items.findIndex(item => item.id === state.activeId);
        state.reciteIndex = currentIndex >= 0 ? currentIndex : 0;
        if (state.reciteIndex >= state.items.length) state.reciteIndex = state.items.length - 1;

        const token = ++reciteRenderToken;
        const item = state.items[state.reciteIndex];
        const resolvedImages = await resolveImageArray(item.images);
        if (token !== reciteRenderToken) return;

        const prevArrowSvg = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 28 6 L 12 20 L 28 34 Z"/></svg>';
        const nextArrowSvg = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 12 6 L 28 20 L 12 34 Z"/></svg>';

        const idx = state.reciteIndex;

        const groupTag = item.group && item.group.trim()
          ? `<div style="font-size:0.75rem;color:#64748b;background:#f1f5f9;display:inline-block;padding:3px 12px;border-radius:20px;margin-bottom:12px;">📁 ${escapeHtml(item.group)}</div>`
          : '';

        const speakBtnHtml = speechSupported
          ? `<button class="speak-btn" data-action="speak" data-speak-id="${item.id}" title="朗读">🔊</button>`
          : '';

        let imagesHtml = '';
        if (resolvedImages.length > 0) {
          imagesHtml = `
            <div class="card-images">
              ${resolvedImages.map(src => `<img src="${src}" alt="知识点图片" loading="lazy">`).join('')}
            </div>
          `;
        }

        el.contentArea.innerHTML = `
          <div class="recite-container">
            <div class="recite-slide">
              <div class="recite-slide-inner">
                <div class="knowledge-card" data-card-id="${item.id}">
                  ${groupTag}
                  <div class="card-title-row">
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${speakBtnHtml}
                  </div>
                  <div class="card-content">${item.content || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
                  ${imagesHtml}
                </div>
                <div class="mastery-slider-row">
                  <div class="mastery-labels">
                    <span class="left-label">😵 不熟</span>
                    <span class="right-label">🤩 熟记</span>
                  </div>
                  <div class="mastery-slider-container" data-slider-id="${item.id}">
                    <div class="mastery-track">
                      <div class="mastery-fill" data-fill-id="${item.id}"></div>
                    </div>
                    <div class="mastery-thumb" data-thumb-id="${item.id}"></div>
                  </div>
                  <div class="slide-nav-row">
                    <button class="slide-nav-btn" data-action="nav-prev" title="上一个" ${idx === 0 ? 'disabled' : ''}>${prevArrowSvg}</button>
                    <span class="slide-nav-position">${idx + 1} / ${state.items.length}</span>
                    <button class="slide-nav-btn" data-action="nav-next" title="下一个" ${idx === state.items.length - 1 ? 'disabled' : ''}>${nextArrowSvg}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        initMasterySlider(item.id);
        updateSliderVisuals(item.id, item.masteryLevel || 0);
        bindReciteEvents();
      }

      function bindReciteEvents() {
        const area = el.contentArea;
        area.querySelectorAll('[data-action="nav-prev"]').forEach(btn => {
          btn.addEventListener('click', (e) => { e.stopPropagation(); goToPrev(); });
        });
        area.querySelectorAll('[data-action="nav-next"]').forEach(btn => {
          btn.addEventListener('click', (e) => { e.stopPropagation(); goToNext(); });
        });
        area.querySelectorAll('[data-action="speak"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.speakId;
            const item = state.items.find(i => i.id === id);
            if (item) speakItem(item);
          });
        });

        const card = area.querySelector('.knowledge-card');
        if (card) {
          let clickCount = 0;
          const cardId = card.dataset.cardId;
          card.addEventListener('click', (e) => {
            if (e.target.closest('.speak-btn')) return;
            if (e.target.closest('img')) return;
            if (window.getSelection && window.getSelection().toString()) return;

            clickCount++;
            if (clickCount === 1) {
              state.pendingCardClickTimer = setTimeout(() => {
                state.pendingCardClickTimer = null;
                clickCount = 0;
                const currentCard = el.contentArea.querySelector('.knowledge-card');
                if (currentCard && currentCard.dataset.cardId === cardId) {
                  setMode('global');
                }
              }, CLICK_DELAY);
            } else if (clickCount === 2) {
              clearPendingCardClick();
              clickCount = 0;
              if (cardId) { state.activeId = cardId; state.isCreatingNew = false; }
              setMode('edit');
            }
          });
        }
      }

      function goToPrev() {
        if (state.reciteIndex <= 0) return;
        clearPendingCardClick();
        if (state.speakingId) stopSpeaking();
        state.reciteIndex--;
        state.activeId = state.items[state.reciteIndex].id;
        renderReciteMode();
        updateSidebarActive();
      }

      function goToNext() {
        if (state.reciteIndex >= state.items.length - 1) return;
        clearPendingCardClick();
        if (state.speakingId) stopSpeaking();
        state.reciteIndex++;
        state.activeId = state.items[state.reciteIndex].id;
        renderReciteMode();
        updateSidebarActive();
      }

      let sliderCleanup = null;
      function initMasterySlider(itemId) {
        if (sliderCleanup) sliderCleanup();

        const container = document.querySelector(`.mastery-slider-container[data-slider-id="${itemId}"]`);
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!container || !thumb || !fill) return;

        let isDragging = false;
        let currentLevel = (state.items.find(i => i.id === itemId) || {}).masteryLevel || 0;
        let activeMove = null;
        let activeUp = null;

        const scope = card ? (card.closest('.recite-slide-inner') || document) : document;

        function getLevelFromX(clientX) {
          const rect = container.getBoundingClientRect();
          const x = clientX - rect.left;
          return Math.round(Math.max(0, Math.min(1, x / rect.width)) * 100);
        }

        function applyLevel(level, save) {
          currentLevel = level;
          fill.style.width = level + '%';
          thumb.style.left = level + '%';
          const color = getMasteryColor(level);
          thumb.style.borderColor = color;
          thumb.style.background = level > 0 ? color : '#fff';
          if (card) {
            card.style.background = getCardBackground(level);
            card.style.borderColor = getCardBorderColor(level);
          }
          const leftLabel = scope.querySelector('.left-label');
          const rightLabel = scope.querySelector('.right-label');
          if (leftLabel) leftLabel.style.color = level < 50 ? '#64748b' : '#cbd5e1';
          if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : '#cbd5e1';
          if (save) {
            const dataItem = state.items.find(i => i.id === itemId);
            if (dataItem) {
              dataItem.masteryLevel = level;
              saveToStorage();
              updateSidebarActive();
            }
          }
        }

        function onStart(clientX) {
          isDragging = true;
          thumb.classList.add('dragging');
          applyLevel(getLevelFromX(clientX), false);
        }
        function onMove(clientX) { if (isDragging) applyLevel(getLevelFromX(clientX), false); }
        function onEnd() {
          if (!isDragging) return;
          isDragging = false;
          thumb.classList.remove('dragging');
          let finalLevel = currentLevel;
          if (currentLevel < 5) finalLevel = 0;
          else if (currentLevel > 95) finalLevel = 100;
          applyLevel(finalLevel, true);
        }

        function startMouse(clientX) {
          onStart(clientX);
          activeMove = (ev) => onMove(ev.clientX);
          activeUp = () => {
            document.removeEventListener('mousemove', activeMove);
            document.removeEventListener('mouseup', activeUp);
            onEnd();
          };
          document.addEventListener('mousemove', activeMove);
          document.addEventListener('mouseup', activeUp);
        }

        thumb.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); startMouse(e.clientX); });
        container.addEventListener('mousedown', (e) => {
          if (e.target === thumb) return;
          e.preventDefault(); e.stopPropagation();
          startMouse(e.clientX);
        });

        thumb.addEventListener('touchstart', (e) => { e.stopPropagation(); onStart(e.touches[0].clientX); }, { passive: true });
        container.addEventListener('touchstart', (e) => {
          if (e.target === thumb) return;
          e.stopPropagation();
          onStart(e.touches[0].clientX);
        }, { passive: true });

        const touchMove = (e) => { if (isDragging) { e.preventDefault(); onMove(e.touches[0].clientX); } };
        container.addEventListener('touchmove', touchMove, { passive: false });
        container.addEventListener('touchend', onEnd);
        container.addEventListener('touchcancel', onEnd);

        sliderCleanup = () => {
          if (activeMove) document.removeEventListener('mousemove', activeMove);
          if (activeUp) document.removeEventListener('mouseup', activeUp);
        };
      }

      function updateSliderVisuals(itemId, level) {
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!thumb || !fill) return;
        fill.style.width = level + '%';
        thumb.style.left = level + '%';
        const color = getMasteryColor(level);
        thumb.style.borderColor = color;
        thumb.style.background = level > 0 ? color : '#fff';
        if (card) {
          card.style.background = getCardBackground(level);
          card.style.borderColor = getCardBorderColor(level);
        }
        const scope = card ? (card.closest('.recite-slide-inner') || document) : document;
        const leftLabel = scope.querySelector('.left-label');
        const rightLabel = scope.querySelector('.right-label');
        if (leftLabel) leftLabel.style.color = level < 50 ? '#64748b' : '#cbd5e1';
        if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : '#cbd5e1';
      }

      // ============================================================
      // 富文本编辑器
      // ============================================================
      function buildColorButtonHtml(editorId, kind, currentColor) {
        const isText = kind === 'text';
        const label = isText ? 'A' : '◐';
        const title = isText ? '字体颜色' : '背景色';
        return `
          <div class="color-btn-group" data-color-group="${editorId}-${kind}">
            <button type="button" class="color-btn-main" data-color-action="apply-current" data-color-kind="${kind}" data-editor-id="${editorId}" title="${title}">
              ${label}
              <span class="color-bar" style="background:${currentColor};"></span>
            </button>
            <button type="button" class="color-btn-arrow" data-color-action="toggle-palette" data-color-kind="${kind}" data-editor-id="${editorId}" title="选择颜色" aria-label="展开调色板">▼</button>
          </div>
        `;
      }

      function buildPaletteHtml(editorId, kind) {
        const isText = kind === 'text';
        const paletteId = `palette-${editorId}-${kind}`;
        return `
          <div class="color-palette" id="${paletteId}" data-palette-for="${editorId}" data-palette-kind="${kind}">
            <div class="color-palette-title">${isText ? '文字颜色' : '背景色'}</div>
            <div class="color-swatches">
              ${(isText ? PRESET_TEXT_COLORS : PRESET_BG_COLORS).map(c => `
                <button type="button" class="color-swatch" data-color-value="${c.value}" title="${c.name}"
                        style="background:${c.value};"></button>
              `).join('')}
            </div>
            <div class="color-custom-row">
              <span class="color-custom-label">自定义</span>
              <input type="color" class="color-custom-input" value="${isText ? state.lastTextColor : state.lastBgColor}">
            </div>
          </div>
        `;
      }

      function buildRichEditorHtml(editorId, initialHtml) {
        return `
          <div class="rich-editor-wrap">
            <div class="rich-toolbar" data-toolbar-for="${editorId}">
              <button type="button" class="rich-btn bold-btn" data-cmd="bold" title="加粗">B</button>
              <button type="button" class="rich-btn italic-btn" data-cmd="italic" title="斜体">I</button>
              <button type="button" class="rich-btn underline-btn" data-cmd="underline" title="下划线">U</button>
              <span class="rich-divider"></span>
              ${buildColorButtonHtml(editorId, 'text', state.lastTextColor)}
              ${buildColorButtonHtml(editorId, 'bg', state.lastBgColor)}
              <span class="rich-divider"></span>
              <button type="button" class="rich-btn format-painter-btn" data-cmd="formatPainter" title="格式刷">🖌</button>
              <button type="button" class="rich-btn" data-cmd="removeFormat" title="清除格式">✕</button>
            </div>
            <div class="rich-editor" id="${editorId}" contenteditable="true"
                 data-placeholder="在此输入知识点详细内容..."
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 inputmode="text">${initialHtml || ''}</div>
          </div>
          <div class="rich-hint">💡 选中文字后点按钮标注重点；A/◐=一键用当前色，▼=展开调色板；🖌=格式刷</div>
        `;
      }

      function normalizeColor(c) {
        if (!c) return null;
        c = String(c).trim();
        if (!c) return null;
        if (c === 'transparent' || c === 'rgba(0, 0, 0, 0)' || c === 'rgba(0,0,0,0)') return null;
        if (c.startsWith('#')) {
          if (c.length === 4) return ('#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3]).toLowerCase();
          return c.toLowerCase();
        }
        const m = c.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
        if (!m) return null;
        const toHex = (n) => parseInt(n, 10).toString(16).padStart(2, '0');
        return ('#' + toHex(m[1]) + toHex(m[2]) + toHex(m[3])).toLowerCase();
      }

      function initRichEditor(editorId) {
        const editor = document.getElementById(editorId);
        const toolbar = document.querySelector(`.rich-toolbar[data-toolbar-for="${editorId}"]`);
        if (!editor || !toolbar) return;

        bindPaletteBus();

        // iOS 修复：必须在用户手势（touch/click）的同步调用栈内设置 styleWithCSS，
        // 否则 iOS Safari 会拒绝。
        // 这里用一个"待激活"标志，第一次 touchstart 时立即激活。
        let styleWithCSSReady = false;
        function ensureStyleWithCSS() {
          if (styleWithCSSReady) return;
          try {
            document.execCommand('styleWithCSS', false, true);
            styleWithCSSReady = true;
          } catch (e) {}
        }
        // 立即尝试一次（桌面浏览器 OK）
        ensureStyleWithCSS();
        // 在用户手势里再确保一次
        toolbar.addEventListener('touchstart', ensureStyleWithCSS, { passive: true, once: false });
        editor.addEventListener('touchstart', ensureStyleWithCSS, { passive: true, once: false });

        ['text', 'bg'].forEach(kind => {
          const paletteId = `palette-${editorId}-${kind}`;
          const old = document.getElementById(paletteId);
          if (old) old.remove();

          const wrap = document.createElement('div');
          wrap.innerHTML = buildPaletteHtml(editorId, kind);
          const palette = wrap.firstElementChild;
          document.body.appendChild(palette);
        });

        let savedRange = null;

        function saveSelection() {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            savedRange = sel.getRangeAt(0).cloneRange();
          }
        }
        function restoreSelection() {
          if (!savedRange) return false;
          try {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            return true;
          } catch (e) { return false; }
        }

        editor.addEventListener('keyup', saveSelection);
        editor.addEventListener('mouseup', saveSelection);
        editor.addEventListener('blur', saveSelection);
        editor.addEventListener('touchend', () => { setTimeout(saveSelection, 10); });

        const onSelectionChange = () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            saveSelection();
            updateActiveStates();
          }
        };
        document.addEventListener('selectionchange', onSelectionChange);

        const cleanupTimer = setInterval(() => {
          if (!document.body.contains(editor)) {
            clearInterval(cleanupTimer);
            document.removeEventListener('selectionchange', onSelectionChange);
            ['text', 'bg'].forEach(kind => {
              const p = document.getElementById(`palette-${editorId}-${kind}`);
              if (p) p.remove();
            });
            paletteRegistry.delete(editorId);
          }
        }, 800);

        paletteRegistry.set(editorId, {
          editor,
          restoreSelection,
          applyColor,
          updatePaletteSelection
        });

        function updateActiveStates() {
          toolbar.querySelectorAll('.rich-btn[data-cmd]').forEach(btn => {
            const cmd = btn.dataset.cmd;
            if (['bold', 'italic', 'underline'].includes(cmd)) {
              try { btn.classList.toggle('active', document.queryCommandState(cmd)); } catch (e) {}
            }
          });
        }

        function readFormatFromSelection() {
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return null;
          const range = sel.getRangeAt(0);
          if (!editor.contains(range.startContainer)) return null;

          let node = range.startContainer;
          if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
          if (!node) return null;

          const cs = window.getComputedStyle(node);
          const fontWeight = cs.fontWeight;
          const clip = {
            bold: fontWeight === 'bold' || parseInt(fontWeight, 10) >= 600,
            italic: cs.fontStyle === 'italic',
            underline: false,
            foreColor: null,
            hiliteColor: null
          };

          let cur = node;
          let foundUnderline = false;
          let foundColor = null;
          let foundBg = null;
          while (cur && cur !== editor && cur.nodeType === Node.ELEMENT_NODE) {
            const tag = cur.tagName;
            if (tag === 'U' || tag === 'INS') foundUnderline = true;

            if (tag === 'FONT') {
              const colorAttr = cur.getAttribute('color');
              if (!foundColor && colorAttr) foundColor = normalizeColor(colorAttr);
            }

            const inlineStyle = cur.getAttribute && cur.getAttribute('style');
            if (inlineStyle) {
              if (/text-decoration\s*:[^;]*underline/i.test(inlineStyle)) foundUnderline = true;

              const colorMatch = inlineStyle.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
              if (!foundColor && colorMatch) {
                const n = normalizeColor(colorMatch[1]);
                if (n) foundColor = n;
              }

              const bgMatch = inlineStyle.match(/(?:^|;)\s*background(?:-color)?\s*:\s*([^;]+)/i);
              if (!foundBg && bgMatch) {
                const v = bgMatch[1].trim();
                if (!/url\s*\(/i.test(v)) {
                  const n = normalizeColor(v);
                  if (n) foundBg = n;
                }
              }
            }
            cur = cur.parentElement;
          }

          if (!foundColor) {
            try {
              const fc = document.queryCommandValue('foreColor');
              if (fc) {
                const n = normalizeColor(fc);
                if (n && n !== '#1e293b') foundColor = n;
              }
            } catch (e) {}
          }
          if (!foundBg) {
            try {
              let hc = document.queryCommandValue('hiliteColor');
