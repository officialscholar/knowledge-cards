      }

      // ============================================================
      // 批量操作
      // ============================================================
      function enterSelectionMode() {
        state.selectionMode = true;
        state.selectedIds = new Set();
        renderSidebar(true);
      }

      function exitSelectionMode() {
        state.selectionMode = false;
        state.selectedIds = new Set();
        renderSidebar(true);
      }

      function selectAllInSidebar() {
        const filtered = getFilteredItems();
        state.selectedIds = new Set(filtered.map(i => i.id));
        renderSidebar(true);
      }

      function batchMoveGroup() {
        if (state.selectedIds.size === 0) return;
        openMoveGroupModal();
      }

      function batchResetMastery() {
        if (state.selectedIds.size === 0) return;
        const n = state.selectedIds.size;
        showConfirm('重置掌握度', `将选中的 ${n} 个知识点的掌握度重置为 0？`, () => {
          state.selectedIds.forEach(id => {
            const item = state.items.find(i => i.id === id);
            if (item) item.masteryLevel = 0;
          });
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast(`已重置 ${n} 个`);
        });
      }

      function batchDelete() {
        if (state.selectedIds.size === 0) return;
        const n = state.selectedIds.size;
        showConfirm('批量删除', `确定要删除选中的 ${n} 个知识点吗？此操作不可撤销。`, () => {
          const imgs = [];
          state.items = state.items.filter(item => {
            if (state.selectedIds.has(item.id)) {
              (item.images || []).forEach(r => imgs.push(r));
              return false;
            }
            return true;
          });
          if (state.selectedIds.has(state.activeId)) {
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
          }
          exitSelectionMode();
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast(`已删除 ${n} 个`);
          cleanupImages(imgs).catch(() => {});
        });
      }

      function openMoveGroupModal() {
        const groups = getAllGroups();
        el.moveGroupCount.textContent = state.selectedIds.size;
        el.moveGroupNewInput.value = '';

        let html = '';
        html += `
          <div class="move-group-option ungrouped" data-group="">
            <span>📄 未分组</span>
          </div>
        `;
        groups.forEach(g => {
          const count = state.items.filter(i => (i.group || '').trim() === g).length;
          html += `
            <div class="move-group-option" data-group="${escapeHtml(g)}">
              <span>📁 ${escapeHtml(g)}</span>
              <span class="count">${count}</span>
            </div>
          `;
        });
        el.moveGroupList.innerHTML = html;

        el.moveGroupList.querySelectorAll('.move-group-option').forEach(opt => {
          opt.addEventListener('click', () => {
            doMoveToGroup(opt.dataset.group);
          });
        });

        el.moveGroupModal.classList.add('show');
      }

      function doMoveToGroup(groupName) {
        const target = String(groupName || '').trim();
        state.selectedIds.forEach(id => {
          const item = state.items.find(i => i.id === id);
          if (item) item.group = target;
        });
        saveToStorage();
        el.moveGroupModal.classList.remove('show');
        exitSelectionMode();
        renderSidebar(true);
        renderContent();
        showToast(target ? `已移动到「${target}」` : `已移到未分组`);
      }

      document.getElementById('moveGroupModalClose').addEventListener('click', () => el.moveGroupModal.classList.remove('show'));
      document.getElementById('moveGroupCancelBtn').addEventListener('click', () => el.moveGroupModal.classList.remove('show'));
      el.moveGroupModal.addEventListener('click', (e) => {
        if (e.target === el.moveGroupModal) el.moveGroupModal.classList.remove('show');
      });
      el.moveGroupNewInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = el.moveGroupNewInput.value.trim();
          if (v) doMoveToGroup(v);
        }
      });

      // ============================================================
      // 侧边栏事件
      // ============================================================
      el.knowledgeList.addEventListener('click', (e) => {
        const action = e.target.closest('[data-action]');
        if (!action) return;
        const act = action.dataset.action;

        if (act === 'toggle-group') {
          const groupName = action.dataset.group;
          if (!groupName) return;
          state.collapsedGroups[groupName] = !state.collapsedGroups[groupName];
          saveCollapsedState();
          const section = action.closest('.group-section');
          if (section) section.classList.toggle('collapsed', state.collapsedGroups[groupName]);
          return;
        }

        if (act === 'delete-group') { e.stopPropagation(); deleteGroup(action.dataset.group); return; }
        if (act === 'delete-item') { e.stopPropagation(); deleteKnowledgeItem(action.dataset.id); return; }

        if (act === 'select-item') {
          const id = action.dataset.id;
          if (!id) return;

          if (state.selectionMode) {
            if (state.selectedIds.has(id)) state.selectedIds.delete(id);
            else state.selectedIds.add(id);
            renderSidebar(true);
            return;
          }

          if (id !== state.activeId || state.isCreatingNew) {
            guardUnsaved(() => {
              state.activeId = id;
              state.isCreatingNew = false;
              state.editingSessionId = null;
              state.editDirty = false;
              state.draftImages = [];
              state.draftTags = [];
              state.formatPainterArmed = false;
              state.formatPainterClip = null;
              state.formatPainterEditorId = null;
              clearPendingCardClick();
              if (state.mode === 'global') setMode('recite');
              else { updateSidebarActive(); renderContent(); }
            });
          } else if (state.mode === 'global') {
            setMode('recite');
          }
        }
      });

      function deleteGroup(groupName) {
        const target = String(groupName || '').trim();
        if (!target) return;
        const count = state.items.filter(item => (item.group || '').trim() === target).length;
        showConfirm('删除分组', `确定要删除分组「${target}」吗？\n组内 ${count} 个知识点将变为未分组状态。`, () => {
          state.items.forEach(item => {
            if ((item.group || '').trim() === target) item.group = '';
          });
          delete state.collapsedGroups[target];
          saveCollapsedState();
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast('已删除分组');
        });
      }

      function deleteKnowledgeItem(id) {
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        showConfirm('删除知识点', `确定要删除知识点「${item.title}」吗？`, () => {
          if (state.speakingId === id) stopSpeaking();
          const imgs = (item.images || []).slice();
          const idx = state.items.findIndex(i => i.id === id);
          if (idx !== -1) state.items.splice(idx, 1);
          if (state.activeId === id) {
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
            state.isCreatingNew = false;
          }
          state.editingSessionId = null;
          state.editDirty = false;
          state.draftImages = [];
          state.draftTags = [];
          saveToStorage();
          renderSidebar(true);
          renderContent();
          showToast('已删除');
          cleanupImages(imgs).catch(() => {});
        });
      }

      // ============================================================
      // 主渲染
      // ============================================================
      function renderContent() {
        validateActiveId();

        if (state.mode === 'global') {
          el.sidebar.classList.add('hidden-sidebar');
          el.contentArea.classList.add('full-width');
          el.contentArea.classList.remove('recite-full');
        } else if (state.mode === 'recite') {
          el.sidebar.classList.add('hidden-sidebar');
          el.contentArea.classList.add('recite-full');
          el.contentArea.classList.remove('full-width');
        } else {
          el.sidebar.classList.remove('hidden-sidebar');
          el.contentArea.classList.remove('full-width');
          el.contentArea.classList.remove('recite-full');
        }

        if (state.speakingId) stopSpeaking();

        if (state.mode === 'global') renderGlobalMode();
        else if (state.mode === 'recite') renderReciteMode();
        else renderEditMode();
      }

      function validateActiveId() {
        if (state.isCreatingNew) return;
        if (!state.items.some(item => item.id === state.activeId)) {
          state.activeId = state.items.length > 0 ? state.items[0].id : null;
        }
      }

      // ============================================================
      // 全局模式
      // ============================================================
      let globalClickBound = false;
      let lastGlobalDragEndTime = 0;

      function renderGlobalMode() {
        const existing = document.getElementById('globalToolbar');
        const modeMatches = el.contentArea.dataset.mode === 'global';

        if (!existing || !modeMatches) {
          el.contentArea.innerHTML = `
            <div class="global-toolbar" id="globalToolbar">${buildGlobalToolbarHtml()}</div>
            <div class="global-body" id="globalBody"></div>
          `;
          el.contentArea.dataset.mode = 'global';
          bindGlobalToolbarEvents();
        } else {
          syncGlobalToolbarOptions();
        }
        renderGlobalBody();
      }

      function buildGlobalToolbarHtml() {
        const groups = getAllGroups();
        const tags = getAllTags();
        const groupOpts = groups.map(g =>
          `<option value="${escapeHtml(g)}" ${state.filterGroup === g ? 'selected' : ''}>${escapeHtml(g)}</option>`
        ).join('');
        const tagOpts = tags.map(t =>
          `<option value="${escapeHtml(t)}" ${state.filterTag === t ? 'selected' : ''}># ${escapeHtml(t)}</option>`
        ).join('');
        return `
          <div class="filter-row">
            <select class="filter-select ${state.filterGroup ? 'active' : ''}" id="filterGroupSelect">
              <option value="">全部分组</option>
              ${groupOpts}
            </select>
            ${tags.length > 0 ? `
              <select class="filter-select ${state.filterTag ? 'active' : ''}" id="filterTagSelect">
                <option value="">全部标签</option>
                ${tagOpts}
              </select>
            ` : ''}
            <select class="filter-select ${state.filterMastery ? 'active' : ''}" id="filterMasterySelect">
              <option value="">全部熟练度</option>
              <option value="unmastered" ${state.filterMastery === 'unmastered' ? 'selected' : ''}>未掌握</option>
              <option value="mastered" ${state.filterMastery === 'mastered' ? 'selected' : ''}>已掌握</option>
            </select>
            <button class="filter-chip ${state.filterHasImage ? 'active' : ''}" id="filterImageBtn">🖼 有图</button>
            <span class="filter-result" id="filterResult"></span>
          </div>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="globalSearchInput"
                   placeholder="搜索标题、内容或标签..."
                   value="${escapeHtml(state.searchQuery)}"
                   autocorrect="off" autocapitalize="off" spellcheck="false"
                   autocomplete="off">
            <button class="search-clear ${state.searchQuery ? 'visible' : ''}" id="globalSearchClear" title="清除">✕</button>
          </div>
        `;
      }

      function syncGlobalToolbarOptions() {
        const input = document.getElementById('globalSearchInput');
        const savedValue = input ? input.value : state.searchQuery;
        const toolbar = document.getElementById('globalToolbar');
        if (!toolbar) return;
        toolbar.innerHTML = buildGlobalToolbarHtml();
        const newInput = document.getElementById('globalSearchInput');
        if (newInput) newInput.value = savedValue;
        bindGlobalToolbarEvents();
      }

      function bindGlobalToolbarEvents() {
        const input = document.getElementById('globalSearchInput');
        const clearBtn = document.getElementById('globalSearchClear');
        const groupSel = document.getElementById('filterGroupSelect');
        const tagSel = document.getElementById('filterTagSelect');
        const masterySel = document.getElementById('filterMasterySelect');
        const imgBtn = document.getElementById('filterImageBtn');

        if (input) {
          input.addEventListener('input', debounce(() => {
            state.searchQuery = input.value;
            if (clearBtn) clearBtn.classList.toggle('visible', !!input.value);
            renderGlobalBody();
            renderSidebar(true);
          }, 180));
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            if (input) input.value = '';
            state.searchQuery = '';
            if (clearBtn) clearBtn.classList.remove('visible');
            renderGlobalBody();
            renderSidebar(true);
          });
        }
        if (groupSel) {
          groupSel.addEventListener('change', (e) => {
            state.filterGroup = e.target.value;
            e.target.classList.toggle('active', !!e.target.value);
            renderGlobalBody();
            renderSidebar(true);
          });
        }
        if (tagSel) {
          tagSel.addEventListener('change', (e) => {
            state.filterTag = e.target.value;
            e.target.classList.toggle('active', !!e.target.value);
            renderGlobalBody();
            renderSidebar(true);
          });
        }
        if (masterySel) {
          masterySel.addEventListener('change', (e) => {
            state.filterMastery = e.target.value;
            e.target.classList.toggle('active', !!e.target.value);
            renderGlobalBody();
            renderSidebar(true);
          });
        }
        if (imgBtn) {
          imgBtn.addEventListener('click', () => {
            state.filterHasImage = !state.filterHasImage;
            imgBtn.classList.toggle('active', state.filterHasImage);
            renderGlobalBody();
            renderSidebar(true);
          });
        }
      }

      function renderGlobalBody() {
        const body = document.getElementById('globalBody');
        if (!body) return;

        const filtered = getFilteredItems();
        const total = state.items.length;
        const resultEl = document.getElementById('filterResult');
        if (resultEl) {
          if (!isFilterActive()) resultEl.textContent = `${total} 张`;
          else resultEl.textContent = `命中 ${filtered.length}/${total}`;
        }

        if (total === 0) {
          body.innerHTML = `
            <div class="empty-state" style="margin: 20px auto; max-width: 680px;">
              <p>✨ 还没有知识点</p>
              <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
            </div>
          `;
          return;
        }

        if (filtered.length === 0) {
          body.innerHTML = `
            <div class="empty-state" style="margin: 20px auto; max-width: 680px;">
              <p>🔍 没有匹配的知识点</p>
              <p style="font-size:0.9rem; color: var(--text-faint);">试试调整关键词或清除筛选条件</p>
            </div>
          `;
          return;
        }

        const { groups, groupMap, ungrouped } = buildGroups(filtered);
        let html = '';

        groups.forEach(groupName => {
          const groupItems = groupMap.get(groupName) || [];
          html += `
            <div class="global-group-section" data-group="${escapeHtml(groupName)}">
              <div class="global-group-divider">
                <span class="divider-name"><span>📁</span>${escapeHtml(groupName)}</span>
                <span class="divider-count">${groupItems.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${groupItems.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        });

        if (ungrouped.length > 0) {
          html += `
            <div class="global-group-section ungrouped-section" data-group="">
              <div class="global-group-divider">
                <span class="divider-name"><span>📄</span>未分组</span>
                <span class="divider-count">${ungrouped.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${ungrouped.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        }

        body.innerHTML = html;

        if (!globalClickBound) {
          el.contentArea.addEventListener('click', globalCardClickHandler);
          globalClickBound = true;
        }

        if (!isFilterActive()) initGlobalDragSort();
      }

      function globalCardClickHandler(e) {
        const card = e.target.closest('.global-card');
        if (!card) return;
        if (Date.now() - lastGlobalDragEndTime < DRAG_CLICK_GUARD_MS) return;
        const id = card.dataset.id;
        if (!id) return;
        guardUnsaved(() => {
          state.activeId = id;
          state.isCreatingNew = false;
          clearPendingCardClick();
          setMode('recite');
        });
      }

      function renderGlobalCard(item) {
        const masteredClass = (item.masteryLevel || 0) >= MASTERED_THRESHOLD ? 'mastered-global' : '';
        const masteredCheck = masteredClass ? '<span class="mastered-check">✓</span>' : '';
        const plainText = htmlToPlainText(item.content) || '';
        const hasImages = Array.isArray(item.images) && item.images.length > 0;
        const imgBadge = hasImages
          ? '<span style="position:absolute;bottom:8px;right:32px;font-size:0.7rem;opacity:0.7;">🖼️</span>'
          : '';

        const tags = Array.isArray(item.tags) ? item.tags : [];
        const shown = tags.slice(0, 4);
        const more = tags.length - shown.length;
        const tagsHtml = tags.length > 0
          ? `<div class="card-tags">
              ${shown.map(t => `<span class="card-tag">#${escapeHtml(t)}</span>`).join('')}
              ${more > 0 ? `<span class="card-tag">+${more}</span>` : ''}
            </div>`
          : '';

        return `
          <div class="global-card ${masteredClass}" data-id="${item.id}">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-content">${escapeHtml(plainText) || '<span style="color:var(--text-faint);font-style:italic;">暂无内容</span>'}</div>
            ${tagsHtml}
            ${masteredCheck}
            ${imgBadge}
          </div>
        `;
      }

      // ============================================================
      // 拖拽
      // ============================================================
      let globalDragCleanup = null;

      function initGlobalDragSort() {
        if (globalDragCleanup) globalDragCleanup();

        let draggedElement = null;
        let placeholder = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        let mouseStartInfo = null;
        let mouseIsDragging = false;
        let mouseMoveHandler = null;
        let mouseUpHandler = null;

        let touchStartInfo = null;
        let longPressTimer = null;
        let lastTouchTime = 0;

        const cards = el.contentArea.querySelectorAll('.global-card');
        cards.forEach(card => {
          card.addEventListener('mousedown', onMouseDown);
          card.addEventListener('touchstart', onTouchStart, { passive: true });
        });

        function onMouseDown(e) {
          if (e.button !== 0) return;
          if (lastTouchTime && Date.now() - lastTouchTime < 800) return;
          if (draggedElement) return;
          const card = e.currentTarget;
          mouseStartInfo = { x: e.clientX, y: e.clientY, card };
          mouseIsDragging = false;

          mouseMoveHandler = (ev) => {
            if (!mouseStartInfo) return;
            const dx = Math.abs(ev.clientX - mouseStartInfo.x);
            const dy = Math.abs(ev.clientY - mouseStartInfo.y);
            if (!mouseIsDragging && (dx > 6 || dy > 6)) {
              mouseIsDragging = true;
              const rect = card.getBoundingClientRect();
              dragOffsetX = mouseStartInfo.x - rect.left;
              dragOffsetY = mouseStartInfo.y - rect.top;
              beginDrag(card);
            }
            if (mouseIsDragging) {
              ev.preventDefault();
              updateDragPosition(ev.clientX, ev.clientY);
              handleDragOver(ev.clientX, ev.clientY);
            }
          };
          mouseUpHandler = () => {
            document.removeEventListener('mousemove', mouseMoveHandler);
            document.removeEventListener('mouseup', mouseUpHandler);
            mouseMoveHandler = null;
            mouseUpHandler = null;
            if (mouseIsDragging) endDrag();
            mouseStartInfo = null;
            mouseIsDragging = false;
          };
          document.addEventListener('mousemove', mouseMoveHandler);
          document.addEventListener('mouseup', mouseUpHandler);
        }

        function onTouchStart(e) {
          lastTouchTime = Date.now();
          if (draggedElement) return;
          const touch = e.touches[0];
          const card = e.currentTarget;
          touchStartInfo = { x: touch.clientX, y: touch.clientY, card };

          if (longPressTimer) clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            longPressTimer = null;
            if (!touchStartInfo) return;
            try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
            const rect = card.getBoundingClientRect();
            dragOffsetX = touchStartInfo.x - rect.left;
            dragOffsetY = touchStartInfo.y - rect.top;
            beginDrag(card);
          }, LONG_PRESS_MS);
        }

        function onTouchMove(e) {
          if (longPressTimer && touchStartInfo) {
            const touch = e.touches[0];
            const dx = Math.abs(touch.clientX - touchStartInfo.x);
            const dy = Math.abs(touch.clientY - touchStartInfo.y);
            if (dx > 10 || dy > 10) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }
          }
          if (draggedElement) {
            e.preventDefault();
            const touch = e.touches[0];
            updateDragPosition(touch.clientX, touch.clientY);
            handleDragOver(touch.clientX, touch.clientY);
          }
        }

        function onTouchEnd() {
          lastTouchTime = Date.now();
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          if (draggedElement) endDrag();
          touchStartInfo = null;
        }

        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd);
        document.addEventListener('touchcancel', onTouchEnd);

        function beginDrag(card) {
          if (draggedElement) return;
          draggedElement = card;
          card.classList.add('dragging');
          card.style.touchAction = 'none';

          placeholder = document.createElement('div');
          placeholder.className = 'global-card';
          placeholder.style.visibility = 'hidden';
          placeholder.style.height = card.offsetHeight + 'px';
          placeholder.style.width = card.offsetWidth + 'px';
          placeholder.style.pointerEvents = 'none';
          placeholder.dataset.placeholder = 'true';

          const rect = card.getBoundingClientRect();
          card.style.position = 'fixed';
          card.style.left = rect.left + 'px';
          card.style.top = rect.top + 'px';
          card.style.width = rect.width + 'px';
          card.style.height = rect.height + 'px';
          card.style.zIndex = '1000';
          card.style.pointerEvents = 'none';

          card.parentNode.insertBefore(placeholder, card);
        }

        function updateDragPosition(clientX, clientY) {
          if (!draggedElement) return;
          draggedElement.style.left = (clientX - dragOffsetX) + 'px';
          draggedElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragOver(clientX, clientY) {
          if (!draggedElement || !placeholder) return;
          const elemBelow = document.elementFromPoint(clientX, clientY);
          if (!elemBelow) return;
          const targetCard = elemBelow.closest('.global-card');
          if (!targetCard || targetCard === draggedElement || targetCard === placeholder) return;
          const targetGrid = targetCard.closest('.global-grid');
          if (!targetGrid) return;

          const targetRect = targetCard.getBoundingClientRect();
          const middleY = targetRect.top + targetRect.height / 2;
          const middleX = targetRect.left + targetRect.width / 2;
          const insertBefore = (clientY < middleY) ||
            (Math.abs(clientY - middleY) < targetRect.height / 2 && clientX < middleX);

          if (insertBefore) targetGrid.insertBefore(placeholder, targetCard);
          else if (targetCard.nextSibling) targetGrid.insertBefore(placeholder, targetCard.nextSibling);
          else targetGrid.appendChild(placeholder);
        }

        function endDrag() {
          if (!draggedElement || !placeholder) return;
          placeholder.parentNode.insertBefore(draggedElement, placeholder);
          placeholder.remove();
          draggedElement.classList.remove('dragging');
          draggedElement.style.position = '';
          draggedElement.style.left = '';
          draggedElement.style.top = '';
          draggedElement.style.width = '';
          draggedElement.style.height = '';
          draggedElement.style.zIndex = '';
          draggedElement.style.pointerEvents = '';
          draggedElement.style.touchAction = '';

          lastGlobalDragEndTime = Date.now();
          updateDataOrderFromDOM();
          draggedElement = null;
          placeholder = null;
        }

        globalDragCleanup = () => {
          if (mouseMoveHandler) document.removeEventListener('mousemove', mouseMoveHandler);
          if (mouseUpHandler) document.removeEventListener('mouseup', mouseUpHandler);
          document.removeEventListener('touchmove', onTouchMove);
          document.removeEventListener('touchend', onTouchEnd);
          document.removeEventListener('touchcancel', onTouchEnd);
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

          if (draggedElement) {
            draggedElement.style.position = '';
            draggedElement.style.left = '';
            draggedElement.style.top = '';
            draggedElement.style.width = '';
            draggedElement.style.height = '';
            draggedElement.style.zIndex = '';
            draggedElement.style.pointerEvents = '';
            draggedElement.style.touchAction = '';
            draggedElement.classList.remove('dragging');
          }
          if (placeholder && placeholder.parentNode) placeholder.remove();
          draggedElement = null;
          placeholder = null;
          mouseStartInfo = null;
          mouseIsDragging = false;
          touchStartInfo = null;
        };
      }

      function updateDataOrderFromDOM() {
        const sections = el.contentArea.querySelectorAll('.global-group-section');
        const newOrderedIds = [];
        const idToGroup = {};
        sections.forEach(section => {
          const groupName = section.dataset.group || '';
          section.querySelectorAll('.global-card:not([data-placeholder])').forEach(card => {
            const id = card.dataset.id;
            if (id) {
              newOrderedIds.push(id);
              idToGroup[id] = groupName;
            }
          });
        });
        if (newOrderedIds.length !== state.items.length) return;

        const itemMap = new Map(state.items.map(i => [i.id, i]));
        const newItems = [];
        newOrderedIds.forEach(id => {
          const item = itemMap.get(id);
          if (item) {
            item.group = idToGroup[id] || '';
            newItems.push(item);
          }
        });
        state.items = newItems;
        saveToStorage();
        renderSidebar(true);
      }

      // ============================================================
      // 背诵模式
      // ============================================================
      let reciteRenderToken = 0;

      async function renderReciteMode() {
        clearPendingCardClick();

        if (state.items.length === 0) {
          el.contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const currentIndex = state.items.findIndex(item => item.id === state.activeId);
        state.reciteIndex = currentIndex >= 0 ? currentIndex : 0;
        if (state.reciteIndex >= state.items.length) state.reciteIndex = state.items.length - 1;

        const token = ++reciteRenderToken;
        const item = state.items[state.reciteIndex];
        const resolvedImages = await resolveImageArray(item.images);
        if (token !== reciteRenderToken) return;

        const prevArrowSvg = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 28 6 L 12 20 L 28 34 Z"/></svg>';
        const nextArrowSvg = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 12 6 L 28 20 L 12 34 Z"/></svg>';
        const idx = state.reciteIndex;

        const groupTag = item.group && item.group.trim()
          ? `<div style="font-size:0.72rem;color:var(--text-muted);background:var(--bg-subtle);display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:10px;">📁 ${escapeHtml(item.group)}</div>`
          : '';

        const tagsHtml = (item.tags && item.tags.length > 0)
          ? `<div class="card-tags-row">${item.tags.map(t => `<span class="tag-chip-view">#${escapeHtml(t)}</span>`).join('')}</div>`
          : '';

        const speakBtnHtml = speechSupported
          ? `<button class="speak-btn" data-action="speak" data-speak-id="${item.id}" title="朗读">🔊</button>`
          : '';

        let imagesHtml = '';
        if (resolvedImages.length > 0) {
          imagesHtml = `
            <div class="card-images">
              ${resolvedImages.map(src => `<img src="${src}" alt="知识点图片" loading="lazy">`).join('')}
            </div>
          `;
        }

        el.contentArea.innerHTML = `
          <div class="recite-container">
            <div class="recite-slide">
              <div class="recite-slide-inner">
                <div class="knowledge-card" data-card-id="${item.id}">
                  ${groupTag}
                  ${tagsHtml}
                  <div class="card-title-row">
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${speakBtnHtml}
                  </div>
                  <div class="card-content">${item.content || '<span style="color:var(--text-faint);font-style:italic;">暂无内容</span>'}</div>
                  ${imagesHtml}
                </div>
                <div class="mastery-slider-row">
                  <div class="mastery-labels">
                    <span class="left-label">😵 不熟</span>
                    <span class="right-label">🤩 熟记</span>
                  </div>
                  <div class="mastery-slider-container" data-slider-id="${item.id}">
                    <div class="mastery-track">
                      <div class="mastery-fill" data-fill-id="${item.id}"></div>
                    </div>
                    <div class="mastery-thumb" data-thumb-id="${item.id}"></div>
                  </div>
                  <div class="slide-nav-row">
                    <button class="slide-nav-btn" data-action="nav-prev" title="上一个" ${idx === 0 ? 'disabled' : ''}>${prevArrowSvg}</button>
                    <span class="slide-nav-position">${idx + 1} / ${state.items.length}</span>
                    <button class="slide-nav-btn" data-action="nav-next" title="下一个" ${idx === state.items.length - 1 ? 'disabled' : ''}>${nextArrowSvg}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        initMasterySlider(item.id);
        updateSliderVisuals(item.id, item.masteryLevel || 0);
        bindReciteEvents();
      }

      function bindReciteEvents() {
        const area = el.contentArea;
        area.querySelectorAll('[data-action="nav-prev"]').forEach(btn => {
          btn.addEventListener('click', (e) => { e.stopPropagation(); goToPrev(); });
        });
        area.querySelectorAll('[data-action="nav-next"]').forEach(btn => {
          btn.addEventListener('click', (e) => { e.stopPropagation(); goToNext(); });
        });
        area.querySelectorAll('[data-action="speak"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.speakId;
            const item = state.items.find(i => i.id === id);
            if (item) speakItem(item);
          });
        });

        const card = area.querySelector('.knowledge-card');
        if (card) {
          let clickCount = 0;
          const cardId = card.dataset.cardId;
          card.addEventListener('click', (e) => {
            if (e.target.closest('.speak-btn')) return;
            if (e.target.closest('img')) return;
            if (window.getSelection && window.getSelection().toString()) return;

            card.classList.add('tapped');
            setTimeout(() => card.classList.remove('tapped'), 160);

            clickCount++;
            if (clickCount === 1) {
              state.pendingCardClickTimer = setTimeout(() => {
                state.pendingCardClickTimer = null;
                clickCount = 0;
                const currentCard = el.contentArea.querySelector('.knowledge-card');
                if (currentCard && currentCard.dataset.cardId === cardId) setMode('global');
              }, CLICK_DELAY);
            } else if (clickCount === 2) {
              clearPendingCardClick();
              clickCount = 0;
              if (cardId) { state.activeId = cardId; state.isCreatingNew = false; }
              setMode('edit');
            }
          });
        }
      }

      function goToPrev() {
        if (state.reciteIndex <= 0) return;
        clearPendingCardClick();
        if (state.speakingId) stopSpeaking();
        state.reciteIndex--;
        state.activeId = state.items[state.reciteIndex].id;
        renderReciteMode();
        updateSidebarActive();
      }

      function goToNext() {
        if (state.reciteIndex >= state.items.length - 1) return;
        clearPendingCardClick();
        if (state.speakingId) stopSpeaking();
        state.reciteIndex++;
        state.activeId = state.items[state.reciteIndex].id;
        renderReciteMode();
        updateSidebarActive();
      }

      let sliderCleanup = null;
      function initMasterySlider(itemId) {
        if (sliderCleanup) sliderCleanup();

        const container = document.querySelector(`.mastery-slider-container[data-slider-id="${itemId}"]`);
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!container || !thumb || !fill) return;

        let isDragging = false;
        let currentLevel = (state.items.find(i => i.id === itemId) || {}).masteryLevel || 0;
        let activeMove = null;
        let activeUp = null;

        const scope = card ? (card.closest('.recite-slide-inner') || document) : document;

        function getLevelFromX(clientX) {
          const rect = container.getBoundingClientRect();
          const x = clientX - rect.left;
          return Math.round(Math.max(0, Math.min(1, x / rect.width)) * 100);
        }

        function applyLevel(level, save) {
          currentLevel = level;
          fill.style.width = level + '%';
          thumb.style.left = level + '%';
          const color = getMasteryColor(level);
          thumb.style.borderColor = color;
          thumb.style.background = level > 0 ? color : 'var(--bg-surface)';
          if (card) {
            const bg = getCardBackground(level);
            const bd = getCardBorderColor(level);
            card.style.background = bg || '';
            card.style.borderColor = bd || '';
          }
          const leftLabel = scope.querySelector('.left-label');
          const rightLabel = scope.querySelector('.right-label');
          if (leftLabel) leftLabel.style.color = level < 50 ? 'var(--text-muted)' : 'var(--text-faint)';
          if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : 'var(--text-faint)';
          if (save) {
            const dataItem = state.items.find(i => i.id === itemId);
            if (dataItem) {
              dataItem.masteryLevel = level;
              saveToStorage();
              updateSidebarActive();
            }
          }
        }

        function onStart(clientX) {
          isDragging = true;
          thumb.classList.add('dragging');
          applyLevel(getLevelFromX(clientX), false);
        }
        function onMove(clientX) { if (isDragging) applyLevel(getLevelFromX(clientX), false); }
        function onEnd() {
          if (!isDragging) return;
          isDragging = false;
          thumb.classList.remove('dragging');
          let finalLevel = currentLevel;
          if (currentLevel < 5) finalLevel = 0;
          else if (currentLevel > 95) finalLevel = 100;
          applyLevel(finalLevel, true);
        }

        function startMouse(clientX) {
          onStart(clientX);
          activeMove = (ev) => onMove(ev.clientX);
          activeUp = () => {
            document.removeEventListener('mousemove', activeMove);
            document.removeEventListener('mouseup', activeUp);
            activeMove = null; activeUp = null;
            onEnd();
          };
          document.addEventListener('mousemove', activeMove);
          document.addEventListener('mouseup', activeUp);
        }

        thumb.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); startMouse(e.clientX); });
        container.addEventListener('mousedown', (e) => {
          if (e.target === thumb) return;
          e.preventDefault(); e.stopPropagation();
          startMouse(e.clientX);
        });

        thumb.addEventListener('touchstart', (e) => { e.stopPropagation(); onStart(e.touches[0].clientX); }, { passive: true });
        container.addEventListener('touchstart', (e) => {
          if (e.target === thumb) return;
          e.stopPropagation();
          onStart(e.touches[0].clientX);
        }, { passive: true });

        const touchMove = (e) => { if (isDragging) { e.preventDefault(); onMove(e.touches[0].clientX); } };
        container.addEventListener('touchmove', touchMove, { passive: false });
        container.addEventListener('touchend', onEnd);
        container.addEventListener('touchcancel', onEnd);

        sliderCleanup = () => {
          if (activeMove) document.removeEventListener('mousemove', activeMove);
          if (activeUp) document.removeEventListener('mouseup', activeUp);
          container.removeEventListener('touchmove', touchMove);
          container.removeEventListener('touchend', onEnd);
          container.removeEventListener('touchcancel', onEnd);
          activeMove = null; activeUp = null;
        };
      }

      function updateSliderVisuals(itemId, level) {
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!thumb || !fill) return;
        fill.style.width = level + '%';
        thumb.style.left = level + '%';
        const color = getMasteryColor(level);
        thumb.style.borderColor = color;
        thumb.style.background = level > 0 ? color : 'var(--bg-surface)';
        if (card) {
          const bg = getCardBackground(level);
          const bd = getCardBorderColor(level);
          card.style.background = bg || '';
          card.style.borderColor = bd || '';
        }
        const scope = card ? (card.closest('.recite-slide-inner') || document) : document;
        const leftLabel = scope.querySelector('.left-label');
        const rightLabel = scope.querySelector('.right-label');
        if (leftLabel) leftLabel.style.color = level < 50 ? 'var(--text-muted)' : 'var(--text-faint)';
        if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : 'var(--text-faint)';
      }

      // ============================================================
      // 富文本编辑器
      // ============================================================
      function buildColorButtonHtml(editorId, kind, currentColor) {
        const isText = kind === 'text';
        const label = isText ? 'A' : '◐';
        const title = isText ? '字体颜色' : '背景色';
        return `
          <div class="color-btn-group" data-color-group="${editorId}-${kind}">
            <button type="button" class="color-btn-main" data-color-action="apply-current" data-color-kind="${kind}" data-editor-id="${editorId}" title="${title}">
              ${label}
              <span class="color-bar" style="background:${currentColor};"></span>
            </button>
            <button type="button" class="color-btn-arrow" data-color-action="toggle-palette" data-color-kind="${kind}" data-editor-id="${editorId}" title="选择颜色" aria-label="展开调色板">▼</button>
          </div>

      }

      function buildPaletteHtml(editorId, kind) {
        const isText = kind === 'text';
        const paletteId = `palette-${editorId}-${kind}`;
        return `
          <div class="color-palette" id="${paletteId}" data-palette-for="${editorId}" data-palette-kind="${kind}">
            <div class="color-palette-title">${isText ? '文字颜色' : '背景色'}</div>
            <div class="color-swatches">
              ${(isText ? PRESET_TEXT_COLORS : PRESET_BG_COLORS).map(c => `
                <button type="button" class="color-swatch" data-color-value="${c.value}" title="${c.name}"
                        style="background:${c.value};"></button>
              `).join('')}
            </div>
            <div class="color-custom-row">
              <span class="color-custom-label">自定义</span>

      function buildRichEditorHtml(editorId, initialHtml) {
        return `
          <div class="rich-editor-wrap">
            <div class="rich-toolbar" data-toolbar-for="${editorId}">
              <button type="button" class="rich-btn bold-btn" data-cmd="bold" title="加粗">B</button>
              <button type="button" class="rich-btn italic-btn" data-cmd="italic" title="斜体">I</button>
              <button type="button" class="rich-btn underline-btn" data-cmd="underline" title="下划线">U</button>
              <span class="rich-divider"></span>
              ${buildColorButtonHtml(editorId, 'text', state.lastTextColor)}
              ${buildColorButtonHtml(editorId, 'bg', state.lastBgColor)}
              <span class="rich-divider"></span>
              <button type="button" class="rich-btn format-painter-btn" data-cmd="formatPainter" title="格式刷">🖌</button>
              <button type="button" class="rich-btn" data-cmd="removeFormat" title="清除格式">✕</button>
            </div>
            <div class="rich-editor" id="${editorId}" contenteditable="true"
                 data-placeholder="在此输入知识点详细内容..."
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 inputmode="text">${initialHtml || ''}</div>
          </div>
          <div class="rich-hint">💡 选中文字后点按钮标注重点；A/◐=一键用当前色，▼=展开调色板；🖌=格式刷</div>
        `;
      }

      function normalizeColor(c) {
        if (!c) return null;
        c = String(c).trim();
        if (!c) return null;
        if (c === 'transparent' || c === 'rgba(0, 0, 0, 0)' || c === 'rgba(0,0,0,0)') return null;
        if (c.startsWith('#')) {
          if (c.length === 4) return ('#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3]).toLowerCase();
          return c.toLowerCase();
        }
        const m = c.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
        if (!m) return null;
        const toHex = (n) => parseInt(n, 10).toString(16).padStart(2, '0');
        return ('#' + toHex(m[1]) + toHex(m[2]) + toHex(m[3])).toLowerCase();
      }

      function initRichEditor(editorId) {
        const editor = document.getElementById(editorId);
        const toolbar = document.querySelector(`.rich-toolbar[data-toolbar-for="${editorId}"]`);
        if (!editor || !toolbar) return;

        bindPaletteBus();

        let styleWithCSSReady = false;
        function ensureStyleWithCSS() {
          if (styleWithCSSReady) return;
          try { document.execCommand('styleWithCSS', false, true); styleWithCSSReady = true; } catch (e) {}
        }
        ensureStyleWithCSS();
        toolbar.addEventListener('touchstart', ensureStyleWithCSS, { passive: true });
        editor.addEventListener('touchstart', ensureStyleWithCSS, { passive: true });

        const myPalettes = [];
        ['text', 'bg'].forEach(kind => {
          const paletteId = `palette-${editorId}-${kind}`;
          const old = document.getElementById(paletteId);
          if (old) old.remove();
          const wrap = document.createElement('div');
          wrap.innerHTML = buildPaletteHtml(editorId, kind);
          const palette = wrap.firstElementChild;
          document.body.appendChild(palette);
          myPalettes.push(palette);
        });

        let savedRange = null;

        function saveSelection() {
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return;
          const r = sel.getRangeAt(0);
          if (editor.contains(r.commonAncestorContainer)) savedRange = r.cloneRange();
        }
        function restoreSelection() {
          if (!savedRange) return false;
          try {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            return true;
          } catch (e) { return false; }
        }

        editor.addEventListener('keyup', saveSelection);
        editor.addEventListener('mouseup', saveSelection);
        editor.addEventListener('pointerup', saveSelection);
        editor.addEventListener('blur', () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
            savedRange = sel.getRangeAt(0).cloneRange();
          }
        });
        editor.addEventListener('touchend', () => { setTimeout(saveSelection, 0); });

        const onSelectionChange = () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
            saveSelection();
            updateActiveStates();
          }
        };
        document.addEventListener('selectionchange', onSelectionChange);

        const regEntry = { editor, restoreSelection, applyColor, updatePaletteSelection };
        paletteRegistry.set(editorId, regEntry);

        const cleanupTimer = setInterval(() => {
          if (!document.body.contains(editor)) {
            clearInterval(cleanupTimer);
            document.removeEventListener('selectionchange', onSelectionChange);
            myPalettes.forEach(p => p.remove());
            if (paletteRegistry.get(editorId) === regEntry) paletteRegistry.delete(editorId);
          }
        }, 800);

        function updateActiveStates() {
          toolbar.querySelectorAll('.rich-btn[data-cmd]').forEach(btn => {
            const cmd = btn.dataset.cmd;
            if (['bold', 'italic', 'underline'].includes(cmd)) {
              try { btn.classList.toggle('active', document.queryCommandState(cmd)); } catch (e) {}
            }
          });
        }

        function readFormatFromSelection() {
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return null;
          const range = sel.getRangeAt(0);
          if (!editor.contains(range.startContainer)) return null;

          let node = range.startContainer;
          if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
          if (!node) return null;

          const cs = window.getComputedStyle(node);
          const fontWeight = cs.fontWeight;
          const clip = {
            bold: fontWeight === 'bold' || parseInt(fontWeight, 10) >= 600,
            italic: cs.fontStyle === 'italic',
            underline: false, foreColor: null, hiliteColor: null
          };

          let cur = node, foundUnderline = false, foundColor = null, foundBg = null;
          while (cur && cur !== editor && cur.nodeType === Node.ELEMENT_NODE) {
            const tag = cur.tagName;
            if (tag === 'U' || tag === 'INS') foundUnderline = true;
            if (tag === 'FONT') {
              const colorAttr = cur.getAttribute('color');
              if (!foundColor && colorAttr) foundColor = normalizeColor(colorAttr);
            }
            const inlineStyle = cur.getAttribute && cur.getAttribute('style');
            if (inlineStyle) {
              if (/text-decoration\s*:[^;]*underline/i.test(inlineStyle)) foundUnderline = true;
              const colorMatch = inlineStyle.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
              if (!foundColor && colorMatch) {
                const n = normalizeColor(colorMatch[1]);
                if (n) foundColor = n;
              }
              const bgMatch = inlineStyle.match(/(?:^|;)\s*background(?:-color)?\s*:\s*([^;]+)/i);
              if (!foundBg && bgMatch) {
                const v = bgMatch[1].trim();
                if (!/url\s*\(/i.test(v)) {
                  const n = normalizeColor(v);
                  if (n) foundBg = n;
                }
              }
            }
            cur = cur.parentElement;
          }

          if (!foundColor) {
            try {
              const fc = document.queryCommandValue('foreColor');
              if (fc) {
                const n = normalizeColor(fc);
                if (n && n !== '#1e293b') foundColor = n;
              }
            } catch (e) {}
          }
          if (!foundBg) {
            try {
              let hc = document.queryCommandValue('hiliteColor');
              if (!hc || hc === 'rgba(0, 0, 0, 0)' || hc === 'transparent' || hc === 'rgba(0,0,0,0)') {
                hc = document.queryCommandValue('backColor');
              }
              if (hc && hc !== 'rgba(0, 0, 0, 0)' && hc !== 'transparent' && hc !== 'rgba(0,0,0,0)') {
                const n = normalizeColor(hc);
                if (n && n !== '#ffffff') foundBg = n;
              }
            } catch (e) {}
          }

          if (!foundUnderline) {
            const candidates = [cs.textDecorationLine, cs.textDecoration, cs.webkitTextDecorationLine, cs.webkitTextDecoration].filter(Boolean).join(' ');
            if (/underline/i.test(candidates)) foundUnderline = true;
          }
          if (!foundUnderline) {
            try { if (document.queryCommandState('underline')) foundUnderline = true; } catch (e) {}
          }

          clip.underline = foundUnderline;
          if (foundColor) clip.foreColor = foundColor;
          if (foundBg) clip.hiliteColor = foundBg;
          return clip;
        }

        function applyFormatToCurrentSelection() {
          if (!state.formatPainterClip) return false;
          const clip = state.formatPainterClip;
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return false;
          const range = sel.getRangeAt(0);
          if (range.collapsed) return false;
          if (!editor.contains(range.commonAncestorContainer)) return false;

          const targetRange = range.cloneRange();
          editor.focus({ preventScroll: true });
          try {
            const sel2 = window.getSelection();
            sel2.removeAllRanges();
            sel2.addRange(targetRange);
          } catch (e) { return false; }

          ensureStyleWithCSS();
          try {
            const curBold = document.queryCommandState('bold');
            if (!!clip.bold !== !!curBold) document.execCommand('bold', false, null);
            const curItalic = document.queryCommandState('italic');
            if (!!clip.italic !== !!curItalic) document.execCommand('italic', false, null);
            applyUnderlineSafely(clip.underline);
            if (clip.foreColor) {
              try { document.execCommand('foreColor', false, clip.foreColor); } catch (e) {}
              if (!isColorApplied(clip.foreColor, 'color')) wrapSelectionWithStyle('color', clip.foreColor);
            }
            if (clip.hiliteColor) {
              try { document.execCommand('hiliteColor', false, clip.hiliteColor); }
              catch (e) { try { document.execCommand('backColor', false, clip.hiliteColor); } catch (e2) {} }
              if (!isColorApplied(clip.hiliteColor, 'background-color')) wrapSelectionWithStyle('background-color', clip.hiliteColor);
            }
          } catch (e) { console.warn(e); }
          saveSelection();
          updateActiveStates();
          return true;
        }

        function isColorApplied(color, prop) {
          try {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return false;
            const r = sel.getRangeAt(0);
            let node = r.startContainer;
            if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            if (!node) return false;
            const cs = window.getComputedStyle(node);
            const want = normalizeColor(color);
            const got = normalizeColor(prop === 'color' ? cs.color : cs.backgroundColor);
            return want && got && want === got;
          } catch (e) { return false; }
        }

        function wrapSelectionWithStyle(prop, color) {
          try {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const r = sel.getRangeAt(0);
            if (r.collapsed) return;
            const span = document.createElement('span');
            span.style.setProperty(prop, color, 'important');
            try { r.surroundContents(span); }
            catch (e) {
              const frag = r.extractContents();
              span.appendChild(frag);
              r.insertNode(span);
            }
            const newSel = window.getSelection();
            newSel.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(span);
            newSel.addRange(newRange);
          } catch (e) { console.warn('wrapSelectionWithStyle 失败', e); }
        }

        function applyUnderlineSafely(wantUnderline) {
          ensureStyleWithCSS();
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return;
          const range = sel.getRangeAt(0);
          if (range.collapsed) return;

          let curUnderline = false;
          try { curUnderline = document.queryCommandState('underline'); } catch (e) {}
          if (wantUnderline !== curUnderline) {
            try { document.execCommand('underline', false, null); } catch (e) {}
          }
          let nowUnderline = false;
          try { nowUnderline = document.queryCommandState('underline'); } catch (e) {}
          if (nowUnderline === wantUnderline) return;

          const sel2 = window.getSelection();
          if (!sel2 || sel2.rangeCount === 0) return;
          const r = sel2.getRangeAt(0);

          if (wantUnderline) {
            let anc = r.startContainer;
            if (anc.nodeType === Node.TEXT_NODE) anc = anc.parentElement;
            let hasU = false;
            let walk = anc;
            while (walk && walk !== editor) {
              if (walk.nodeType === Node.ELEMENT_NODE && (walk.tagName === 'U' || walk.tagName === 'INS')) { hasU = true; break; }
              walk = walk.parentElement;
            }
            if (hasU) return;
            try {
              const u = document.createElement('u');
              try { r.surroundContents(u); }
              catch (e) {
                const frag = r.extractContents();
                u.appendChild(frag);
                r.insertNode(u);
              }
              const newSel = window.getSelection();
              newSel.removeAllRanges();
              const newRange = document.createRange();
              newRange.selectNodeContents(u);
              newSel.addRange(newRange);
            } catch (e) {}
          } else {
            const us = [];
            const root = r.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
              ? r.commonAncestorContainer
              : r.commonAncestorContainer.parentElement;
            if (root) {
              const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
              let n;
              while ((n = walker.nextNode())) {
                if (n.tagName === 'U' || n.tagName === 'INS') us.push(n);
              }
            }
            us.forEach(u => {
              if (!r.intersectsNode(u)) return;
              const text = document.createTextNode(u.textContent);
              u.parentNode.replaceChild(text, u);
            });
          }
        }

        function updateFormatPainterUI() {
          const btn = toolbar.querySelector('.format-painter-btn');
          if (!btn) return;
          const shouldArmed = state.formatPainterArmed && state.formatPainterEditorId === editorId;
          btn.classList.toggle('armed', shouldArmed);
        }

        const SEL_SELECTOR = '.rich-btn[data-cmd], .color-btn-main, .color-btn-arrow';

        toolbar.addEventListener('pointerdown', (e) => {
          const target = e.target.closest(SEL_SELECTOR);
          if (!target) return;
          saveSelection();
          if (e.pointerType !== 'touch' && e.target.closest('.rich-btn[data-cmd]')) e.preventDefault();
        }, { passive: false });

        toolbar.addEventListener('touchstart', (e) => {
          if (e.target.closest(SEL_SELECTOR)) saveSelection();
        }, { passive: true });

        toolbar.addEventListener('mousedown', (e) => {
          if (e.target.closest(SEL_SELECTOR)) saveSelection();
          if (e.target.closest('.rich-btn[data-cmd]')) e.preventDefault();
        });

        toolbar.addEventListener('click', (e) => {
          const btn = e.target.closest('.rich-btn[data-cmd]');
          const colorMain = e.target.closest('.color-btn-main');
          const colorArrow = e.target.closest('.color-btn-arrow');

          if (colorMain) {
            e.preventDefault(); e.stopPropagation();
            const kind = colorMain.dataset.colorKind;
            const current = kind === 'text' ? state.lastTextColor : state.lastBgColor;
            editor.focus({ preventScroll: true });
            restoreSelection();
            applyColor(kind, current);
            closeAllPalettes();
            return;
          }

          if (colorArrow) {
            e.preventDefault(); e.stopPropagation();
            const kind = colorArrow.dataset.colorKind;
            const palette = document.getElementById(`palette-${editorId}-${kind}`);
            if (!palette) return;
            const isOpen = palette.classList.contains('show');
            closeAllPalettes();
            if (!isOpen) {
              const group = colorArrow.closest('.color-btn-group');
              if (group) group.classList.add('open');
              palette.style.visibility = 'hidden';
              palette.classList.add('show');
              positionPalette(palette, colorArrow);
              palette.style.visibility = '';
              if (window.__markPaletteOpen) window.__markPaletteOpen();
              const customInput = palette.querySelector('.color-custom-input');
              if (customInput) customInput.value = kind === 'text' ? state.lastTextColor : state.lastBgColor;
              updatePaletteSelection(palette, kind);
            }
            return;
          }

          if (!btn) return;
          e.preventDefault();
          const cmd = btn.dataset.cmd;

          if (cmd === 'formatPainter') {
            if (state.formatPainterArmed && state.formatPainterEditorId === editorId) {
              const sel = window.getSelection();
              const hasSelection = sel && sel.rangeCount > 0 && !sel.isCollapsed &&
                sel.toString().length > 0 && editor.contains(sel.anchorNode);
              if (hasSelection) {
                const ok = applyFormatToCurrentSelection();
                if (ok) {
                  state.formatPainterArmed = false;
                  state.formatPainterClip = null;
                  state.formatPainterEditorId = null;
                  updateFormatPainterUI();
                  showToast('✓ 格式已应用');
                } else showToast('应用失败，请重新选中目标文字', true);
              } else {
                state.formatPainterArmed = false;
                state.formatPainterClip = null;
                state.formatPainterEditorId = null;
                updateFormatPainterUI();
                showToast('已取消格式刷');
              }
              return;
            }
            editor.focus({ preventScroll: true });
            restoreSelection();
            const clip = readFormatFromSelection();
            if (!clip) { showToast('请把光标放在文字上再点格式刷', true); return; }
            const hasAny = clip.bold || clip.italic || clip.underline || clip.foreColor || clip.hiliteColor;
            if (!hasAny) { showToast('当前文字无特殊格式，无法复制', true); return; }
            state.formatPainterClip = clip;
            state.formatPainterArmed = true;
            state.formatPainterEditorId = editorId;
            updateFormatPainterUI();
            showToast('格式已复制，请选中目标文字后再次点击🖌');
            return;
          }

          editor.focus({ preventScroll: true });
          restoreSelection();
          if (cmd === 'removeFormat') {
            document.execCommand('removeFormat', false, null);
            try { document.execCommand('hiliteColor', false, 'transparent'); } catch (e) {}
            try { document.execCommand('backColor', false, 'transparent'); } catch (e) {}
          } else if (cmd === 'underline') applyUnderlineSafely(true);
          else document.execCommand(cmd, false, null);
          saveSelection();
          updateActiveStates();
        });

        function applyColor(kind, color) {
          ensureStyleWithCSS();
          if (kind === 'text') {
            try { document.execCommand('foreColor', false, color); } catch (e) {}
            if (!isColorApplied(color, 'color')) wrapSelectionWithStyle('color', color);
            state.lastTextColor = color;
          } else {
            try { document.execCommand('hiliteColor', false, color); }
            catch (e) { document.execCommand('backColor', false, color); }
            if (!isColorApplied(color, 'background-color')) wrapSelectionWithStyle('background-color', color);
            state.lastBgColor = color;
          }
          const group = toolbar.querySelector(`.color-btn-group[data-color-group="${editorId}-${kind}"]`);
          if (group) {
            const bar = group.querySelector('.color-btn-main .color-bar');
            if (bar) bar.style.background = color;
          }
          saveSelection();
          updateActiveStates();
        }

        function updatePaletteSelection(palette, kind) {
          if (!palette) return;
          const current = kind === 'text' ? state.lastTextColor : state.lastBgColor;
          palette.querySelectorAll('.color-swatch').forEach(sw => {
            sw.classList.toggle('selected', sw.dataset.colorValue.toLowerCase() === current.toLowerCase());
          });
        }

        editor.addEventListener('paste', (e) => {
          e.preventDefault();
          const html = (e.clipboardData || window.clipboardData).getData('text/html');
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          if (html) document.execCommand('insertHTML', false, sanitizeHtml(html));
          else document.execCommand('insertText', false, text);
        });

        editor.addEventListener('focus', () => {
          setTimeout(() => {
            try { editor.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            catch (e) { editor.scrollIntoView(); }
          }, 300);
        });

        updateFormatPainterUI();
      }

      // ============================================================
      // 图片区
      // ============================================================
      const imageRenderTokens = new Map();

      async function renderImageSection(images, containerId) {
        const token = (imageRenderTokens.get(containerId) || 0) + 1;
        imageRenderTokens.set(containerId, token);
        const resolved = await resolveImageArray(images);
        if (imageRenderTokens.get(containerId) !== token) return;
        const container = document.getElementById(containerId);
        if (!container) return;
        if (resolved.length === 0) {
          container.innerHTML = '<div class="no-images-hint">暂无图片</div>';
          return;
        }
        container.innerHTML = resolved.map((src, i) => `
          <div class="image-item" data-img-index="${i}">
            <img src="${src}" alt="知识点图片">
            <button type="button" class="remove-img-btn" data-action="remove-img" data-img-index="${i}" title="移除">✕</button>
          </div>
        `).join('');
      }

      function pickAndAddImages(onAdd) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = async () => {
          const files = Array.from(input.files || []);
          for (const file of files) {
            await new Promise((resolve) => {
              compressImage(file, async (dataUrl) => {
                try {
                  const imgId = generateId();
                  await saveImage(imgId, dataUrl);
                  onAdd(`img://${imgId}`);
                } catch (err) {
                  console.warn('图片保存失败', err);
                  showToast('图片保存失败，请重试', true);
                }
                resolve();
              });
            });
          }
        };
        input.click();
      }

      function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > IMG_MAX_SIZE || height > IMG_MAX_SIZE) {
              if (width >= height) {
                height = Math.round(height * IMG_MAX_SIZE / width);
                width = IMG_MAX_SIZE;
              } else {
                width = Math.round(width * IMG_MAX_SIZE / height);
                height = IMG_MAX_SIZE;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let dataUrl;
            try { dataUrl = canvas.toDataURL('image/jpeg', IMG_QUALITY); }
            catch (err) { dataUrl = canvas.toDataURL('image/png'); }
            if (dataUrl.length > 800 * 1024) dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            callback(dataUrl);
          };
          img.onerror = () => showToast('图片加载失败', true);
          img.src = e.target.result;
        };
        reader.onerror = () => showToast('图片读取失败', true);
        reader.readAsDataURL(file);
      }

      // 标签编辑器 UI
      // ============================================================
      function buildTagEditorHtml(editorId) {
        return `
          <div class="tag-editor" id="${editorId}">
            <input type="text" class="tag-input" id="${editorId}_input"
                   placeholder="输入标签后按回车"
                   autocorrect="off" autocapitalize="off" spellcheck="false"
                   autocomplete="off">
          </div>
          <div class="tag-hint">💡 每个标签 ≤ 20 字，最多 20 个；输入逗号也会自动添加</div>
        `;
      }

      function renderTagEditor(editorId) {
        const container = document.getElementById(editorId);
        if (!container) return;

        const input = document.getElementById(`${editorId}_input`);
        container.querySelectorAll('.tag-pill').forEach(el => el.remove());

        state.draftTags.forEach((tag, i) => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.innerHTML = `#${escapeHtml(tag)}<button type="button" class="tag-remove" data-tag-index="${i}" title="移除">×</button>`;
          container.insertBefore(pill, input);
        });
      }

      function bindTagEditorEvents(editorId) {
        const container = document.getElementById(editorId);
        const input = document.getElementById(`${editorId}_input`);
        if (!container || !input) return;

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            const v = input.value.trim();
            if (!v) return;
            addDraftTag(v);
            input.value = '';
          } else if (e.key === 'Backspace' && !input.value && state.draftTags.length > 0) {
            state.draftTags.pop();
            markEditDirty();
            renderTagEditor(editorId);
          }
        });

        input.addEventListener('input', () => {
          const v = input.value;
          if (v.includes('，') || v.includes(',')) {
            const parts = v.split(/[,，]/);
            parts.slice(0, -1).forEach(p => { if (p.trim()) addDraftTag(p); });
            input.value = parts[parts.length - 1];
          }
        });

        container.addEventListener('click', (e) => {
          const btn = e.target.closest('.tag-remove');
          if (btn) {
            const i = parseInt(btn.dataset.tagIndex, 10);
            if (!isNaN(i)) {
              state.draftTags.splice(i, 1);
              markEditDirty();
              renderTagEditor(editorId);
            }
            return;
          }
          if (e.target === container) input.focus();
        });
      }

      function addDraftTag(raw) {
        const n = normalizeTag(raw);
        if (!n) return;
        const key = n.toLowerCase();
        if (state.draftTags.some(t => t.toLowerCase() === key)) return;
        if (state.draftTags.length >= MAX_TAGS_PER_ITEM) {
          showToast(`最多 ${MAX_TAGS_PER_ITEM} 个标签`, true);
          return;
        }
        state.draftTags.push(n);
        markEditDirty();
        ['newTagEditor', 'editTagEditor'].forEach(id => {
          if (document.getElementById(id)) renderTagEditor(id);
        });
      }

      function setMode(mode) {
        if (mode === state.mode) { renderContent(); return; }
        guardUnsaved(() => { doSetMode(mode); });
      }

      function doSetMode(mode) {
        if (state.speakingId) stopSpeaking();
        clearPendingCardClick();
        closeAllPalettes();

        if (state.mode === 'edit' && mode !== 'edit') {
          state.editingSessionId = null;
          state.draftImages = [];
          state.draftTags = [];
        }
        if (mode === 'edit' && state.mode !== 'edit') state.editingSessionId = null;

        state.editDirty = false;
        state.formatPainterArmed = false;
        state.formatPainterClip = null;
        state.formatPainterEditorId = null;

        state.searchQuery = '';
        state.filterGroup = '';
        state.filterTag = '';
        state.filterMastery = '';
        state.filterHasImage = false;

        if (state.selectionMode) {
          state.selectionMode = false;
          state.selectedIds = new Set();
        }

        state.mode = mode;
        if (mode !== 'edit') state.isCreatingNew = false;
        [el.globalModeBtn, el.reciteModeBtn, el.editModeBtn].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        validateActiveId();
        renderSidebar(true);
        renderContent();
      }

          el.exportStatus.className = 'status-msg';

            el.exportStatus.className = ok ? 'status-msg' : 'status-msg error';
          } catch (e2) {

      function downloadExportData() {
        try {
          const blob = new Blob([el.exportTextarea.value], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const date = new Date();
          const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
          a.href = url;

      async function parseAndImport(rawText) {
        if (!rawText || !rawText.trim()) {
          el.importStatus.textContent = '❌ 没有可导入的数据';
          el.importStatus.className = 'status-msg error';
          return;
        }
        let parsed;
        try { parsed = JSON.parse(rawText); }
        catch (e) {
          el.importStatus.textContent = '❌ JSON 格式错误，请检查数据';
          el.importStatus.className = 'status-msg error';
          return;
        }
        if (!Array.isArray(parsed)) {
          el.importStatus.textContent = '❌ 数据格式错误，应为数组';
          el.importStatus.className = 'status-msg error';
          return;
        }

        const cleaned = [];
        for (const item of parsed) {
          if (!item || typeof item !== 'object' || item.title === undefined) continue;
          const normalized = normalizeItem(item);
          if (Array.isArray(normalized.images)) {
            const newImages = [];
            for (const ref of normalized.images) {
              if (ref.startsWith('data:image/')) {
                const id = generateId();
                try { await saveImage(id, ref); newImages.push(`img://${id}`); }
                catch (e) { console.warn('导入图片失败', e); }
              } else newImages.push(ref);
            }
            normalized.images = newImages;
          }
          cleaned.push(normalized);
        }

        if (cleaned.length === 0) {
          el.importStatus.textContent = '❌ 没有有效的知识点数据';
          el.importStatus.className = 'status-msg error';
          return;
        }

        if (state.importMode === 'overwrite') {
          showConfirm('确认覆盖', `即将用 ${cleaned.length} 个知识点覆盖当前数据，\n当前 ${state.items.length} 个知识点将被删除。\n\n确定继续吗？`, () => {
            const oldImgs = [];
            state.items.forEach(it => (it.images || []).forEach(r => oldImgs.push(r)));
            state.items = cleaned;
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
            state.isCreatingNew = false;
            state.editingSessionId = null;
            state.editDirty = false;
            state.draftImages = [];
            state.draftTags = [];
            saveToStorage();
            renderSidebar(true);
            renderContent();
            el.importStatus.textContent = `✓ 成功覆盖，共导入 ${cleaned.length} 个知识点！`;
            el.importStatus.className = 'status-msg';
            showToast('导入成功');
            setTimeout(closeImportModal, 1000);
            cleanupImages(oldImgs).catch(() => {});
          });
        } else {
          const existingIds = new Set(state.items.map(i => i.id));
          const merged = cleaned.map(item => {
            const newItem = { ...item };
            while (existingIds.has(newItem.id)) newItem.id = generateId();
            existingIds.add(newItem.id);
            return newItem;
          });
          showConfirm('确认合并', `即将追加 ${merged.length} 个知识点，\n当前 ${state.items.length} 个知识点将被保留。\n合并后共 ${state.items.length + merged.length} 个。\n\n确定继续吗？`, () => {
            state.items = state.items.concat(merged);
            if (!state.activeId && state.items.length > 0) state.activeId = state.items[0].id;
            state.editingSessionId = null;
            state.editDirty = false;
            state.draftImages = [];
            state.draftTags = [];
            saveToStorage();
            renderSidebar(true);
            renderContent();
            el.importStatus.textContent = `✓ 成功合并，新增 ${merged.length} 个知识点！`;
            el.importStatus.className = 'status-msg';
            showToast('导入成功');
            setTimeout(closeImportModal, 1000);
          });
        }
      }
