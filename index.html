      color: #64748b;
      margin-top: 16px;
      text-align: center;
      border-top: 1px dashed #e2e8f0;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">📡 当前处于离线状态</div>

  <header class="app-header">
    <h1>📚 知识点</h1>
    <div class="header-right">
      <div class="mode-toggle">
        <button class="mode-btn" data-mode="global" id="globalModeBtn">全局</button>
        <button class="mode-btn active" data-mode="recite" id="reciteModeBtn">背诵</button>
        <button class="mode-btn" data-mode="edit" id="editModeBtn">录入</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>目录</span>
        <span id="counterBadge">0</span>
      </div>
      <div class="knowledge-list" id="knowledgeList"></div>
    </aside>

    <main class="content-area" id="contentArea"></main>
  </div>

  <!-- 导出模态框 -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📤 导出知识点数据</h3>
        <button class="modal-close" id="exportModalClose">✕</button>
      </div>
      <div class="modal-body">
        <p>以下是当前所有知识点数据。点击“复制到剪贴板”后，可粘贴保存到记事本或发送到其他设备，用于备份或跨设备同步。</p>
        <textarea class="modal-textarea" id="exportTextarea" readonly></textarea>
        <div class="status-msg" id="exportStatus"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="copyExportBtn">📋 复制到剪贴板</button>
        <button class="btn btn-secondary" id="downloadExportBtn">💾 下载为文件</button>
        <button class="btn btn-secondary" id="exportCancelBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 导入模态框 -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📥 导入知识点数据</h3>
        <button class="modal-close" id="importModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="file-drop-zone" id="fileDropZone">
          <span class="file-icon">📁</span>
          <span class="file-text">点击选择文件，或将文件拖到这里</span>
          <div class="file-hint">支持 .json 文件（之前导出的备份文件）</div>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json" style="display: none;">

        <div class="divider-text">或者手动粘贴</div>

        <p>将之前导出的 JSON 数据粘贴到下方输入框中。</p>
        <textarea class="modal-textarea" id="importTextarea" placeholder='粘贴 JSON 数据'></textarea>

        <p style="margin-top: 16px; margin-bottom: 8px; font-weight: 600; color: #334155;">请选择导入方式：</p>
        <div class="import-mode-selector" id="importModeSelector">
          <div class="import-mode-option selected" data-mode="merge">
            <span class="mode-icon">🔀</span>
            <div class="mode-info">
              <div class="mode-title">合并</div>
              <div class="mode-desc">保留现有数据，追加导入的知识点</div>
            </div>
          </div>
          <div class="import-mode-option" data-mode="overwrite">
            <span class="mode-icon">🔄</span>
            <div class="mode-info">
              <div class="mode-title">覆盖</div>
              <div class="mode-desc">清空现有数据，替换为导入的知识点</div>
            </div>
          </div>
        </div>

        <div class="status-msg" id="importStatus"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="doImportBtn">✅ 确认导入</button>
        <button class="btn btn-secondary" id="importCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认对话框 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h4 id="confirmTitle">确认操作</h4>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancel">取消</button>
        <button class="btn btn-primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const SPEECH_CONFIG = {
        rate: 0.85,
        pitch: 1.0,
        volume: 1.0,
        lang: 'zh-CN'
      };

      const MASTERED_THRESHOLD = 100;

      const DEFAULT_ITEMS = [
        { id: '1', title: 'HTML 语义化', content: '使用恰当的 HTML 标签来构建页面结构，例如 header、nav、main、article、section、aside、footer。语义化有助于 SEO、可访问性和代码可读性。', group: '前端基础', masteryLevel: 0 },
        { id: '2', title: 'CSS 盒模型', content: '每个元素都是一个盒子。由内容(content)、内边距(padding)、边框(border)、外边距(margin)组成。box-sizing: border-box 使 width 包含 padding 和 border。', group: '前端基础', masteryLevel: 0 },
        { id: '3', title: 'JavaScript 闭包', content: '闭包是指函数能够记住并访问它的词法作用域，即使函数在其词法作用域之外执行。常用于创建私有变量和回调函数。', group: '前端基础', masteryLevel: 0 },
        { id: '4', title: 'HTTP 状态码', content: '1xx 信息，2xx 成功，3xx 重定向，4xx 客户端错误，5xx 服务端错误。常见：200 OK，301 永久重定向，404 未找到，500 服务器内部错误。', group: '网络基础', masteryLevel: 0 },
        { id: '5', title: 'Flex 布局', content: 'display: flex 创建弹性容器。justify-content 主轴对齐，align-items 交叉轴对齐，flex-direction 方向。flex: 1 占满剩余空间。', group: '前端基础', masteryLevel: 0 },
        { id: '6', title: 'Vue 响应式原理', content: 'Vue2 使用 Object.defineProperty 劫持数据，Vue3 使用 Proxy。当数据变化时触发依赖更新，重新渲染视图。', group: '框架', masteryLevel: 0 }
      ];

      let knowledgeItems = loadFromStorage();
      let activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
      let currentMode = 'recite';
      let isCreatingNew = false;
      let collapsedGroups = loadCollapsedState();
      let reciteIndex = 0;
      let importMode = 'merge';

      const knowledgeListEl = document.getElementById('knowledgeList');
      const contentArea = document.getElementById('contentArea');
      const globalModeBtn = document.getElementById('globalModeBtn');
      const reciteModeBtn = document.getElementById('reciteModeBtn');
      const editModeBtn = document.getElementById('editModeBtn');
      const counterBadge = document.getElementById('counterBadge');
      const sidebar = document.getElementById('sidebar');
      const offlineBanner = document.getElementById('offlineBanner');

      const exportModal = document.getElementById('exportModal');
      const exportTextarea = document.getElementById('exportTextarea');
      const exportStatus = document.getElementById('exportStatus');
      const importModal = document.getElementById('importModal');
      const importTextarea = document.getElementById('importTextarea');
      const importStatus = document.getElementById('importStatus');
      const fileDropZone = document.getElementById('fileDropZone');
      const fileInput = document.getElementById('fileInput');
      const importModeSelector = document.getElementById('importModeSelector');

      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmTitle = document.getElementById('confirmTitle');
      const confirmMessage = document.getElementById('confirmMessage');
      const confirmOk = document.getElementById('confirmOk');
      const confirmCancel = document.getElementById('confirmCancel');

      let confirmCallback = null;

      // ---------- 语音朗读 ----------
      const speechSupported = 'speechSynthesis' in window;
      let currentUtterance = null;
      let speakingId = null;

      function stopSpeaking() {
        if (speechSupported) {
          window.speechSynthesis.cancel();
        }
        speakingId = null;
        currentUtterance = null;
        document.querySelectorAll('.speak-btn').forEach(btn => {
          btn.classList.remove('speaking');
          btn.textContent = '🔊';
          btn.title = '朗读';
        });
      }

      if (speechSupported) {
        window.speechSynthesis.getVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      }

      function getChineseVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return null;
        let voice = voices.find(v => v.lang === 'zh-CN' && v.localService);
        if (!voice) voice = voices.find(v => v.lang === 'zh-CN');
        if (!voice) voice = voices.find(v => v.lang && v.lang.startsWith('zh'));
        return voice || null;
      }

      function normalizeSpeechText(raw) {
        if (!raw) return '';
        let text = String(raw);
        text = text.replace(/\n+/g, '。');
        text = text.replace(/。{2,}/g, '。');
        text = text.replace(/\s+([，。！？；：、])/g, '$1');
        text = text.replace(/([，。！？；：、])\s+/g, '$1');
        return text.trim();
      }

      function speakItem(item) {
        if (!speechSupported) {
          alert('当前浏览器不支持语音朗读功能');
          return;
        }
        if (speakingId === item.id) {
          stopSpeaking();
          return;
        }
        window.speechSynthesis.cancel();
        const title = normalizeSpeechText(item.title);
        const content = normalizeSpeechText(item.content || '');
        let text = title;
        if (content) text += '。' + content;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = SPEECH_CONFIG.rate;
        utterance.pitch = SPEECH_CONFIG.pitch;
        utterance.volume = SPEECH_CONFIG.volume;
        utterance.lang = SPEECH_CONFIG.lang;
        const voice = getChineseVoice();
        if (voice) utterance.voice = voice;

        utterance.onstart = () => {
          speakingId = item.id;
          updateSpeakButton(item.id, true);
        };
        utterance.onend = () => {
          speakingId = null;
          currentUtterance = null;
          updateSpeakButton(item.id, false);
        };
        utterance.onerror = () => {
          speakingId = null;
          currentUtterance = null;
          updateSpeakButton(item.id, false);
        };
        currentUtterance = utterance;
        speakingId = item.id;
        window.speechSynthesis.speak(utterance);
        updateSpeakButton(item.id, true);
      }

      function updateSpeakButton(itemId, isSpeaking) {
        const btn = document.querySelector(`.speak-btn[data-speak-id="${itemId}"]`);
        if (btn) {
          if (isSpeaking) {
            btn.classList.add('speaking');
            btn.textContent = '⏸';
            btn.title = '停止朗读';
          } else {
            btn.classList.remove('speaking');
            btn.textContent = '🔊';
            btn.title = '朗读';
          }
        }
      }

      // ---------- PWA ----------
      function updateOnlineStatus() {
        if (navigator.onLine) {
          offlineBanner.classList.remove('show');
        } else {
          offlineBanner.classList.add('show');
        }
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swCode = `
            const CACHE_NAME = 'knowledge-cards-v5';
            const urlsToCache = ['./', './index.html'];
            self.addEventListener('install', (event) => {
              event.waitUntil(
                caches.open(CACHE_NAME).then((cache) => {
                  return cache.addAll(urlsToCache).catch(() => {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(
                caches.keys().then((cacheNames) => {
                  return Promise.all(
                    cacheNames.map((cacheName) => {
                      if (cacheName !== CACHE_NAME) return caches.delete(cacheName);
                    })
                  );
                })
              );
              self.clients.claim();
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                caches.match(event.request).then((response) => {
                  if (response) {
                    fetch(event.request).then((newResponse) => {
                      if (newResponse && newResponse.status === 200) {
                        caches.open(CACHE_NAME).then((cache) => {
                          cache.put(event.request, newResponse);
                        });
                      }
                    }).catch(() => {});
                    return response;
                  }
                  return fetch(event.request).then((response) => {
                    if (!response || response.status !== 200 || response.type !== 'basic') return response;
                    const responseToCache = response.clone();
                    caches.open(CACHE_NAME).then((cache) => {
                      cache.put(event.request, responseToCache);
                    });
                    return response;
                  }).catch(() => {
                    if (event.request.headers.get('accept')?.includes('text/html')) {
                      return caches.match('./');
                    }
                  });
                })
              );
            });
          `;
          try {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
              .then(() => console.log('Service Worker 注册成功'))
              .catch((err) => console.warn('Service Worker 注册失败:', err));
          } catch (e) {
            console.warn('Service Worker 初始化失败:', e);
          }
        });
      }

      // ---------- 自定义确认对话框 ----------
      function showConfirm(title, message, onConfirm) {
        confirmTitle.textContent = title;
        confirmMessage.textContent = message;
        confirmCallback = onConfirm;
        confirmOverlay.classList.add('show');
      }

      function closeConfirm() {
        confirmOverlay.classList.remove('show');
        confirmCallback = null;
      }

      confirmOk.addEventListener('click', () => {
        const cb = confirmCallback;
        closeConfirm();
        if (cb) cb();
      });
      confirmCancel.addEventListener('click', closeConfirm);
      confirmOverlay.addEventListener('click', (e) => {
        if (e.target === confirmOverlay) closeConfirm();
      });

      // ---------- 工具函数 ----------
      function loadFromStorage() {
        try {
          const stored = localStorage.getItem('knowledge_card_items');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.filter(item => item && item.title !== undefined).map(item => {
                let level = 0;
                if (typeof item.masteryLevel === 'number') {
                  level = Math.max(0, Math.min(100, item.masteryLevel));
                } else if (item.mastered === true) {
                  level = 100;
                }
                return {
                  id: item.id || generateId(),
                  title: item.title || '无标题',
                  content: item.content || '',
                  group: item.group || '',
                  masteryLevel: level
                };
              });
            }
          }
        } catch (e) {
          console.warn('读取localStorage失败', e);
        }
        return DEFAULT_ITEMS.map(item => ({ ...item }));
      }

      function loadCollapsedState() {
        try {
          const stored = localStorage.getItem('knowledge_collapsed_groups');
          return stored ? JSON.parse(stored) : {};
        } catch (e) {
          return {};
        }
      }

      function saveCollapsedState() {
        try {
          localStorage.setItem('knowledge_collapsed_groups', JSON.stringify(collapsedGroups));
        } catch (e) {}
      }

      function saveToStorage() {
        try {
          localStorage.setItem('knowledge_card_items', JSON.stringify(knowledgeItems));
        } catch (e) {
          console.warn('保存localStorage失败', e);
        }
      }

      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 9);
      }

      function updateCounter() {
        counterBadge.textContent = knowledgeItems.length;
      }

      function getActiveItem() {
        return knowledgeItems.find(item => item.id === activeId) || null;
      }

      function validateActiveId() {
        if (isCreatingNew) return;
        if (!knowledgeItems.some(item => item.id === activeId)) {
          activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
        }
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function getAllGroups() {
        const groups = new Set();
        knowledgeItems.forEach(item => {
          if (item.group && item.group.trim()) {
            groups.add(item.group.trim());
          }
        });
        return Array.from(groups).sort();
      }

      function isMastered(item) {
        return (item.masteryLevel || 0) >= MASTERED_THRESHOLD;
      }

      function getMasteryColor(level) {
        const t = Math.max(0, Math.min(100, level)) / 100;
        const r = Math.round(148 + (22 - 148) * t);
        const g = Math.round(163 + (163 - 163) * t);
        const b = Math.round(184 + (74 - 184) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function getCardBackground(level) {
        const t = Math.max(0, Math.min(100, level)) / 100;
        if (t === 0) return '#ffffff';
        const r = Math.round(255 + (220 - 255) * t);
        const g = Math.round(255 + (252 - 255) * t);
        const b = Math.round(255 + (231 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function getCardBorderColor(level) {
        const t = Math.max(0, Math.min(100, level)) / 100;
        if (t === 0) return 'rgba(255, 255, 255, 0.6)';
        const r = Math.round(255 + (187 - 255) * t);
        const g = Math.round(255 + (247 - 255) * t);
        const b = Math.round(255 + (208 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      // ---------- 导出 / 导入 ----------
      function openExportModal() {
        exportTextarea.value = JSON.stringify(knowledgeItems, null, 2);
        exportStatus.textContent = '';
        exportStatus.className = 'status-msg';
        exportModal.classList.add('show');
      }
      function closeExportModal() { exportModal.classList.remove('show'); }
      function openImportModal() {
        importTextarea.value = '';
        importStatus.textContent = '';
        importStatus.className = 'status-msg';
        importMode = 'merge';
        updateImportModeUI();
        importModal.classList.add('show');
      }
      function closeImportModal() { importModal.classList.remove('show'); }

      function updateImportModeUI() {
        importModeSelector.querySelectorAll('.import-mode-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.mode === importMode);
        });
      }

      importModeSelector.querySelectorAll('.import-mode-option').forEach(opt => {
        opt.addEventListener('click', () => {
          importMode = opt.dataset.mode;
          updateImportModeUI();
        });
      });

      async function copyExportData() {
        try {
          await navigator.clipboard.writeText(exportTextarea.value);
          exportStatus.textContent = '✓ 已复制到剪贴板！';
          exportStatus.className = 'status-msg';
        } catch (err) {
          exportTextarea.select();
          exportTextarea.setSelectionRange(0, 99999);
          try {
            const ok = document.execCommand('copy');
            exportStatus.textContent = ok ? '✓ 已复制到剪贴板！' : '复制失败，请手动全选复制';
            exportStatus.className = ok ? 'status-msg' : 'status-msg error';
          } catch (e2) {
            exportStatus.textContent = '复制失败，请手动全选复制';
            exportStatus.className = 'status-msg error';
          }
        }
      }

      function downloadExportData() {
        try {
          const blob = new Blob([exportTextarea.value], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const date = new Date();
          const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
          a.href = url;
          a.download = `知识点备份_${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          exportStatus.textContent = '✓ 文件已开始下载';
          exportStatus.className = 'status-msg';
        } catch (e) {
          exportStatus.textContent = '下载失败，请尝试复制到剪贴板';
          exportStatus.className = 'status-msg error';
        }
      }

      function parseAndImport(rawText) {
        if (!rawText || !rawText.trim()) {
          importStatus.textContent = '❌ 没有可导入的数据';
          importStatus.className = 'status-msg error';
          return;
        }
        let parsed;
        try {
          parsed = JSON.parse(rawText);
        } catch (e) {
          importStatus.textContent = '❌ JSON 格式错误，请检查数据';
          importStatus.className = 'status-msg error';
          return;
        }
        if (!Array.isArray(parsed)) {
          importStatus.textContent = '❌ 数据格式错误，应为数组';
          importStatus.className = 'status-msg error';
          return;
        }
        const cleaned = parsed
          .filter(item => item && typeof item === 'object' && item.title !== undefined)
          .map(item => {
            let level = 0;
            if (typeof item.masteryLevel === 'number') {
              level = Math.max(0, Math.min(100, item.masteryLevel));
            } else if (item.mastered === true) {
              level = 100;
            }
            return {
              id: item.id || generateId(),
              title: String(item.title || '无标题'),
              content: String(item.content || ''),
              group: String(item.group || ''),
              masteryLevel: level
            };
          });

        if (cleaned.length === 0) {
          importStatus.textContent = '❌ 没有有效的知识点数据';
          importStatus.className = 'status-msg error';
          return;
        }

        if (importMode === 'overwrite') {
          showConfirm(
            '确认覆盖',
            `即将用 ${cleaned.length} 个知识点覆盖当前数据，\n当前 ${knowledgeItems.length} 个知识点将被删除。\n\n确定继续吗？`,
            () => {
              knowledgeItems = cleaned;
              activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
              isCreatingNew = false;
              saveToStorage();
              renderSidebar();
              renderContent();
              importStatus.textContent = `✓ 成功覆盖，共导入 ${cleaned.length} 个知识点！`;
              importStatus.className = 'status-msg';
              setTimeout(closeImportModal, 1200);
            }
          );
        } else {
          const existingIds = new Set(knowledgeItems.map(i => i.id));
          const mergedItems = cleaned.map(item => {
            const newItem = { ...item };
            while (existingIds.has(newItem.id)) newItem.id = generateId();
            existingIds.add(newItem.id);
            return newItem;
          });
          showConfirm(
            '确认合并',
            `即将追加 ${mergedItems.length} 个知识点，\n当前 ${knowledgeItems.length} 个知识点将被保留。\n合并后共 ${knowledgeItems.length + mergedItems.length} 个。\n\n确定继续吗？`,
            () => {
              knowledgeItems = knowledgeItems.concat(mergedItems);
              if (!activeId && knowledgeItems.length > 0) activeId = knowledgeItems[0].id;
              saveToStorage();
              renderSidebar();
              renderContent();
              importStatus.textContent = `✓ 成功合并，新增 ${mergedItems.length} 个知识点！`;
              importStatus.className = 'status-msg';
              setTimeout(closeImportModal, 1200);
            }
          );
        }
      }

      function doImport() { parseAndImport(importTextarea.value); }

      function handleFileSelect(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.json') && file.type !== 'application/json') {
          importStatus.textContent = '❌ 请选择 .json 格式的文件';
          importStatus.className = 'status-msg error';
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          importTextarea.value = e.target.result;
          importStatus.textContent = `📄 已加载文件：${file.name}，请点击“确认导入”`;
          importStatus.className = 'status-msg';
        };
        reader.onerror = () => {
          importStatus.textContent = '❌ 文件读取失败，请重试';
          importStatus.className = 'status-msg error';
        };
        reader.readAsText(file);
      }

      fileDropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        handleFileSelect(e.target.files[0]);
        fileInput.value = '';
      });
      fileDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileDropZone.classList.add('dragover');
      });
      fileDropZone.addEventListener('dragleave', () => fileDropZone.classList.remove('dragover'));
      fileDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        fileDropZone.classList.remove('dragover');
        handleFileSelect(e.dataTransfer.files[0]);
      });

      // ---------- 渲染侧边栏 ----------
      function renderSidebar() {
        if (knowledgeItems.length === 0) {
          knowledgeListEl.innerHTML = `<div class="empty-list-msg">暂无知识点</div>`;
          updateCounter();
          return;
        }

        const groups = getAllGroups();
        const ungroupedItems = knowledgeItems.filter(item => !item.group || !item.group.trim());
        let html = '';

        groups.forEach(groupName => {
          const groupItems = knowledgeItems.filter(item => item.group && item.group.trim() === groupName);
          const isCollapsed = collapsedGroups[groupName] === true;
          html += `
            <div class="group-section ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(groupName)}">
              <div class="group-header" data-group-toggle="${escapeHtml(groupName)}">
                <span class="group-arrow">▼</span>
                <span class="group-name">${escapeHtml(groupName)}</span>
                <span class="group-count">${groupItems.length}</span>
                <div class="group-actions">
                  <button class="group-action-btn delete-group" data-group-delete="${escapeHtml(groupName)}" title="删除该组（知识点将变为未分组）">✕</button>
                </div>
              </div>
              <div class="group-items">
                ${groupItems.map(item => renderKnowledgeItem(item)).join('')}
              </div>
            </div>
          `;
        });

        if (ungroupedItems.length > 0) {
          if (groups.length > 0) html += `<div class="ungrouped-label">未分组</div>`;
          html += ungroupedItems.map(item => renderKnowledgeItem(item)).join('');
        }

        knowledgeListEl.innerHTML = html;
        updateCounter();

        document.querySelectorAll('.group-header').forEach(header => {
          header.addEventListener('click', (e) => {
            if (e.target.closest('.delete-group')) return;
            const groupName = header.dataset.groupToggle;
            if (!groupName) return;
            collapsedGroups[groupName] = !collapsedGroups[groupName];
            saveCollapsedState();
            const section = header.closest('.group-section');
            if (section) section.classList.toggle('collapsed', collapsedGroups[groupName]);
          });
        });

        document.querySelectorAll('.delete-group').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteGroup(btn.dataset.groupDelete);
          });
        });

        document.querySelectorAll('.knowledge-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.delete-btn')) return;
            const id = el.dataset.id;
            if (id && (id !== activeId || isCreatingNew)) {
              activeId = id;
              isCreatingNew = false;
              if (currentMode === 'global') {
                setMode('recite');
              } else {
                renderSidebar();
                renderContent();
              }
            } else if (id === activeId && currentMode === 'global') {
              setMode('recite');
            }
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteKnowledgeItem(btn.dataset.id);
          });
        });
      }

      function renderKnowledgeItem(item) {
        const isActive = item.id === activeId && !isCreatingNew;
        const displayTitle = item.title.length > 12 ? item.title.slice(0, 10) + '…' : item.title;
        const masteredClass = isMastered(item) ? 'mastered' : '';
        const masteredBadge = isMastered(item) ? '<span class="mastered-badge">✓</span>' : '';
        return `
          <div class="knowledge-item ${isActive ? 'active' : ''} ${masteredClass}" data-id="${item.id}">
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${masteredBadge}${escapeHtml(displayTitle)}</span>
            <div class="item-actions">
              <button class="delete-btn" data-id="${item.id}" title="删除知识点">✕</button>
            </div>
          </div>
        `;
      }

      function deleteGroup(groupName) {
        const count = knowledgeItems.filter(item => item.group === groupName).length;
        showConfirm(
          '删除分组',
          `确定要删除分组「${groupName}」吗？\n组内 ${count} 个知识点将变为未分组状态。`,
          () => {
            knowledgeItems.forEach(item => {
              if (item.group === groupName) item.group = '';
            });
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        );
      }

      function deleteKnowledgeItem(id) {
        const index = knowledgeItems.findIndex(item => item.id === id);
        if (index === -1) return;
        showConfirm(
          '删除知识点',
          `确定要删除知识点「${knowledgeItems[index].title}」吗？`,
          () => {
            if (speakingId === id) stopSpeaking();
            knowledgeItems.splice(index, 1);
            if (activeId === id) {
              activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
              isCreatingNew = false;
            }
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        );
      }

      // ---------- 渲染内容区 ----------
      function renderContent() {
        validateActiveId();

        if (currentMode === 'global') {
          sidebar.classList.add('hidden-sidebar');
          contentArea.classList.add('full-width');
          contentArea.classList.remove('recite-full');
        } else if (currentMode === 'recite') {
          sidebar.classList.add('hidden-sidebar');
          contentArea.classList.add('recite-full');
          contentArea.classList.remove('full-width');
        } else {
          sidebar.classList.remove('hidden-sidebar');
          contentArea.classList.remove('full-width');
          contentArea.classList.remove('recite-full');
        }

        if (speakingId) stopSpeaking();

        if (currentMode === 'global') {
          renderGlobalMode();
        } else if (currentMode === 'recite') {
          renderReciteMode();
        } else {
          renderEditMode();
        }
        updateSidebarAddButton();
      }

      // ========== 全局模式 ==========
      function renderGlobalMode() {
        if (knowledgeItems.length === 0) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const groups = getAllGroups();
        const ungroupedItems = knowledgeItems.filter(item => !item.group || !item.group.trim());
        let html = '';

        groups.forEach(groupName => {
          const groupItems = knowledgeItems.filter(item => item.group && item.group.trim() === groupName);
          if (groupItems.length === 0) return;
          const sorted = [
            ...groupItems.filter(i => !isMastered(i)),
            ...groupItems.filter(i => isMastered(i))
          ];
          html += `
            <div class="global-group-section" data-group="${escapeHtml(groupName)}">
              <div class="global-group-divider">
                <span class="divider-name"><span class="group-icon">📁</span>${escapeHtml(groupName)}</span>
                <span class="divider-count">${groupItems.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${sorted.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        });

        if (ungroupedItems.length > 0) {
          const sorted = [
            ...ungroupedItems.filter(i => !isMastered(i)),
            ...ungroupedItems.filter(i => isMastered(i))
          ];
          html += `
            <div class="global-group-section ungrouped-section" data-group="">
              <div class="global-group-divider">
                <span class="divider-name"><span class="group-icon">📄</span>未分组</span>
                <span class="divider-count">${ungroupedItems.length}</span>
                <span class="divider-line"></span>
              </div>
              <div class="global-grid">
                ${sorted.map(renderGlobalCard).join('')}
              </div>
            </div>
          `;
        }

        contentArea.innerHTML = html;

        contentArea.querySelectorAll('.global-card').forEach(card => {
          card.addEventListener('click', () => {
            if (card.dataset.dragMoved === 'true') return;
            const id = card.dataset.id;
            if (id) {
              activeId = id;
              isCreatingNew = false;
              setMode('recite');
            }
          });
        });

        initGlobalDragSort();
      }

      function renderGlobalCard(item) {
        const masteredClass = isMastered(item) ? 'mastered-global' : '';
        const masteredCheck = isMastered(item) ? '<span class="mastered-check">✓</span>' : '';
        return `
          <div class="global-card ${masteredClass}" data-id="${item.id}" draggable="false">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-content">${escapeHtml(item.content) || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
            ${masteredCheck}
            <span class="drag-handle">⠿</span>
          </div>
        `;
      }

      // ========== 全局模式拖拽排序 ==========
      function initGlobalDragSort() {
        let draggedElement = null;
        let placeholder = null;
        let startX = 0, startY = 0;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;

        const allCards = contentArea.querySelectorAll('.global-card');
        allCards.forEach(card => {
          card.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            startDrag(e.clientX, e.clientY, card);
          });
          card.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startDrag(touch.clientX, touch.clientY, card);
          }, { passive: true });
        });

        function startDrag(clientX, clientY, card) {
          startX = clientX;
          startY = clientY;
          isDragging = false;
          card.dataset.dragMoved = 'false';
          const rect = card.getBoundingClientRect();
          dragOffsetX = clientX - rect.left;
          dragOffsetY = clientY - rect.top;

          const onMouseMove = (moveEvent) => {
            const moveX = moveEvent.clientX !== undefined ? moveEvent.clientX : moveEvent.touches[0].clientX;
            const moveY = moveEvent.clientY !== undefined ? moveEvent.clientY : moveEvent.touches[0].clientY;
            const deltaX = Math.abs(moveX - startX);
            const deltaY = Math.abs(moveY - startY);
            if (!isDragging && (deltaX > 5 || deltaY > 5)) {
              isDragging = true;
              beginDrag(card, moveX, moveY);
            }
            if (isDragging) {
              moveEvent.preventDefault();
              updateDragPosition(moveX, moveY);
              handleDragOver(moveX, moveY);
            }
          };

          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.removeEventListener('touchmove', onMouseMove);
            document.removeEventListener('touchend', onMouseUp);
            if (isDragging) endDrag();
            setTimeout(() => {
              if (card) card.dataset.dragMoved = 'false';
            }, 50);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
          document.addEventListener('touchmove', onMouseMove, { passive: false });
          document.addEventListener('touchend', onMouseUp);
        }

        function beginDrag(card, clientX, clientY) {
          draggedElement = card;
          card.classList.add('dragging');
          card.dataset.dragMoved = 'true';
          placeholder = document.createElement('div');
          placeholder.className = 'global-card';
          placeholder.style.visibility = 'hidden';
          placeholder.style.height = card.offsetHeight + 'px';
          placeholder.style.width = card.offsetWidth + 'px';
          placeholder.style.pointerEvents = 'none';
          placeholder.dataset.placeholder = 'true';

          const rect = card.getBoundingClientRect();
          card.style.position = 'fixed';
          card.style.left = rect.left + 'px';
          card.style.top = rect.top + 'px';
          card.style.width = rect.width + 'px';
          card.style.height = rect.height + 'px';
          card.style.zIndex = '1000';
          card.style.pointerEvents = 'none';
          card.parentNode.insertBefore(placeholder, card);
        }

        function updateDragPosition(clientX, clientY) {
          if (!draggedElement) return;
          draggedElement.style.left = (clientX - dragOffsetX) + 'px';
          draggedElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragOver(clientX, clientY) {
          if (!draggedElement || !placeholder) return;
          const elemBelow = document.elementFromPoint(clientX, clientY);
          if (!elemBelow) return;
          const targetCard = elemBelow.closest('.global-card');
          if (!targetCard || targetCard === draggedElement || targetCard === placeholder) return;
          const targetGrid = targetCard.closest('.global-grid');
          if (!targetGrid) return;

          const targetRect = targetCard.getBoundingClientRect();
          const targetMiddleX = targetRect.left + targetRect.width / 2;
          const targetMiddleY = targetRect.top + targetRect.height / 2;
          const insertBefore = (clientY < targetMiddleY) || (Math.abs(clientY - targetMiddleY) < targetRect.height / 2 && clientX < targetMiddleX);

          if (insertBefore) {
            targetGrid.insertBefore(placeholder, targetCard);
          } else {
            if (targetCard.nextSibling) targetGrid.insertBefore(placeholder, targetCard.nextSibling);
            else targetGrid.appendChild(placeholder);
          }
        }

        function endDrag() {
          if (!draggedElement || !placeholder) return;
          placeholder.parentNode.insertBefore(draggedElement, placeholder);
          placeholder.remove();
          draggedElement.classList.remove('dragging');
          draggedElement.style.position = '';
          draggedElement.style.left = '';
          draggedElement.style.top = '';
          draggedElement.style.width = '';
          draggedElement.style.height = '';
          draggedElement.style.zIndex = '';
          draggedElement.style.pointerEvents = '';
          updateDataOrder();
          draggedElement = null;
          placeholder = null;
          isDragging = false;
        }

        function updateDataOrder() {
          const sections = contentArea.querySelectorAll('.global-group-section');
          const newOrderedIds = [];
          const idToGroup = {};
          sections.forEach(section => {
            const groupName = section.dataset.group || '';
            section.querySelectorAll('.global-card:not([data-placeholder])').forEach(card => {
              const id = card.dataset.id;
              if (id) {
                newOrderedIds.push(id);
                idToGroup[id] = groupName;
              }
            });
          });
          if (newOrderedIds.length !== knowledgeItems.length) return;
          const newItems = [];
          newOrderedIds.forEach(id => {
            const item = knowledgeItems.find(i => i.id === id);
            if (item) {
              item.group = idToGroup[id] || '';
              newItems.push(item);
            }
          });
          knowledgeItems = newItems;
          saveToStorage();
          renderSidebar();
          setTimeout(() => {
            if (currentMode === 'global') renderGlobalMode();
          }, 0);
        }
      }

      // ========== 背诵模式 ==========
      function renderReciteMode() {
        if (knowledgeItems.length === 0) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const currentIndex = knowledgeItems.findIndex(item => item.id === activeId);
        reciteIndex = currentIndex >= 0 ? currentIndex : 0;
        if (reciteIndex >= knowledgeItems.length) reciteIndex = knowledgeItems.length - 1;

        // 两个实心三角形箭头 SVG
        const prevArrowSvg = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 28 6 L 12 20 L 28 34 Z"/></svg>`;
        const nextArrowSvg = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 12 6 L 28 20 L 12 34 Z"/></svg>`;

        let slidesHtml = '';
        knowledgeItems.forEach((item, idx) => {
          const groupTag = item.group && item.group.trim()
            ? `<div style="font-size:0.75rem;color:#64748b;background:#f1f5f9;display:inline-block;padding:3px 12px;border-radius:20px;margin-bottom:12px;">📁 ${escapeHtml(item.group)}</div>`
            : '';

          const speakBtnHtml = speechSupported
            ? `<button class="speak-btn" data-speak-id="${item.id}" title="朗读">🔊</button>`
            : '';

          slidesHtml += `
            <div class="recite-slide" data-index="${idx}" data-id="${item.id}">
              <div class="recite-slide-inner">
                <div class="knowledge-card" data-card-id="${item.id}">
                  ${groupTag}
                  <div class="card-title-row">
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${speakBtnHtml}
                  </div>
                  <div class="card-content">${escapeHtml(item.content) || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
                </div>
                <div class="mastery-slider-row">
                  <div class="mastery-labels">
                    <span class="left-label" data-label-left="${item.id}">😵 不熟</span>
                    <span class="right-label" data-label-right="${item.id}">🤩 熟记</span>
                  </div>
                  <div class="mastery-slider-container" data-slider-id="${item.id}">
                    <div class="mastery-track">
                      <div class="mastery-fill" data-fill-id="${item.id}"></div>
                    </div>
                    <div class="mastery-thumb" data-thumb-id="${item.id}"></div>
                  </div>
                  <div class="slide-nav-row">
                    <button class="slide-nav-btn" data-nav-prev="${item.id}" title="上一个" aria-label="上一个">
                      ${prevArrowSvg}
                    </button>
                    <span class="slide-nav-position" data-nav-pos="${item.id}">${idx + 1} / ${knowledgeItems.length}</span>
                    <button class="slide-nav-btn" data-nav-next="${item.id}" title="下一个" aria-label="下一个">
                      ${nextArrowSvg}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        // 注意：这里已去掉 .recite-indicator 元素
        contentArea.innerHTML = `
          <div class="recite-container">
            <div class="recite-slider" id="reciteSlider">
              ${slidesHtml}
            </div>
          </div>
        `;

        const slider = document.getElementById('reciteSlider');

        const slideWidth = slider.clientWidth;
        slider.scrollLeft = reciteIndex * slideWidth;

        knowledgeItems.forEach(item => {
          updateSliderVisuals(item.id, item.masteryLevel || 0);
        });

        contentArea.querySelectorAll('.mastery-slider-container').forEach(container => {
          initMasterySlider(container.dataset.sliderId);
        });

        function updateNavUI() {
          contentArea.querySelectorAll('[data-nav-prev]').forEach(btn => {
            btn.disabled = reciteIndex === 0;
          });
          contentArea.querySelectorAll('[data-nav-next]').forEach(btn => {
            btn.disabled = reciteIndex === knowledgeItems.length - 1;
          });
          contentArea.querySelectorAll('[data-nav-pos]').forEach(el => {
            el.textContent = `${reciteIndex + 1} / ${knowledgeItems.length}`;
          });
        }

        function scrollToIndex(idx, smooth) {
          const targetLeft = idx * slider.clientWidth;
          if (smooth) {
            slider.scrollTo({ left: targetLeft, behavior: 'smooth' });
          } else {
            slider.scrollLeft = targetLeft;
          }
        }

        function goToPrev() {
          if (reciteIndex <= 0) return;
          if (speakingId) stopSpeaking();
          reciteIndex--;
          activeId = knowledgeItems[reciteIndex].id;
          updateNavUI();
          scrollToIndex(reciteIndex, true);
          renderSidebar();
        }

        function goToNext() {
          if (reciteIndex >= knowledgeItems.length - 1) return;
          if (speakingId) stopSpeaking();
          reciteIndex++;
          activeId = knowledgeItems[reciteIndex].id;
          updateNavUI();
          scrollToIndex(reciteIndex, true);
          renderSidebar();
        }

        contentArea.querySelectorAll('[data-nav-prev]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            goToPrev();
          });
        });
        contentArea.querySelectorAll('[data-nav-next]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            goToNext();
          });
        });

        updateNavUI();

        let scrollTimer = null;
        slider.addEventListener('scroll', () => {
          if (scrollTimer) clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const newIndex = Math.round(slider.scrollLeft / slider.clientWidth);
            if (newIndex !== reciteIndex && newIndex >= 0 && newIndex < knowledgeItems.length) {
              reciteIndex = newIndex;
              activeId = knowledgeItems[reciteIndex].id;
              if (speakingId) stopSpeaking();
              updateNavUI();
              renderSidebar();
            }
          }, 30);
        }, { passive: true });

        contentArea.querySelectorAll('.speak-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.speakId;
            const item = knowledgeItems.find(i => i.id === id);
            if (item) speakItem(item);
          });
        });
      }

      // 初始化一个滑块
      function initMasterySlider(itemId) {
        const container = document.querySelector(`.mastery-slider-container[data-slider-id="${itemId}"]`);
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!container || !thumb || !fill) return;

        let isDragging = false;
        let currentLevel = 0;
        const item = knowledgeItems.find(i => i.id === itemId);
        if (item) currentLevel = item.masteryLevel || 0;

        function getLevelFromX(clientX) {
          const rect = container.getBoundingClientRect();
          const x = clientX - rect.left;
          const ratio = Math.max(0, Math.min(1, x / rect.width));
          return Math.round(ratio * 100);
        }

        function applyLevel(level, save) {
          currentLevel = level;
          const percent = level;
          fill.style.width = percent + '%';
          thumb.style.left = percent + '%';

          const color = getMasteryColor(level);
          thumb.style.borderColor = color;
          thumb.style.background = level > 0 ? color : '#ffffff';

          if (card) {
            card.style.background = getCardBackground(level);
            card.style.borderColor = getCardBorderColor(level);
            const titleColor = level >= 100 ? '#14532d' : '#0f172a';
            const titleEl = card.querySelector('.card-title');
            if (titleEl) titleEl.style.color = titleColor;
          }

          const leftLabel = document.querySelector(`.left-label[data-label-left="${itemId}"]`);
          const rightLabel = document.querySelector(`.right-label[data-label-right="${itemId}"]`);
          if (leftLabel) leftLabel.style.color = level < 50 ? '#64748b' : '#cbd5e1';
          if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : '#cbd5e1';

          if (save) {
            const dataItem = knowledgeItems.find(i => i.id === itemId);
            if (dataItem) {
              dataItem.masteryLevel = level;
              saveToStorage();
              renderSidebar();
            }
          }
        }

        function onStart(clientX) {
          isDragging = true;
          thumb.classList.add('dragging');
          applyLevel(getLevelFromX(clientX), false);
        }
        function onMove(clientX) {
          if (!isDragging) return;
          applyLevel(getLevelFromX(clientX), false);
        }
        function onEnd() {
          if (!isDragging) return;
          isDragging = false;
          thumb.classList.remove('dragging');
          let finalLevel = currentLevel;
          if (currentLevel < 5) finalLevel = 0;
          else if (currentLevel > 95) finalLevel = 100;
          applyLevel(finalLevel, true);
        }

        thumb.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          onStart(e.clientX);
          const onMouseMove = (ev) => onMove(ev.clientX);
          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            onEnd();
          };
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        container.addEventListener('mousedown', (e) => {
          if (e.target === thumb) return;
          e.preventDefault();
          e.stopPropagation();
          onStart(e.clientX);
          const onMouseMove = (ev) => onMove(ev.clientX);
          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            onEnd();
          };
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        thumb.addEventListener('touchstart', (e) => {
          e.stopPropagation();
          onStart(e.touches[0].clientX);
        }, { passive: true });

        container.addEventListener('touchstart', (e) => {
          if (e.target === thumb) return;
          e.stopPropagation();
          onStart(e.touches[0].clientX);
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
          if (!isDragging) return;
          e.preventDefault();
          onMove(e.touches[0].clientX);
        }, { passive: false });

        container.addEventListener('touchend', onEnd);
        container.addEventListener('touchcancel', onEnd);
      }

      function updateSliderVisuals(itemId, level) {
        const thumb = document.querySelector(`.mastery-thumb[data-thumb-id="${itemId}"]`);
        const fill = document.querySelector(`.mastery-fill[data-fill-id="${itemId}"]`);
        const card = document.querySelector(`.knowledge-card[data-card-id="${itemId}"]`);
        if (!thumb || !fill) return;

        fill.style.width = level + '%';
        thumb.style.left = level + '%';
        const color = getMasteryColor(level);
        thumb.style.borderColor = color;
        thumb.style.background = level > 0 ? color : '#ffffff';

        if (card) {
          card.style.background = getCardBackground(level);
          card.style.borderColor = getCardBorderColor(level);
        }

        const leftLabel = document.querySelector(`.left-label[data-label-left="${itemId}"]`);
        const rightLabel = document.querySelector(`.right-label[data-label-right="${itemId}"]`);
        if (leftLabel) leftLabel.style.color = level < 50 ? '#64748b' : '#cbd5e1';
        if (rightLabel) rightLabel.style.color = level > 50 ? '#16a34a' : '#cbd5e1';
      }

      // 录入模式
      function renderEditMode() {
        const activeItem = getActiveItem();
        const dataActionsHtml = `
          <div class="edit-data-actions">
            <button class="data-btn" id="exportBtn">📤 导出</button>
            <button class="data-btn" id="importBtn">📥 导入</button>
          </div>
        `;

        if (isCreatingNew || !activeItem) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="edit-card">
                <div class="input-group">
                  <label>📌 标题</label>
                  <input type="text" id="newTitleInput" placeholder="例如：HTTP 状态码" value="">
                </div>
                <div class="input-group">
                  <label>📁 上级目录（可选）</label>
                  <input type="text" id="newGroupInput" list="newGroupList" placeholder="输入分组名称，如：前端基础" value="">
                  <datalist id="newGroupList">
                    ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                  </datalist>
                </div>
                <div class="input-group">
                  <label>📝 内容</label>
                  <textarea id="newContentInput" placeholder="在此输入知识点详细内容..."></textarea>
                </div>
                <div class="button-group">
                  <button class="btn btn-primary" id="addNewBtn">➕ 添加知识点</button>
                  <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
                </div>
                <div class="hint">💡 输入新的分组名称会自动创建新分组</div>
              </div>
              ${dataActionsHtml}
            </div>
          `;

          document.getElementById('addNewBtn').addEventListener('click', () => {
            const titleInput = document.getElementById('newTitleInput');
            const groupInput = document.getElementById('newGroupInput');
            const contentInput = document.getElementById('newContentInput');
            const title = titleInput.value.trim();
            const group = groupInput.value.trim();
            const content = contentInput.value.trim();
            if (!title) { alert('请输入标题'); return; }
            const newItem = { id: generateId(), title, content, group, masteryLevel: 0 };
            knowledgeItems.push(newItem);
            activeId = newItem.id;
            isCreatingNew = false;
            saveToStorage();
            renderSidebar();
            renderContent();
          });

          document.getElementById('cancelAddBtn').addEventListener('click', () => {
            isCreatingNew = false;
            activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
            renderSidebar();
            renderContent();
          });

          document.getElementById('exportBtn').addEventListener('click', openExportModal);
          document.getElementById('importBtn').addEventListener('click', openImportModal);
          return;
        }

        contentArea.innerHTML = `
          <div class="card-wrapper">
            <div class="edit-card">
              <div class="input-group">
                <label>✏️ 标题</label>
                <input type="text" id="editTitleInput" value="${escapeHtml(activeItem.title)}" placeholder="知识点标题">
              </div>
              <div class="input-group">
                <label>📁 上级目录（可选）</label>
                <input type="text" id="editGroupInput" list="editGroupList" value="${escapeHtml(activeItem.group || '')}" placeholder="输入分组名称，留空为无分组">
                <datalist id="editGroupList">
                  ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                </datalist>
              </div>
              <div class="input-group">
                <label>📄 内容</label>
                <textarea id="editContentInput" placeholder="知识点内容">${escapeHtml(activeItem.content)}</textarea>
              </div>
              <div class="button-group">
                <button class="btn btn-primary" id="saveEditBtn">💾 保存修改</button>
                <button class="btn btn-secondary" id="cancelEditBtn">↩️ 取消</button>
              </div>
              <div class="hint">当前编辑: ${escapeHtml(activeItem.title)}</div>
            </div>
            ${dataActionsHtml}
          </div>
        `;

        document.getElementById('saveEditBtn').addEventListener('click', () => {
          const newTitle = document.getElementById('editTitleInput').value.trim();
          const newGroup = document.getElementById('editGroupInput').value.trim();
          const newContent = document.getElementById('editContentInput').value.trim();
          if (!newTitle) { alert('标题不能为空'); return; }
          const item = getActiveItem();
          if (item) {
            item.title = newTitle;
            item.group = newGroup;
            item.content = newContent;
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', renderContent);
        document.getElementById('exportBtn').addEventListener('click', openExportModal);
        document.getElementById('importBtn').addEventListener('click', openImportModal);
      }

      function updateSidebarAddButton() {
        const oldBtn = document.getElementById('sidebarAddBtn');
        if (oldBtn) oldBtn.remove();
        if (currentMode !== 'edit') return;

        const addBtn = document.createElement('button');
        addBtn.id = 'sidebarAddBtn';
        addBtn.className = 'btn btn-secondary';
        addBtn.style.margin = '8px 6px 12px';
        addBtn.style.padding = '8px 4px';
        addBtn.style.fontSize = '0.75rem';
        addBtn.style.borderRadius = '30px';
        addBtn.style.width = 'calc(100% - 12px)';
        addBtn.style.flexShrink = '0';
        addBtn.style.backgroundColor = '#f8fafc';
        addBtn.innerHTML = '➕ 新建';
        addBtn.addEventListener('click', () => {
          isCreatingNew = true;
          renderSidebar();
          renderContent();
        });
        sidebar.appendChild(addBtn);
      }

      function setMode(mode) {
        if (mode === currentMode) {
          renderContent();
          return;
        }
        if (speakingId) stopSpeaking();
        currentMode = mode;
        if (mode !== 'edit') isCreatingNew = false;
        [globalModeBtn, reciteModeBtn, editModeBtn].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        validateActiveId();
        renderSidebar();
        renderContent();
      }

      // ---------- 事件绑定 ----------
      globalModeBtn.addEventListener('click', () => setMode('global'));
      reciteModeBtn.addEventListener('click', () => setMode('recite'));
      editModeBtn.addEventListener('click', () => setMode('edit'));

      document.getElementById('exportModalClose').addEventListener('click', closeExportModal);
      document.getElementById('exportCancelBtn').addEventListener('click', closeExportModal);
      document.getElementById('copyExportBtn').addEventListener('click', copyExportData);
      document.getElementById('downloadExportBtn').addEventListener('click', downloadExportData);

      document.getElementById('importModalClose').addEventListener('click', closeImportModal);
      document.getElementById('importCancelBtn').addEventListener('click', closeImportModal);
      document.getElementById('doImportBtn').addEventListener('click', doImport);

      exportModal.addEventListener('click', (e) => { if (e.target === exportModal) closeExportModal(); });
      importModal.addEventListener('click', (e) => { if (e.target === importModal) closeImportModal(); });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (exportModal.classList.contains('show')) closeExportModal();
          if (importModal.classList.contains('show')) closeImportModal();
          if (confirmOverlay.classList.contains('show')) closeConfirm();
          if (speakingId) stopSpeaking();
        }
        if (currentMode === 'recite' && knowledgeItems.length > 0) {
          const slider = document.getElementById('reciteSlider');
          if (e.key === 'ArrowLeft' && reciteIndex > 0 && slider) {
            if (speakingId) stopSpeaking();
            reciteIndex--;
            activeId = knowledgeItems[reciteIndex].id;
            contentArea.querySelectorAll('[data-nav-prev]').forEach(btn => { btn.disabled = reciteIndex === 0; });
            contentArea.querySelectorAll('[data-nav-next]').forEach(btn => { btn.disabled = reciteIndex === knowledgeItems.length - 1; });
            contentArea.querySelectorAll('[data-nav-pos]').forEach(el => { el.textContent = `${reciteIndex + 1} / ${knowledgeItems.length}`; });
            slider.scrollTo({ left: reciteIndex * slider.clientWidth, behavior: 'smooth' });
            renderSidebar();
          } else if (e.key === 'ArrowRight' && reciteIndex < knowledgeItems.length - 1 && slider) {
            if (speakingId) stopSpeaking();
            reciteIndex++;
            activeId = knowledgeItems[reciteIndex].id;
            contentArea.querySelectorAll('[data-nav-prev]').forEach(btn => { btn.disabled = reciteIndex === 0; });
            contentArea.querySelectorAll('[data-nav-next]').forEach(btn => { btn.disabled = reciteIndex === knowledgeItems.length - 1; });
            contentArea.querySelectorAll('[data-nav-pos]').forEach(el => { el.textContent = `${reciteIndex + 1} / ${knowledgeItems.length}`; });
            slider.scrollTo({ left: reciteIndex * slider.clientWidth, behavior: 'smooth' });
            renderSidebar();
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && speakingId) stopSpeaking();
      });
      window.addEventListener('pagehide', () => {
        if (speakingId) stopSpeaking();
      });

      function init() {
        validateActiveId();
        renderSidebar();
        renderContent();
        saveToStorage();
      }

      init();
    })();
  </script>
</body>
</html>
