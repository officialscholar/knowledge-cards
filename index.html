<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>知识点记忆卡片 · 小程序</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f7fc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1e293b;
    }

    .app-header {
      padding: 12px 16px 8px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      flex-wrap: wrap;
      gap: 8px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-toggle {
      display: flex;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 40px;
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: white;
      color: #1e3a8a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      font-weight: 600;
    }

    /* 数据按钮组 - 只在录入模式显示 */
    .data-btn-group {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .data-btn-group.show {
      display: flex;
    }

    .data-btn {
      padding: 6px 12px;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .data-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #1e3a8a;
    }

    .data-btn:active {
      transform: scale(0.97);
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
      z-index: 5;
    }

    .sidebar.hidden-sidebar {
      display: none;
    }

    .sidebar-header {
      padding: 16px 16px 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header span:last-child {
      background: #eef2f6;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #334155;
    }

    .knowledge-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 #f1f5f9;
    }

    .knowledge-list::-webkit-scrollbar {
      width: 4px;
    }

    .knowledge-list::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .knowledge-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .group-section {
      margin-bottom: 8px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .group-header:hover {
      background: #f1f5f9;
    }

    .group-header .group-arrow {
      font-size: 0.65rem;
      transition: transform 0.2s;
      color: #94a3b8;
      display: inline-block;
      width: 12px;
      text-align: center;
    }

    .group-section.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .group-header .group-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-header .group-count {
      background: #eef2f6;
      color: #64748b;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .group-items {
      padding-left: 6px;
      overflow: hidden;
    }

    .group-section.collapsed .group-items {
      display: none;
    }

    .group-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .group-header:hover .group-actions {
      opacity: 1;
    }

    .group-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1;
      transition: all 0.1s;
    }

    .group-action-btn:hover {
      background: #e2e8f0;
      color: #334155;
    }

    .group-action-btn.delete-group:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .ungrouped-label {
      font-size: 0.7rem;
      color: #94a3b8;
      padding: 8px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      font-style: italic;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 4px 0;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #eef2f6;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      word-break: break-word;
      line-height: 1.4;
    }

    .knowledge-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .knowledge-item.active {
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 12px 8px 8px 12px;
      font-weight: 600;
      color: #1e3a8a;
    }

    .knowledge-item.mastered {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    .knowledge-item.mastered.active {
      background: #dcfce7;
      border-left-color: #16a34a;
      color: #14532d;
    }

    .mastered-badge {
      font-size: 0.65rem;
      color: #16a34a;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      white-space: nowrap;
      margin-right: 2px;
    }

    .group-items .knowledge-item {
      margin-left: 4px;
      font-size: 0.9rem;
      padding: 10px 12px;
    }

    .item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .knowledge-item:hover .item-actions,
    .knowledge-item.active .item-actions {
      opacity: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      transition: all 0.1s;
      width: 28px;
      height: 28px;
      line-height: 1;
    }

    .delete-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .empty-list-msg {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      padding: 30px 10px;
      font-style: italic;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f7fc;
    }

    .content-area.full-width {
      padding: 16px 16px 32px;
    }

    .card-wrapper {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .knowledge-card {
      background: white;
      border-radius: 28px;
      padding: 28px 28px 32px;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.08), 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s;
      word-break: break-word;
    }

    .knowledge-card.mastered-card {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0;
      box-shadow: 0 12px 30px rgba(22, 163, 74, 0.12);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 18px;
      color: #0f172a;
      letter-spacing: -0.02em;
      padding-bottom: 8px;
      border-bottom: 3px solid #eef2ff;
    }

    .mastered-card .card-title {
      border-bottom-color: #bbf7d0;
      color: #14532d;
    }

    .card-content {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mastered-card .card-content {
      color: #166534;
    }

    .recite-actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .master-btn {
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      background: #16a34a;
      color: white;
      box-shadow: 0 6px 14px rgba(22, 163, 74, 0.25);
    }

    .master-btn:hover {
      background: #15803d;
    }

    .master-btn:active {
      transform: scale(0.98);
    }

    .master-btn.unmaster-btn {
      background: #ffffff;
      color: #16a34a;
      border: 2px solid #16a34a;
      box-shadow: 0 6px 14px rgba(22, 163, 74, 0.12);
    }

    .master-btn.unmaster-btn:hover {
      background: #f0fdf4;
    }

    .global-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      width: 100%;
      margin: 0 auto;
      align-items: stretch;
    }

    .global-card {
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 6px 16px rgba(0, 20, 50, 0.08), 0 2px 4px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.8);
      cursor: grab;
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      height: 140px;
      overflow: hidden;
      position: relative;
      will-change: transform;
      touch-action: none;
      user-select: none;
    }

    .global-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 28px rgba(0, 20, 50, 0.14), 0 4px 8px rgba(0, 0, 0, 0.04);
      border-color: #dbeafe;
    }

    .global-card:active {
      cursor: grabbing;
    }

    .global-card.dragging {
      opacity: 0.85;
      transform: scale(1.05) rotate(1deg);
      box-shadow: 0 24px 40px rgba(0, 20, 50, 0.22);
      z-index: 1000;
      cursor: grabbing;
      transition: none;
    }

    .global-card.drag-over {
      border: 2px dashed #2563eb;
      background: #eff6ff;
      transform: scale(0.98);
    }

    .drag-handle {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 0.7rem;
      color: #cbd5e1;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .global-card:hover .drag-handle {
      opacity: 1;
      color: #94a3b8;
    }

    .global-card.mastered-global {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-color: #bbf7d0;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.1), 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    .global-card.mastered-global:hover {
      box-shadow: 0 16px 28px rgba(22, 163, 74, 0.18);
      border-color: #86efac;
    }

    .global-card.mastered-global .card-title {
      color: #14532d;
      border-bottom-color: #bbf7d0;
    }

    .global-card.mastered-global .card-content {
      color: #166534;
    }

    .global-card .card-group-tag {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.6rem;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 1px 6px;
      border-radius: 10px;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-card.mastered-global .card-group-tag {
      background: #bbf7d0;
      color: #166534;
    }

    .global-card .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #eef2ff;
      color: #0f172a;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-shrink: 0;
      min-height: 2.7em;
      max-height: 2.7em;
      padding-right: 40px;
    }

    .global-card .card-content {
      font-size: 0.8rem;
      line-height: 1.5;
      color: #475569;
      overflow: hidden;
      flex: 1;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .mastered-corner {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.75rem;
      color: #16a34a;
      font-weight: 700;
    }

    .edit-card {
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.08);
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      font-size: 1rem;
      font-family: inherit;
      background: #fafcff;
      transition: all 0.15s;
      outline: none;
      resize: vertical;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .input-group textarea {
      min-height: 180px;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1 0 auto;
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background: #1e3a8a;
      color: white;
      border: none;
      box-shadow: 0 6px 14px rgba(30, 58, 138, 0.25);
    }

    .btn-primary:hover {
      background: #1e40af;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      width: 100%;
    }

    .empty-state p {
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    /* ========== 模态框 ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
      backdrop-filter: blur(3px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid #eef2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }

    .modal-close:hover {
      background: #f1f5f9;
      color: #334155;
    }

    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .modal-textarea {
      width: 100%;
      min-height: 200px;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      font-size: 0.82rem;
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      line-height: 1.55;
      background: #f8fafc;
      color: #1e293b;
      resize: vertical;
      outline: none;
      word-break: break-all;
    }

    .modal-textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .modal-footer {
      padding: 16px 22px;
      border-top: 1px solid #eef2f6;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .modal-footer .btn {
      flex: 1 0 auto;
      padding: 11px 18px;
      font-size: 0.9rem;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #16a34a;
      font-weight: 600;
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    .status-msg.error {
      color: #dc2626;
    }

    .file-drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafcff;
      margin-bottom: 14px;
    }

    .file-drop-zone:hover,
    .file-drop-zone.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .file-drop-zone .file-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
    }

    .file-drop-zone .file-text {
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
    }

    .file-drop-zone .file-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 0.78rem;
      margin: 14px 0;
      font-weight: 600;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-box {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      animation: modalIn 0.2s ease;
    }

    .confirm-box h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      text-align: center;
    }

    .confirm-box p {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: center;
      white-space: pre-line;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    .confirm-actions .btn {
      flex: 1;
      padding: 11px;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .app-header {
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        padding: 10px 12px 8px;
      }

      .app-header h1 {
        font-size: 1.15rem;
        text-align: center;
      }

      .header-right {
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }

      .mode-toggle {
        justify-content: center;
        width: 100%;
      }

      .mode-btn {
        flex: 1;
        text-align: center;
        padding: 8px 8px;
        font-size: 0.8rem;
      }

      /* 移动端：数据按钮组在录入模式时显示在模式切换下方 */
      .data-btn-group {
        justify-content: center;
        width: 100%;
      }

      .data-btn-group.show {
        display: flex;
      }

      .data-btn {
        flex: 1;
        text-align: center;
        padding: 8px;
        font-size: 0.8rem;
      }

      .sidebar {
        width: 130px;
      }

      .sidebar-header {
        padding: 12px 8px 4px;
        font-size: 0.65rem;
      }

      .group-header {
        font-size: 0.7rem;
        padding: 6px 8px;
      }

      .knowledge-item {
        padding: 10px 8px;
        font-size: 0.8rem;
        border-radius: 10px;
      }

      .group-items .knowledge-item {
        font-size: 0.78rem;
        padding: 9px 8px;
      }

      .item-actions {
        opacity: 1;
      }

      .delete-btn {
        width: 24px;
        height: 24px;
        font-size: 0.85rem;
      }

      .content-area {
        padding: 12px 10px 24px;
      }

      .content-area.full-width {
        padding: 10px 10px 24px;
      }

      .knowledge-card,
      .edit-card {
        padding: 18px 16px;
        border-radius: 22px;
      }

      .card-title {
        font-size: 1.3rem;
        margin-bottom: 12px;
      }

      .card-content {
        font-size: 1rem;
        line-height: 1.65;
      }

      .master-btn {
        padding: 12px 20px;
        font-size: 0.95rem;
      }

      .global-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .global-card {
        padding: 12px 12px;
        border-radius: 14px;
        height: 120px;
      }

      .global-card .card-title {
        font-size: 0.85rem;
        margin-bottom: 6px;
        padding-bottom: 5px;
        min-height: 2.7em;
        max-height: 2.7em;
        padding-right: 34px;
      }

      .global-card .card-group-tag {
        font-size: 0.55rem;
        padding: 1px 5px;
        max-width: 60px;
      }

      .global-card .card-content {
        font-size: 0.72rem;
        line-height: 1.45;
        -webkit-line-clamp: 3;
      }

      .btn {
        padding: 10px 16px;
        font-size: 0.9rem;
      }

      .input-group textarea {
        min-height: 140px;
      }

      .modal {
        max-height: 92vh;
      }

      .modal-textarea {
        min-height: 150px;
      }
    }

    @media (max-width: 380px) {
      .sidebar {
        width: 110px;
      }
      .knowledge-item {
        font-size: 0.75rem;
        padding: 8px 6px;
      }
      .mode-btn {
        font-size: 0.7rem;
        padding: 6px 4px;
      }
      .global-grid {
        gap: 8px;
      }
      .global-card {
        padding: 10px 10px;
        height: 110px;
      }
      .global-card .card-title {
        font-size: 0.78rem;
      }
      .global-card .card-content {
        font-size: 0.68rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    .hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 16px;
      text-align: center;
      border-top: 1px dashed #e2e8f0;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>📚 知识点卡片</h1>
    <div class="header-right">
      <!-- 数据按钮组：只在录入模式显示 -->
      <div class="data-btn-group" id="dataBtnGroup">
        <button class="data-btn" id="exportBtn">📤 导出</button>
        <button class="data-btn" id="importBtn">📥 导入</button>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn" data-mode="global" id="globalModeBtn">全局模式</button>
        <button class="mode-btn active" data-mode="recite" id="reciteModeBtn">背诵模式</button>
        <button class="mode-btn" data-mode="edit" id="editModeBtn">录入模式</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>知识点目录</span>
        <span id="counterBadge">0</span>
      </div>
      <div class="knowledge-list" id="knowledgeList">
        <!-- 动态渲染列表 -->
      </div>
    </aside>

    <main class="content-area" id="contentArea">
      <!-- 根据模式渲染 -->
    </main>
  </div>

  <!-- 导出模态框 -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📤 导出知识点数据</h3>
        <button class="modal-close" id="exportModalClose">✕</button>
      </div>
      <div class="modal-body">
        <p>以下是当前所有知识点数据。点击“复制到剪贴板”后，可粘贴保存到记事本或发送到其他设备，用于备份或跨设备同步。</p>
        <textarea class="modal-textarea" id="exportTextarea" readonly></textarea>
        <div class="status-msg" id="exportStatus"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="copyExportBtn">📋 复制到剪贴板</button>
        <button class="btn btn-secondary" id="downloadExportBtn">💾 下载为文件</button>
        <button class="btn btn-secondary" id="exportCancelBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 导入模态框 -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📥 导入知识点数据</h3>
        <button class="modal-close" id="importModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="file-drop-zone" id="fileDropZone">
          <span class="file-icon">📁</span>
          <span class="file-text">点击选择文件，或将文件拖到这里</span>
          <div class="file-hint">支持 .json 文件（之前导出的备份文件）</div>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json" style="display: none;">

        <div class="divider-text">或者手动粘贴</div>

        <p>将之前导出的 JSON 数据粘贴到下方输入框中，点击“确认导入”即可恢复知识点。注意：导入会覆盖当前所有知识点。</p>
        <textarea class="modal-textarea" id="importTextarea" placeholder='粘贴 JSON 数据，例如：&#10;[&#10;  {&#10;    "id": "1",&#10;    "title": "示例",&#10;    "content": "内容",&#10;    "group": "分组",&#10;    "mastered": false&#10;  }&#10;]'></textarea>
        <div class="status-msg" id="importStatus"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="doImportBtn">✅ 确认导入</button>
        <button class="btn btn-secondary" id="importCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- 自定义确认对话框 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h4 id="confirmTitle">确认操作</h4>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancel">取消</button>
        <button class="btn btn-primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const DEFAULT_ITEMS = [
        { id: '1', title: 'HTML 语义化', content: '使用恰当的 HTML 标签来构建页面结构，例如 header、nav、main、article、section、aside、footer。语义化有助于 SEO、可访问性和代码可读性。', group: '前端基础', mastered: false },
        { id: '2', title: 'CSS 盒模型', content: '每个元素都是一个盒子。由内容(content)、内边距(padding)、边框(border)、外边距(margin)组成。box-sizing: border-box 使 width 包含 padding 和 border。', group: '前端基础', mastered: false },
        { id: '3', title: 'JavaScript 闭包', content: '闭包是指函数能够记住并访问它的词法作用域，即使函数在其词法作用域之外执行。常用于创建私有变量和回调函数。', group: '前端基础', mastered: false },
        { id: '4', title: 'HTTP 状态码', content: '1xx 信息，2xx 成功，3xx 重定向，4xx 客户端错误，5xx 服务端错误。常见：200 OK，301 永久重定向，404 未找到，500 服务器内部错误。', group: '网络基础', mastered: false },
        { id: '5', title: 'Flex 布局', content: 'display: flex 创建弹性容器。justify-content 主轴对齐，align-items 交叉轴对齐，flex-direction 方向。flex: 1 占满剩余空间。', group: '前端基础', mastered: false },
        { id: '6', title: 'Vue 响应式原理', content: 'Vue2 使用 Object.defineProperty 劫持数据，Vue3 使用 Proxy。当数据变化时触发依赖更新，重新渲染视图。', group: '框架', mastered: false }
      ];

      let knowledgeItems = loadFromStorage();
      let activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
      let currentMode = 'recite';
      let isCreatingNew = false;

      let collapsedGroups = loadCollapsedState();

      const knowledgeListEl = document.getElementById('knowledgeList');
      const contentArea = document.getElementById('contentArea');
      const globalModeBtn = document.getElementById('globalModeBtn');
      const reciteModeBtn = document.getElementById('reciteModeBtn');
      const editModeBtn = document.getElementById('editModeBtn');
      const counterBadge = document.getElementById('counterBadge');
      const sidebar = document.getElementById('sidebar');
      const dataBtnGroup = document.getElementById('dataBtnGroup');

      const exportModal = document.getElementById('exportModal');
      const exportTextarea = document.getElementById('exportTextarea');
      const exportStatus = document.getElementById('exportStatus');
      const importModal = document.getElementById('importModal');
      const importTextarea = document.getElementById('importTextarea');
      const importStatus = document.getElementById('importStatus');
      const fileDropZone = document.getElementById('fileDropZone');
      const fileInput = document.getElementById('fileInput');

      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmTitle = document.getElementById('confirmTitle');
      const confirmMessage = document.getElementById('confirmMessage');
      const confirmOk = document.getElementById('confirmOk');
      const confirmCancel = document.getElementById('confirmCancel');

      let confirmCallback = null;

      // ---------- 自定义确认对话框 ----------
      function showConfirm(title, message, onConfirm) {
        confirmTitle.textContent = title;
        confirmMessage.textContent = message;
        confirmCallback = onConfirm;
        confirmOverlay.classList.add('show');
      }

      function closeConfirm() {
        confirmOverlay.classList.remove('show');
        confirmCallback = null;
      }

      confirmOk.addEventListener('click', () => {
        const cb = confirmCallback;
        closeConfirm();
        if (cb) cb();
      });

      confirmCancel.addEventListener('click', closeConfirm);
      confirmOverlay.addEventListener('click', (e) => {
        if (e.target === confirmOverlay) closeConfirm();
      });

      // ---------- 工具函数 ----------
      function loadFromStorage() {
        try {
          const stored = localStorage.getItem('knowledge_card_items');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.filter(item => item && item.title !== undefined).map(item => ({
                id: item.id || generateId(),
                title: item.title || '无标题',
                content: item.content || '',
                group: item.group || '',
                mastered: item.mastered === true
              }));
            }
          }
        } catch (e) {
          console.warn('读取localStorage失败', e);
        }
        return DEFAULT_ITEMS.map(item => ({ ...item }));
      }

      function loadCollapsedState() {
        try {
          const stored = localStorage.getItem('knowledge_collapsed_groups');
          return stored ? JSON.parse(stored) : {};
        } catch (e) {
          return {};
        }
      }

      function saveCollapsedState() {
        try {
          localStorage.setItem('knowledge_collapsed_groups', JSON.stringify(collapsedGroups));
        } catch (e) {}
      }

      function saveToStorage() {
        try {
          localStorage.setItem('knowledge_card_items', JSON.stringify(knowledgeItems));
        } catch (e) {
          console.warn('保存localStorage失败', e);
        }
      }

      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 9);
      }

      function updateCounter() {
        counterBadge.textContent = knowledgeItems.length;
      }

      function getActiveItem() {
        return knowledgeItems.find(item => item.id === activeId) || null;
      }

      function validateActiveId() {
        if (isCreatingNew) return;
        if (!knowledgeItems.some(item => item.id === activeId)) {
          activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
        }
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function getAllGroups() {
        const groups = new Set();
        knowledgeItems.forEach(item => {
          if (item.group && item.group.trim()) {
            groups.add(item.group.trim());
          }
        });
        return Array.from(groups).sort();
      }

      function toggleMastered(id) {
        const item = knowledgeItems.find(i => i.id === id);
        if (!item) return;
        item.mastered = !item.mastered;
        saveToStorage();
        renderSidebar();
        renderContent();
      }

      // ---------- 导出 / 导入 ----------
      function openExportModal() {
        const data = JSON.stringify(knowledgeItems, null, 2);
        exportTextarea.value = data;
        exportStatus.textContent = '';
        exportStatus.className = 'status-msg';
        exportModal.classList.add('show');
      }

      function closeExportModal() {
        exportModal.classList.remove('show');
      }

      function openImportModal() {
        importTextarea.value = '';
        importStatus.textContent = '';
        importStatus.className = 'status-msg';
        importModal.classList.add('show');
      }

      function closeImportModal() {
        importModal.classList.remove('show');
      }

      async function copyExportData() {
        try {
          await navigator.clipboard.writeText(exportTextarea.value);
          exportStatus.textContent = '✓ 已复制到剪贴板！';
          exportStatus.className = 'status-msg';
        } catch (err) {
          exportTextarea.select();
          exportTextarea.setSelectionRange(0, 99999);
          try {
            const ok = document.execCommand('copy');
            if (ok) {
              exportStatus.textContent = '✓ 已复制到剪贴板！';
              exportStatus.className = 'status-msg';
            } else {
              exportStatus.textContent = '复制失败，请手动全选复制';
              exportStatus.className = 'status-msg error';
            }
          } catch (e2) {
            exportStatus.textContent = '复制失败，请手动全选复制';
            exportStatus.className = 'status-msg error';
          }
        }
      }

      function downloadExportData() {
        try {
          const blob = new Blob([exportTextarea.value], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const date = new Date();
          const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
          a.href = url;
          a.download = `知识点备份_${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          exportStatus.textContent = '✓ 文件已开始下载';
          exportStatus.className = 'status-msg';
        } catch (e) {
          exportStatus.textContent = '下载失败，请尝试复制到剪贴板';
          exportStatus.className = 'status-msg error';
        }
      }

      function parseAndImport(rawText, onSuccess) {
        if (!rawText || !rawText.trim()) {
          importStatus.textContent = '❌ 没有可导入的数据';
          importStatus.className = 'status-msg error';
          return;
        }

        let parsed;
        try {
          parsed = JSON.parse(rawText);
        } catch (e) {
          importStatus.textContent = '❌ JSON 格式错误，请检查数据';
          importStatus.className = 'status-msg error';
          return;
        }

        if (!Array.isArray(parsed)) {
          importStatus.textContent = '❌ 数据格式错误，应为数组';
          importStatus.className = 'status-msg error';
          return;
        }

        const cleaned = parsed
          .filter(item => item && typeof item === 'object' && item.title !== undefined)
          .map(item => ({
            id: item.id || generateId(),
            title: String(item.title || '无标题'),
            content: String(item.content || ''),
            group: String(item.group || ''),
            mastered: item.mastered === true
          }));

        if (cleaned.length === 0) {
          importStatus.textContent = '❌ 没有有效的知识点数据';
          importStatus.className = 'status-msg error';
          return;
        }

        showConfirm(
          '确认导入',
          `即将导入 ${cleaned.length} 个知识点，\n当前 ${knowledgeItems.length} 个知识点将被覆盖。\n\n确定继续吗？`,
          () => {
            knowledgeItems = cleaned;
            activeId = knowledgeItems[0].id;
            isCreatingNew = false;
            saveToStorage();
            renderSidebar();
            renderContent();

            importStatus.textContent = `✓ 成功导入 ${cleaned.length} 个知识点！`;
            importStatus.className = 'status-msg';

            setTimeout(() => {
              closeImportModal();
            }, 1200);

            if (onSuccess) onSuccess();
          }
        );
      }

      function doImport() {
        parseAndImport(importTextarea.value);
      }

      function handleFileSelect(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.json') && file.type !== 'application/json') {
          importStatus.textContent = '❌ 请选择 .json 格式的文件';
          importStatus.className = 'status-msg error';
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          importTextarea.value = text;
          importStatus.textContent = `📄 已加载文件：${file.name}`;
          importStatus.className = 'status-msg';
          parseAndImport(text);
        };
        reader.onerror = () => {
          importStatus.textContent = '❌ 文件读取失败，请重试';
          importStatus.className = 'status-msg error';
        };
        reader.readAsText(file);
      }

      fileDropZone.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        handleFileSelect(file);
        fileInput.value = '';
      });

      fileDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileDropZone.classList.add('dragover');
      });

      fileDropZone.addEventListener('dragleave', () => {
        fileDropZone.classList.remove('dragover');
      });

      fileDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        fileDropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        handleFileSelect(file);
      });

      // ---------- 渲染侧边栏 ----------
      function renderSidebar() {
        if (knowledgeItems.length === 0) {
          knowledgeListEl.innerHTML = `<div class="empty-list-msg">暂无知识点<br>点击“录入模式”添加</div>`;
          updateCounter();
          return;
        }

        const groups = getAllGroups();
        const ungroupedItems = knowledgeItems.filter(item => !item.group || !item.group.trim());
        let html = '';

        groups.forEach(groupName => {
          const groupItems = knowledgeItems.filter(item => item.group && item.group.trim() === groupName);
          const isCollapsed = collapsedGroups[groupName] === true;

          html += `
            <div class="group-section ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(groupName)}">
              <div class="group-header" data-group-toggle="${escapeHtml(groupName)}">
                <span class="group-arrow">▼</span>
                <span class="group-name">${escapeHtml(groupName)}</span>
                <span class="group-count">${groupItems.length}</span>
                <div class="group-actions">
                  <button class="group-action-btn delete-group" data-group-delete="${escapeHtml(groupName)}" title="删除该组（知识点将变为未分组）">✕</button>
                </div>
              </div>
              <div class="group-items">
                ${groupItems.map(item => renderKnowledgeItem(item)).join('')}
              </div>
            </div>
          `;
        });

        if (ungroupedItems.length > 0) {
          if (groups.length > 0) {
            html += `<div class="ungrouped-label">未分组</div>`;
          }
          html += ungroupedItems.map(item => renderKnowledgeItem(item)).join('');
        }

        knowledgeListEl.innerHTML = html;
        updateCounter();

        document.querySelectorAll('.group-header').forEach(header => {
          header.addEventListener('click', (e) => {
            if (e.target.closest('.delete-group')) return;
            const groupName = header.dataset.groupToggle;
            if (!groupName) return;
            collapsedGroups[groupName] = !collapsedGroups[groupName];
            saveCollapsedState();
            const section = header.closest('.group-section');
            if (section) {
              section.classList.toggle('collapsed', collapsedGroups[groupName]);
            }
          });
        });

        document.querySelectorAll('.delete-group').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const groupName = btn.dataset.groupDelete;
            deleteGroup(groupName);
          });
        });

        document.querySelectorAll('.knowledge-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.delete-btn')) return;
            const id = el.dataset.id;
            if (id && (id !== activeId || isCreatingNew)) {
              activeId = id;
              isCreatingNew = false;
              if (currentMode === 'global') {
                setMode('recite');
              } else {
                renderSidebar();
                renderContent();
              }
            } else if (id === activeId && currentMode === 'global') {
              setMode('recite');
            }
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            deleteKnowledgeItem(id);
          });
        });
      }

      function renderKnowledgeItem(item) {
        const isActive = item.id === activeId && !isCreatingNew;
        const displayTitle = item.title.length > 20 ? item.title.slice(0, 18) + '…' : item.title;
        const masteredClass = item.mastered ? 'mastered' : '';
        const masteredBadge = item.mastered ? '<span class="mastered-badge">✓</span>' : '';
        return `
          <div class="knowledge-item ${isActive ? 'active' : ''} ${masteredClass}" data-id="${item.id}">
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${masteredBadge}${escapeHtml(displayTitle)}</span>
            <div class="item-actions">
              <button class="delete-btn" data-id="${item.id}" title="删除知识点">✕</button>
            </div>
          </div>
        `;
      }

      function deleteGroup(groupName) {
        const count = knowledgeItems.filter(item => item.group === groupName).length;
        showConfirm(
          '删除分组',
          `确定要删除分组「${groupName}」吗？\n组内 ${count} 个知识点将变为未分组状态。`,
          () => {
            knowledgeItems.forEach(item => {
              if (item.group === groupName) {
                item.group = '';
              }
            });
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        );
      }

      function deleteKnowledgeItem(id) {
        const index = knowledgeItems.findIndex(item => item.id === id);
        if (index === -1) return;

        showConfirm(
          '删除知识点',
          `确定要删除知识点「${knowledgeItems[index].title}」吗？`,
          () => {
            knowledgeItems.splice(index, 1);
            if (activeId === id) {
              activeId = knowledgeItems.length > 0 ? knowledgeItems[0].id : null;
              isCreatingNew = false;
            }
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        );
      }

      // ---------- 渲染内容区 ----------
      function renderContent() {
        validateActiveId();

        // 全局模式：隐藏侧边栏，内容区满铺
        if (currentMode === 'global') {
          sidebar.classList.add('hidden-sidebar');
          contentArea.classList.add('full-width');
        } else {
          sidebar.classList.remove('hidden-sidebar');
          contentArea.classList.remove('full-width');
        }

        // 数据按钮组：只在录入模式显示
        if (currentMode === 'edit') {
          dataBtnGroup.classList.add('show');
        } else {
          dataBtnGroup.classList.remove('show');
        }

        if (currentMode === 'global') {
          renderGlobalMode();
        } else if (currentMode === 'recite') {
          renderReciteMode();
        } else {
          renderEditMode();
        }
        updateSidebarAddButton();
      }

      function renderGlobalMode() {
        if (knowledgeItems.length === 0) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const sortedItems = [
          ...knowledgeItems.filter(item => !item.mastered),
          ...knowledgeItems.filter(item => item.mastered)
        ];

        let cardsHtml = '';
        sortedItems.forEach(item => {
          const groupTag = item.group && item.group.trim()
            ? `<span class="card-group-tag" title="${escapeHtml(item.group)}">${escapeHtml(item.group)}</span>`
            : '';
          const masteredClass = item.mastered ? 'mastered-global' : '';
          const masteredCorner = item.mastered ? '<span class="mastered-corner">✓ 已掌握</span>' : '';
          cardsHtml += `
            <div class="global-card ${masteredClass}" data-id="${item.id}" draggable="false">
              ${groupTag}
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-content">${escapeHtml(item.content) || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
              ${masteredCorner}
              <span class="drag-handle">⠿</span>
            </div>
          `;
        });

        contentArea.innerHTML = `
          <div class="global-grid" id="globalGrid">
            ${cardsHtml}
          </div>
        `;

        initDragSort();
      }

      // ---------- 拖拽排序 ----------
      function initDragSort() {
        const grid = document.getElementById('globalGrid');
        if (!grid) return;

        let draggedElement = null;
        let placeholder = null;
        let startX = 0, startY = 0;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;

        const cards = Array.from(grid.querySelectorAll('.global-card'));

        cards.forEach(card => {
          card.addEventListener('click', (e) => {
            if (isDragging || card.dataset.dragMoved === 'true') return;
            const id = card.dataset.id;
            if (id) {
              activeId = id;
              isCreatingNew = false;
              setMode('recite');
            }
          });

          card.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            startDrag(e.clientX, e.clientY, card);
          });

          card.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startDrag(touch.clientX, touch.clientY, card);
          }, { passive: true });
        });

        function startDrag(clientX, clientY, card) {
          startX = clientX;
          startY = clientY;
          isDragging = false;
          card.dataset.dragMoved = 'false';

          const rect = card.getBoundingClientRect();
          dragOffsetX = clientX - rect.left;
          dragOffsetY = clientY - rect.top;

          const onMouseMove = (moveEvent) => {
            const moveX = moveEvent.clientX !== undefined ? moveEvent.clientX : moveEvent.touches[0].clientX;
            const moveY = moveEvent.clientY !== undefined ? moveEvent.clientY : moveEvent.touches[0].clientY;

            const deltaX = Math.abs(moveX - startX);
            const deltaY = Math.abs(moveY - startY);

            if (!isDragging && (deltaX > 5 || deltaY > 5)) {
              isDragging = true;
              beginDrag(card, moveX, moveY);
            }

            if (isDragging) {
              moveEvent.preventDefault();
              updateDragPosition(moveX, moveY);
              handleDragOver(moveX, moveY);
            }
          };

          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.removeEventListener('touchmove', onMouseMove);
            document.removeEventListener('touchend', onMouseUp);

            if (isDragging) {
              endDrag();
            }
            setTimeout(() => {
              if (card) card.dataset.dragMoved = 'false';
            }, 50);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
          document.addEventListener('touchmove', onMouseMove, { passive: false });
          document.addEventListener('touchend', onMouseUp);
        }

        function beginDrag(card, clientX, clientY) {
          draggedElement = card;
          card.classList.add('dragging');
          card.dataset.dragMoved = 'true';

          placeholder = document.createElement('div');
          placeholder.className = 'global-card';
          placeholder.style.visibility = 'hidden';
          placeholder.style.height = card.offsetHeight + 'px';
          placeholder.style.width = card.offsetWidth + 'px';
          placeholder.style.pointerEvents = 'none';
          placeholder.dataset.placeholder = 'true';

          const rect = card.getBoundingClientRect();
          card.style.position = 'fixed';
          card.style.left = rect.left + 'px';
          card.style.top = rect.top + 'px';
          card.style.width = rect.width + 'px';
          card.style.height = rect.height + 'px';
          card.style.zIndex = '1000';
          card.style.pointerEvents = 'none';

          card.parentNode.insertBefore(placeholder, card);
        }

        function updateDragPosition(clientX, clientY) {
          if (!draggedElement) return;
          const newLeft = clientX - dragOffsetX;
          const newTop = clientY - dragOffsetY;
          draggedElement.style.left = newLeft + 'px';
          draggedElement.style.top = newTop + 'px';
        }

        function handleDragOver(clientX, clientY) {
          if (!draggedElement || !placeholder) return;

          const elemBelow = document.elementFromPoint(clientX, clientY);
          if (!elemBelow) return;

          const targetCard = elemBelow.closest('.global-card');
          if (!targetCard || targetCard === draggedElement || targetCard === placeholder) return;

          const targetRect = targetCard.getBoundingClientRect();
          const targetMiddleX = targetRect.left + targetRect.width / 2;
          const targetMiddleY = targetRect.top + targetRect.height / 2;

          const insertBefore = (clientY < targetMiddleY) || (Math.abs(clientY - targetMiddleY) < targetRect.height / 2 && clientX < targetMiddleX);

          if (insertBefore) {
            grid.insertBefore(placeholder, targetCard);
          } else {
            if (targetCard.nextSibling) {
              grid.insertBefore(placeholder, targetCard.nextSibling);
            } else {
              grid.appendChild(placeholder);
            }
          }
        }

        function endDrag() {
          if (!draggedElement || !placeholder) return;

          placeholder.parentNode.insertBefore(draggedElement, placeholder);
          placeholder.remove();

          draggedElement.classList.remove('dragging');
          draggedElement.style.position = '';
          draggedElement.style.left = '';
          draggedElement.style.top = '';
          draggedElement.style.width = '';
          draggedElement.style.height = '';
          draggedElement.style.zIndex = '';
          draggedElement.style.pointerEvents = '';

          updateDataOrder();

          draggedElement = null;
          placeholder = null;
          isDragging = false;
        }

        function updateDataOrder() {
          const currentCards = Array.from(grid.querySelectorAll('.global-card'));
          const newOrderIds = currentCards.map(card => card.dataset.id);
          const newOrderedItems = [];
          newOrderIds.forEach(id => {
            const item = knowledgeItems.find(i => i.id === id);
            if (item) newOrderedItems.push(item);
          });

          if (newOrderedItems.length === knowledgeItems.length) {
            knowledgeItems = newOrderedItems;
            saveToStorage();
            renderSidebar();
          }
        }
      }

      // 背诵模式
      function renderReciteMode() {
        const activeItem = getActiveItem();
        if (!activeItem) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="empty-state">
                <p>✨ 还没有知识点</p>
                <p style="font-size:0.95rem;">切换到「录入模式」添加你的第一个知识点吧</p>
              </div>
            </div>
          `;
          return;
        }

        const groupTag = activeItem.group && activeItem.group.trim()
          ? `<div style="font-size:0.75rem;color:#64748b;background:#f1f5f9;display:inline-block;padding:3px 12px;border-radius:20px;margin-bottom:12px;">📁 ${escapeHtml(activeItem.group)}</div>`
          : '';

        const cardClass = activeItem.mastered ? 'mastered-card' : '';
        const masterBtnClass = activeItem.mastered ? 'master-btn unmaster-btn' : 'master-btn';
        const masterBtnText = activeItem.mastered ? '↩️ 取消已掌握' : '✓ 已掌握';

        contentArea.innerHTML = `
          <div class="card-wrapper">
            <div class="knowledge-card ${cardClass}">
              ${groupTag}
              <div class="card-title">${escapeHtml(activeItem.title)}</div>
              <div class="card-content">${escapeHtml(activeItem.content) || '<span style="color:#94a3b8;font-style:italic;">暂无内容</span>'}</div>
            </div>
            <div class="recite-actions">
              <button class="${masterBtnClass}" id="masterBtn">${masterBtnText}</button>
            </div>
          </div>
        `;

        document.getElementById('masterBtn').addEventListener('click', () => {
          toggleMastered(activeItem.id);
        });
      }

      // 录入模式
      function renderEditMode() {
        const activeItem = getActiveItem();

        if (isCreatingNew || !activeItem) {
          contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="edit-card">
                <div class="input-group">
                  <label>📌 标题</label>
                  <input type="text" id="newTitleInput" placeholder="例如：HTTP 状态码" value="">
                </div>
                <div class="input-group">
                  <label>📁 上级目录（可选）</label>
                  <input type="text" id="newGroupInput" list="newGroupList" placeholder="输入分组名称，如：前端基础" value="">
                  <datalist id="newGroupList">
                    ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                  </datalist>
                </div>
                <div class="input-group">
                  <label>📝 内容</label>
                  <textarea id="newContentInput" placeholder="在此输入知识点详细内容..."></textarea>
                </div>
                <div class="button-group">
                  <button class="btn btn-primary" id="addNewBtn">➕ 添加知识点</button>
                  <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
                </div>
                <div class="hint">💡 输入新的分组名称会自动创建新分组</div>
              </div>
            </div>
          `;

          document.getElementById('addNewBtn').addEventListener('click', () => {
            const titleInput = document.getElementById('newTitleInput');
            const groupInput = document.getElementById('newGroupInput');
            const contentInput = document.getElementById('newContentInput');
            const title = titleInput.value.trim();
            const group = groupInput.value.trim();
            const content = contentInput.value.trim();
            if (!title) {
              alert('请输入标题');
              return;
            }
            const newItem = {
              id: generateId(),
              title: title,
              content: content,
              group: group,
              mastered: false
            };
            knowledgeItems.push(newItem);
            activeId = newItem.id;
            isCreatingNew = false;
            saveToStorage();
            renderSidebar();
            renderContent();
          });

          document.getElementById('cancelAddBtn').addEventListener('click', () => {
            isCreatingNew = false;
            if (knowledgeItems.length > 0) {
              activeId = knowledgeItems[0].id;
            } else {
              activeId = null;
            }
            renderSidebar();
            renderContent();
          });
          return;
        }

        contentArea.innerHTML = `
          <div class="card-wrapper">
            <div class="edit-card">
              <div class="input-group">
                <label>✏️ 标题</label>
                <input type="text" id="editTitleInput" value="${escapeHtml(activeItem.title)}" placeholder="知识点标题">
              </div>
              <div class="input-group">
                <label>📁 上级目录（可选）</label>
                <input type="text" id="editGroupInput" list="editGroupList" value="${escapeHtml(activeItem.group || '')}" placeholder="输入分组名称，留空为无分组">
                <datalist id="editGroupList">
                  ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                </datalist>
              </div>
              <div class="input-group">
                <label>📄 内容</label>
                <textarea id="editContentInput" placeholder="知识点内容">${escapeHtml(activeItem.content)}</textarea>
              </div>
              <div class="button-group">
                <button class="btn btn-primary" id="saveEditBtn">💾 保存修改</button>
                <button class="btn btn-secondary" id="cancelEditBtn">↩️ 取消</button>
              </div>
              <div class="hint">当前编辑: ${escapeHtml(activeItem.title)}</div>
            </div>
          </div>
        `;

        document.getElementById('saveEditBtn').addEventListener('click', () => {
          const newTitle = document.getElementById('editTitleInput').value.trim();
          const newGroup = document.getElementById('editGroupInput').value.trim();
          const newContent = document.getElementById('editContentInput').value.trim();
          if (!newTitle) {
            alert('标题不能为空');
            return;
          }
          const item = getActiveItem();
          if (item) {
            item.title = newTitle;
            item.group = newGroup;
            item.content = newContent;
            saveToStorage();
            renderSidebar();
            renderContent();
          }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
          renderContent();
        });
      }

      function updateSidebarAddButton() {
        const oldBtn = document.getElementById('sidebarAddBtn');
        if (oldBtn) oldBtn.remove();

        if (currentMode !== 'edit') return;

        const addBtn = document.createElement('button');
        addBtn.id = 'sidebarAddBtn';
        addBtn.className = 'btn btn-secondary';
        addBtn.style.margin = '10px 12px 16px';
        addBtn.style.padding = '10px';
        addBtn.style.fontSize = '0.9rem';
        addBtn.style.borderRadius = '40px';
        addBtn.style.width = 'calc(100% - 24px)';
        addBtn.style.flexShrink = '0';
        addBtn.style.backgroundColor = '#f8fafc';
        addBtn.innerHTML = '➕ 新建知识点';
        addBtn.addEventListener('click', () => {
          isCreatingNew = true;
          renderSidebar();
          renderContent();
        });
        sidebar.appendChild(addBtn);
      }

      function setMode(mode) {
        if (mode === currentMode) {
          renderContent();
          return;
        }
        currentMode = mode;
        if (mode !== 'edit') {
          isCreatingNew = false;
        }

        [globalModeBtn, reciteModeBtn, editModeBtn].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });

        validateActiveId();

        if (mode !== 'global') {
          renderSidebar();
        }
        renderContent();
      }

      // ---------- 事件绑定 ----------
      globalModeBtn.addEventListener('click', () => setMode('global'));
      reciteModeBtn.addEventListener('click', () => setMode('recite'));
      editModeBtn.addEventListener('click', () => setMode('edit'));

      document.getElementById('exportBtn').addEventListener('click', openExportModal);
      document.getElementById('importBtn').addEventListener('click', openImportModal);

      document.getElementById('exportModalClose').addEventListener('click', closeExportModal);
      document.getElementById('exportCancelBtn').addEventListener('click', closeExportModal);
      document.getElementById('copyExportBtn').addEventListener('click', copyExportData);
      document.getElementById('downloadExportBtn').addEventListener('click', downloadExportData);

      document.getElementById('importModalClose').addEventListener('click', closeImportModal);
      document.getElementById('importCancelBtn').addEventListener('click', closeImportModal);
      document.getElementById('doImportBtn').addEventListener('click', doImport);

      exportModal.addEventListener('click', (e) => {
        if (e.target === exportModal) closeExportModal();
      });
      importModal.addEventListener('click', (e) => {
        if (e.target === importModal) closeImportModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (exportModal.classList.contains('show')) closeExportModal();
          if (importModal.classList.contains('show')) closeImportModal();
          if (confirmOverlay.classList.contains('show')) closeConfirm();
        }
      });

      function init() {
        validateActiveId();
        renderSidebar();
        renderContent();
        saveToStorage();
      }

      init();

    })();
  </script>
</body>
</html>
