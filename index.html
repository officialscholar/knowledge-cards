<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>知识点记忆卡片</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="知识点">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="知识点记忆卡片，支持录入、背诵、全局浏览">

  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e3a8a'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle' fill='white' font-family='system-ui,Apple Color Emoji'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e3a8a'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle' fill='white' font-family='system-ui,Apple Color Emoji'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">

  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E7%9F%A5%E8%AF%86%E7%82%B9%E8%AE%B0%E5%BF%86%E5%8D%A1%E7%89%87%22%2C%22short_name%22%3A%22%E7%9F%A5%E8%AF%86%E7%82%B9%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22scope%22%3A%22.%22%2C%22background_color%22%3A%22%23f4f7fc%22%2C%22theme_color%22%3A%22%231e3a8a%22%2C%22orientation%22%3A%22portrait%22%7D">

  <script>
    (function(){
      try {
        var stored = localStorage.getItem('knowledge_theme_v1');
        var theme = stored || 'auto';
        var isDark = theme === 'dark' ||
          (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      } catch(e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <style>
    /* ============================================================
       主题变量
       ============================================================ */
    :root {
      --bg-page: #f4f7fc;
      --bg-surface: #ffffff;
      --bg-surface-2: #f8fafc;
      --bg-subtle: #f1f5f9;
      --bg-input: #fafcff;
      --bg-hover: #f8fafc;
      --bg-accent: #eff6ff;
      --bg-accent-strong: #eef4ff;
      --bg-green: #f0fdf4;
      --bg-green-strong: #dcfce7;
      --bg-danger: #fee2e2;
      --bg-warning: #fbbf24;
      --bg-mastered-card: linear-gradient(135deg, #f0fdf4, #dcfce7);

      --text: #1e293b;
      --text-strong: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --text-faint-2: #cbd5e1;
      --text-on-primary: #ffffff;
      --text-green: #166534;
      --text-green-strong: #14532d;
      --text-danger: #dc2626;
      --text-warning: #78350f;
      --text-primary-accent: #1e3a8a;
      --text-primary-soft: #475569;

      --border: #e2e8f0;
      --border-light: #eef2f6;
      --border-strong: #cbd5e1;
      --border-green: #bbf7d0;
      --border-accent: #93c5fd;
      --border-faint: #e9eef3;

      --primary: #1e3a8a;
      --primary-bright: #2563eb;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --primary-text: #1e3a8a;
      --primary-gradient: linear-gradient(135deg, #1e3a8a, #2563eb);

      --shadow-sm: 0 2px 6px rgba(0,0,0,0.02);
      --shadow-card: 0 12px 30px rgba(0,20,50,0.08), 0 4px 8px rgba(0,0,0,0.02);
      --shadow-modal: 0 24px 60px rgba(0,0,0,0.25);
      --shadow-elevated: 0 6px 16px rgba(0,20,50,0.08);
      --shadow-btn: 0 6px 14px rgba(30,58,138,0.25);
      --shadow-drag: 0 18px 40px rgba(0,20,50,0.28);

      --overlay: rgba(15,23,42,0.5);
      --card-border-idle: rgba(255,255,255,0.6);
      --card-border-idle-global: rgba(255,255,255,0.8);
    }

    [data-theme="dark"] {
      --bg-page: #0b1220;
      --bg-surface: #1a2334;
      --bg-surface-2: #232e42;
      --bg-subtle: #2c3852;
      --bg-input: #1a2334;
      --bg-hover: #2c3852;
      --bg-accent: #1e3a8a;
      --bg-accent-strong: #1e40af;
      --bg-green: #0f3d2c;
      --bg-green-strong: #14532d;
      --bg-danger: #4c1d24;
      --bg-warning: #b45309;
      --bg-mastered-card: linear-gradient(135deg, #0f3d2c, #14532d);

      --text: #dbe4f0;
      --text-strong: #f1f5f9;
      --text-muted: #98a5b8;
      --text-faint: #6b7a91;
      --text-faint-2: #4a5568;
      --text-on-primary: #ffffff;
      --text-green: #86efac;
      --text-green-strong: #bbf7d0;
      --text-danger: #fca5a5;
      --text-warning: #fef3c7;
      --text-primary-accent: #a5c8ff;
      --text-primary-soft: #b8c2d4;

      --border: #2d3a51;
      --border-light: #232e42;
      --border-strong: #3e4d66;
      --border-green: #14532d;
      --border-accent: #1e40af;
      --border-faint: #2d3a51;

      --primary: #2b4e9e;
      --primary-bright: #3b82f6;
      --primary-hover: #4b8ff7;
      --primary-soft: #1e3a8a;
      --primary-text: #a5c8ff;
      --primary-gradient: linear-gradient(135deg, #3b82f6, #60a5fa);

      --shadow-sm: 0 2px 6px rgba(0,0,0,0.35);
      --shadow-card: 0 12px 30px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
      --shadow-modal: 0 24px 60px rgba(0,0,0,0.7);
      --shadow-elevated: 0 6px 16px rgba(0,0,0,0.5);
      --shadow-btn: 0 6px 14px rgba(59,130,246,0.4);
      --shadow-drag: 0 18px 40px rgba(0,0,0,0.7);

      --overlay: rgba(0,0,0,0.7);
      --card-border-idle: rgba(80,100,140,0.35);
      --card-border-idle-global: rgba(80,100,140,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-page);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.2s ease, color 0.2s ease;
    }

    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }

    input, textarea, select, button { font-size: 16px; }

    /* ============================================================
       顶栏
       ============================================================ */
    .app-header {
      padding: 10px 16px 8px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      gap: 8px;
      transition: background 0.2s, border-color 0.2s;
    }

    .app-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .header-right { display: flex; align-items: center; gap: 6px; }

    .mode-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 40px;
    }

    .mode-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-primary-soft);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: var(--bg-surface);
      color: var(--primary-text);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .theme-toggle-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s, color 0.15s;
    }
    .theme-toggle-btn:hover { background: var(--bg-accent); color: var(--primary-text); }
    .theme-toggle-btn:active { transform: scale(0.94); }

    /* ============================================================
       布局
       ============================================================ */
    .main-container { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 268px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-faint);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
      transition: background 0.2s, border-color 0.2s;
    }
    .sidebar.hidden-sidebar { display: none; }

    .sidebar-header {
      padding: 14px 14px 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    .sidebar-header-right { display: flex; align-items: center; gap: 4px; }

    .sidebar-header .count-badge {
      background: var(--bg-accent);
      color: var(--text-primary-accent);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .sidebar-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .sidebar-icon-btn:hover { background: var(--bg-accent); color: var(--primary-text); }

    /* 新建按钮（侧边栏头部小按钮） */
    .sidebar-icon-btn.add-btn {
      background: var(--primary-soft);
      color: var(--primary-text);
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1;
      padding-bottom: 2px;
    }
    .sidebar-icon-btn.add-btn:hover {
      background: var(--primary);
      color: var(--text-on-primary);
    }

    /* 选择模式头部 */
    .selection-header {
      padding: 10px 12px;
      background: var(--bg-accent);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      font-size: 0.82rem;
      color: var(--primary-text);
      font-weight: 700;
    }
    .selection-header .count {
      background: var(--primary);
      color: var(--text-on-primary);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      margin-left: 6px;
    }
    .selection-header button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary-text);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      transition: background 0.12s;
    }
    .selection-header button:hover { background: var(--bg-surface); }

    .knowledge-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 12px;
      -webkit-overflow-scrolling: touch;
    }

    .selection-bar {
      display: flex;
      gap: 5px;
      padding: 8px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
      flex-shrink: 0;
    }
    .selection-bar button {
      flex: 1;
      padding: 8px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-surface-2);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .selection-bar button .ico { font-size: 0.95rem; }
    .selection-bar button:hover { background: var(--bg-accent); border-color: var(--border-accent); color: var(--primary-text); }
    .selection-bar button.danger:hover { background: var(--bg-danger); border-color: var(--text-danger); color: var(--text-danger); }
    .selection-bar button:disabled { opacity: 0.35; cursor: not-allowed; }

    .group-section { margin-bottom: 8px; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary-soft);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .group-header:hover { background: var(--bg-subtle); }

    .group-header .group-arrow {
      font-size: 0.65rem;
      color: var(--text-faint);
      display: inline-block;
      width: 12px;
      text-align: center;
      transition: transform 0.2s;
    }

    .group-section.collapsed .group-arrow { transform: rotate(-90deg); }
    .group-section.collapsed .group-items { display: none; }

    .group-header .group-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-header .group-count {
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .group-items { padding-left: 6px; }

    .group-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; }
    .group-header:hover .group-actions { opacity: 1; }

    .group-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 0.7rem;
      color: var(--text-faint);
      line-height: 1;
    }
    .group-action-btn.delete-group:hover { background: var(--bg-danger); color: var(--text-danger); }

    .ungrouped-label {
      font-size: 0.68rem;
      color: var(--text-faint);
      padding: 8px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      font-style: italic;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 4px 0;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-size: 0.94rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
      line-height: 1.4;
      gap: 6px;
    }
    .knowledge-item:hover { background: var(--bg-hover); border-color: var(--border-strong); }

    .knowledge-item.active {
      background: var(--bg-accent-strong);
      border-left: 4px solid var(--primary-bright);
      border-radius: 12px 8px 8px 12px;
      font-weight: 600;
      color: var(--text-primary-accent);
    }

    .knowledge-item.mastered { background: var(--bg-green); border-color: var(--border-green); color: var(--text-green); }
    .knowledge-item.mastered.active { background: var(--bg-green-strong); border-left-color: #16a34a; color: var(--text-green-strong); }

    .knowledge-item .item-body {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .knowledge-item .item-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid var(--border-strong);
      background: var(--bg-surface);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: transparent;
      transition: all 0.12s;
      font-weight: 700;
    }
    .knowledge-item.selected .item-checkbox {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--text-on-primary);
    }

    .mastered-badge {
      font-size: 0.65rem;
      color: var(--text-green);
      background: var(--bg-green-strong);
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      margin-right: 2px;
    }

    .group-items .knowledge-item { margin-left: 4px; font-size: 0.9rem; padding: 10px 12px; }

    .item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
    .knowledge-item:hover .item-actions,
    .knowledge-item.active .item-actions { opacity: 1; }

    .delete-btn {
      background: none;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      width: 26px;
      height: 26px;
      line-height: 1;
    }
    .delete-btn:hover { background: var(--bg-danger); color: var(--text-danger); }

    .empty-list-msg {
      color: var(--text-faint);
      font-size: 0.85rem;
      text-align: center;
      padding: 30px 10px;
      font-style: italic;
    }

    /* ============================================================
       内容区
       ============================================================ */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-page);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .content-area.full-width { padding: 0; align-items: stretch; }
    .content-area.recite-full { padding: 0; align-items: stretch; overflow: hidden; }

    .card-wrapper { width: 100%; max-width: 680px; margin: 0 auto; }

    /* ============================================================
       全局模式 搜索/筛选 工具栏（搜索栏与筛选栏同一行）
       ============================================================ */
    .global-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-page);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border-light);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .search-box {
      position: relative;
      flex: 1 1 0;
      min-width: 120px;
      margin-bottom: 0;
    }

    .search-input {
      width: 100%;
      padding: 11px 42px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: 0.92rem;
      background: var(--bg-surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:focus {
      border-color: var(--primary-bright);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
      font-size: 0.9rem;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .search-clear.visible { display: flex; }

  <script>
    (function(){
      'use strict';

      const DB_NAME = 'knowledge_cards_db';
      const DB_VERSION = 1;
      const STORE_IMAGES = 'images';
      const STORAGE_KEY_ITEMS = 'knowledge_card_items_v3';
      const STORAGE_KEY_COLLAPSED = 'knowledge_collapsed_groups_v3';

      const PRESET_TEXT_COLORS = [
        { name: '正红', value: '#D0021B' },

      const DEFAULT_TEXT_COLOR = PRESET_TEXT_COLORS[0].value;

      const DEFAULT_ITEMS = [
        { id: '1', title: 'HTML 语义化', content: '使用恰当的 HTML 标签来构建页面结构，例如 header、nav、main、article、section、aside、footer。语义化有助于 SEO、可访问性和代码可读性。', group: '前端基础', masteryLevel: 0, images: [], tags: ['html', '语义化'] },
        { id: '2', title: 'CSS 盒模型', content: '每个元素都是一个盒子。由内容(content)、内边距(padding)、边框(border)、外边距(margin)组成。box-sizing: border-box 使 width 包含 padding 和 border。', group: '前端基础', masteryLevel: 0, images: [], tags: ['css'] },

        { id: '4', title: 'HTTP 状态码', content: '1xx 信息，2xx 成功，3xx 重定向，4xx 客户端错误，5xx 服务端错误。常见：200 OK，301 永久重定向，404 未找到，500 服务器内部错误。', group: '网络基础', masteryLevel: 0, images: [], tags: ['http'] },

      const state = {

        reciteIndex: 0,
        importMode: 'merge',

        searchQuery: '',
        filterGroup: '',
        filterTag: '',
        filterMastery: '',

        theme: 'auto',

        // 【修复1】编辑脏标记：只有真正输入过才认为有未保存修改
        editDirty: false,
        // 【新增】Word 导出范围
        wordExportScope: 'all'
      };

      const $ = (sel) => document.querySelector(sel);
      const el = {
        knowledgeList: $('#knowledgeList'),
        sidebarHeader: $('#sidebarHeader'),
        selectionBar: $('#selectionBar'),
        contentArea: $('#contentArea'),
        globalModeBtn: $('#globalModeBtn'),
        reciteModeBtn: $('#reciteModeBtn'),
        editModeBtn: $('#editModeBtn'),
        themeToggleBtn: $('#themeToggleBtn'),
        sidebar: $('#sidebar'),
        offlineBanner: $('#offlineBanner'),
        toast: $('#toast'),
        exportModal: $('#exportModal'),
        exportTextarea: $('#exportTextarea'),
        exportStatus: $('#exportStatus'),
        importModal: $('#importModal'),
        importTextarea: $('#importTextarea'),
        importStatus: $('#importStatus'),
        fileDropZone: $('#fileDropZone'),
        fileInput: $('#fileInput'),
        importModeSelector: $('#importModeSelector'),
        confirmOverlay: $('#confirmOverlay'),
        confirmTitle: $('#confirmTitle'),
        confirmMessage: $('#confirmMessage'),
        confirmOk: $('#confirmOk'),
        confirmCancel: $('#confirmCancel'),
        moveGroupModal: $('#moveGroupModal'),
        moveGroupList: $('#moveGroupList'),
        moveGroupCount: $('#moveGroupCount'),
        moveGroupNewInput: $('#moveGroupNewInput')
      };

      // ============================================================
      // 小工具
      // ============================================================
      let toastTimer = null;
      function showToast(msg, isError) {
        el.toast.textContent = msg;
        el.toast.className = 'toast show' + (isError ? ' error' : '');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2400);
      }

      function debounce(fn, ms) {
        let timer;
        return function(...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), ms);
        };
      }

      function clearPendingCardClick() {
        if (state.pendingCardClickTimer) {
          clearTimeout(state.pendingCardClickTimer);
          state.pendingCardClickTimer = null;
        }
      }

      function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function sanitizeId(id) {
        if (typeof id === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(id)) return id;
        return generateId();
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function htmlToPlainText(html) {
        if (!html) return '';
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function hasHtmlTags(str) {
        return /<[a-z][\s\S]*>/i.test(str || '');
      }

      function toHtmlContent(content) {
        if (!content) return '';
        if (hasHtmlTags(content)) return sanitizeHtml(content);
        return escapeHtml(content).replace(/\n/g, '<br>');
      }

      function normalizeTag(t) {
        if (typeof t !== 'string') return '';
        return t.trim().replace(/^#+/, '').slice(0, 20);
      }

      function normalizeTags(tags) {
        if (!Array.isArray(tags)) return [];
        const seen = new Set();
        const out = [];
        for (const t of tags) {
          const n = normalizeTag(t);
          if (!n) continue;
          const key = n.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(n);
          if (out.length >= MAX_TAGS_PER_ITEM) break;
        }
        return out;
      }

      // ============================================================
      // HTML 净化
      // ============================================================
      const ALLOWED_TAGS = new Set(['B', 'STRONG', 'U', 'I', 'EM', 'SPAN', 'BR', 'DIV', 'P', 'MARK', 'FONT']);
      const ALLOWED_ATTRS = {
        'SPAN': ['style'], 'DIV': ['style'], 'P': ['style'],
        'FONT': ['color', 'style'], 'MARK': ['style']
      };
      const ALLOWED_STYLE_PROPS = new Set([
        'font-weight', 'text-decoration', 'color', 'background-color',
        'background', 'font-style'
      ]);

      function sanitizeStyle(style) {
        const result = [];
        String(style).split(';').forEach(decl => {
          const idx = decl.indexOf(':');
          if (idx === -1) return;
          const prop = decl.slice(0, idx).trim().toLowerCase();
          const val = decl.slice(idx + 1).trim();
          if (!ALLOWED_STYLE_PROPS.has(prop)) return;
          if (/expression|javascript:|url\s*\(/i.test(val)) return;
          result.push(`${prop}: ${val}`);
        });
        return result.join('; ');
      }

      function sanitizeHtml(html) {
        if (!html) return '';
        const template = document.createElement('template');
        template.innerHTML = String(html);
        const walker = document.createTreeWalker(
          template.content,
          NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT,
          null
        );
        const toRemove = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeType === Node.COMMENT_NODE) { toRemove.push(node); continue; }
          const tag = node.tagName;
          if (!ALLOWED_TAGS.has(tag)) {
            const frag = document.createDocumentFragment();
            while (node.firstChild) frag.appendChild(node.firstChild);
            node.parentNode.replaceChild(frag, node);
            continue;
          }
          const allowed = ALLOWED_ATTRS[tag] || [];
          Array.from(node.attributes).forEach(attr => {
            if (!allowed.includes(attr.name.toLowerCase())) node.removeAttribute(attr.name);
          });
          if (node.hasAttribute('style')) {
            const safeStyle = sanitizeStyle(node.getAttribute('style'));
            if (safeStyle) node.setAttribute('style', safeStyle);
            else node.removeAttribute('style');
          }
        }
        toRemove.forEach(n => n.parentNode && n.parentNode.removeChild(n));
        return template.innerHTML;
      }

      // ============================================================
      // 主题
      // ============================================================
      function isDarkTheme() {
        return document.documentElement.dataset.theme === 'dark';
      }

      function applyTheme(theme) {
        let resolved;
        if (theme === 'auto') {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          resolved = prefersDark ? 'dark' : 'light';
        } else {
          resolved = theme;
        }
        document.documentElement.dataset.theme = resolved;
        el.themeToggleBtn.textContent = resolved === 'dark' ? '☀️' : '🌙';
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.content = resolved === 'dark' ? '#0b1220' : '#1e3a8a';
      }

      function initTheme() {
        let stored = 'auto';
        try { stored = localStorage.getItem(STORAGE_KEY_THEME) || 'auto'; } catch (e) {}
        state.theme = stored;
        applyTheme(stored);

        if (window.matchMedia) {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          const handler = () => { if (state.theme === 'auto') applyTheme('auto'); };
          if (mq.addEventListener) mq.addEventListener('change', handler);
          else if (mq.addListener) mq.addListener(handler);
        }
      }

      el.themeToggleBtn.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme;
        const next = current === 'dark' ? 'light' : 'dark';
        state.theme = next;
        try { localStorage.setItem(STORAGE_KEY_THEME, next); } catch (e) {}
        applyTheme(next);
        if (state.mode === 'recite') renderReciteMode();
        else if (state.mode === 'global') {
          const body = document.getElementById('globalBody');
          if (body) renderGlobalBody();
        }
      });

      // ============================================================
      // 掌握度颜色（主题感知）
      // ============================================================
      const masteryColorCache = new Map();
      function getMasteryColor(level) {
        level = Math.max(0, Math.min(100, level));
        const key = (isDarkTheme() ? 'd' : 'l') + level;
        if (masteryColorCache.has(key)) return masteryColorCache.get(key);
        const t = level / 100;
        let r, g, b;
        if (isDarkTheme()) {
          r = Math.round(100 + (74 - 100) * t);
          g = Math.round(116 + (222 - 116) * t);
          b = Math.round(139 + (128 - 139) * t);
        } else {
          r = Math.round(148 + (22 - 148) * t);
          g = Math.round(163 + (163 - 163) * t);
          b = Math.round(184 + (74 - 184) * t);
        }
        const color = `rgb(${r}, ${g}, ${b})`;
        masteryColorCache.set(key, color);
        return color;
      }

      function getCardBackground(level) {
        if (isDarkTheme()) {
          if (level === 0) return '';
          const t = level / 100;
          const r = Math.round(26 + (20 - 26) * t);
          const g = Math.round(35 + (83 - 35) * t);
          const b = Math.round(52 + (45 - 52) * t);
          return `rgb(${r}, ${g}, ${b})`;
        }
        if (level === 0) return '';
        const t = level / 100;
        const r = Math.round(255 + (220 - 255) * t);
        const g = Math.round(255 + (252 - 255) * t);
        const b = Math.round(255 + (231 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function getCardBorderColor(level) {
        if (isDarkTheme()) {
          if (level === 0) return '';
          const t = level / 100;
          const r = Math.round(60 + (22 - 60) * t);
          const g = Math.round(80 + (101 - 80) * t);
          const b = Math.round(110 + (71 - 110) * t);
          return `rgb(${r}, ${g}, ${b})`;
        }
        if (level === 0) return '';
        const t = level / 100;
        const r = Math.round(255 + (187 - 255) * t);
        const g = Math.round(255 + (247 - 255) * t);
        const b = Math.round(255 + (208 - 255) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      // ============================================================
      // 数据模型
      // ============================================================
      function normalizeItem(item) {
        let level = 0;
        if (typeof item.masteryLevel === 'number') {
          level = Math.max(0, Math.min(100, item.masteryLevel));
        } else if (item.mastered === true) {
          level = 100;
        }
        let images = [];
        if (Array.isArray(item.images)) {
          images = item.images.filter(x => typeof x === 'string' && x);
        }
        return {
          id: sanitizeId(item.id),
          title: item.title || '无标题',
          content: toHtmlContent(item.content || ''),
          group: item.group || '',
          masteryLevel: level,
          images,
          tags: normalizeTags(item.tags)
        };
      }

      function loadFromStorage() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_ITEMS);
          if (stored !== null) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) {
              return parsed
                .filter(item => item && item.title !== undefined)
                .map(normalizeItem);
            }
          }
        } catch (e) { console.warn('读取失败', e); }
        return DEFAULT_ITEMS.map(item => normalizeItem(item));
      }

      function loadCollapsedState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_COLLAPSED);
          return stored ? JSON.parse(stored) : {};
        } catch (e) { return {}; }
      }

      let saveTimer = null;
      function saveToStorage() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          saveTimer = null;
          try {
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(state.items));
          } catch (e) {
            console.warn('保存失败', e);
            showToast('⚠️ 保存失败，数据量过大', true);
          }
        }, 300);
      }

      function flushSave() {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        try {
          localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(state.items));
        } catch (e) { console.warn('保存失败', e); }
      }

      function saveCollapsedState() {
        try { localStorage.setItem(STORAGE_KEY_COLLAPSED, JSON.stringify(state.collapsedGroups)); } catch (e) {}
      }

      // ============================================================
      // IndexedDB
      // ============================================================
      let dbPromise = null;
      function getDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) { reject(new Error('IndexedDB 不可用')); return; }
          let retried = false;
          const tryOpen = () => {
            try {
              const req = indexedDB.open(DB_NAME, DB_VERSION);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_IMAGES)) {
                  db.createObjectStore(STORE_IMAGES, { keyPath: 'id' });
                }
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => {
                if (!retried) { retried = true; setTimeout(() => { dbPromise = null; tryOpen(); }, 300); }
                else reject(req.error);
              };
            } catch (e) { reject(e); }
          };
          tryOpen();
        });
        return dbPromise;
      }

      async function saveImage(id, dataUrl) {
        const db = await getDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_IMAGES, 'readwrite');
          tx.objectStore(STORE_IMAGES).put({ id, dataUrl });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function getImage(id) {
        try {
          const db = await getDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_IMAGES, 'readonly');
            const req = tx.objectStore(STORE_IMAGES).get(id);
            req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
            req.onerror = () => reject(req.error);
          });
        } catch (e) { return null; }
      }

      async function deleteImage(id) {
        try {
          const db = await getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_IMAGES, 'readwrite');
            tx.objectStore(STORE_IMAGES).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch (e) {}
      }

      const imageCache = new Map();
      const pendingImageLoads = new Map();

      function cacheImage(id, dataUrl) {
        if (imageCache.has(id)) imageCache.delete(id);
        imageCache.set(id, dataUrl);
        while (imageCache.size > IMAGE_CACHE_MAX) {
          const oldestKey = imageCache.keys().next().value;
          imageCache.delete(oldestKey);
        }
      }

      function getCachedImage(id) {
        if (!imageCache.has(id)) return null;
        const val = imageCache.get(id);
        imageCache.delete(id);
        imageCache.set(id, val);
        return val;
      }

      async function resolveImageArray(images) {
        if (!Array.isArray(images) || images.length === 0) return [];
        const results = [];
        for (const ref of images) {
          if (!ref) continue;
          if (ref.startsWith('data:image/')) {
            results.push(ref);
          } else if (ref.startsWith('img://')) {
            const id = ref.slice(6);
            const cached = getCachedImage(id);
            if (cached) results.push(cached);
            else {
              let promise = pendingImageLoads.get(id);
              if (!promise) {
                promise = getImage(id).then((dataUrl) => {
                  pendingImageLoads.delete(id);
                  if (dataUrl) cacheImage(id, dataUrl);
                  return dataUrl;
                });
                pendingImageLoads.set(id, promise);
              }
              const dataUrl = await promise;
              if (dataUrl) results.push(dataUrl);
            }
          } else if (/^https?:\/\//i.test(ref)) {
            results.push(ref);
          }
        }
        return results;
      }

      async function cleanupImages(refs) {
        if (!Array.isArray(refs) || refs.length === 0) return;
        const stillUsed = new Set();
        state.items.forEach(item => {
          (item.images || []).forEach(ref => {
            if (typeof ref === 'string' && ref.startsWith('img://')) stillUsed.add(ref.slice(6));
          });
        });
        for (const ref of refs) {
          if (typeof ref !== 'string' || !ref.startsWith('img://')) continue;
          const imgId = ref.slice(6);
          if (stillUsed.has(imgId)) continue;
          imageCache.delete(imgId);
          await deleteImage(imgId);
        }
      }

      async function gcOrphanImages() {
        try {
          const db = await getDB();
          const keys = await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_IMAGES, 'readonly');
            const req = tx.objectStore(STORE_IMAGES).getAllKeys();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
          });
          const usedIds = new Set();
          state.items.forEach(item => {
            (item.images || []).forEach(ref => {
              if (typeof ref === 'string' && ref.startsWith('img://')) usedIds.add(ref.slice(6));
            });
          });
          for (const key of keys) {
            if (!usedIds.has(key)) await deleteImage(key);
          }
        } catch (e) {}
      }

      // ============================================================
      // 集合辅助
      // ============================================================
      function getAllGroups() {
        const groups = new Set();
        state.items.forEach(item => {
          const g = (item.group || '').trim();
          if (g) groups.add(g);
        });
        return Array.from(groups).sort();
      }

      function getAllTags() {
        const tagMap = new Map();
        state.items.forEach(item => {
          (item.tags || []).forEach(t => {
            const n = normalizeTag(t);
            if (!n) return;
            const key = n.toLowerCase();
            tagMap.set(key, (tagMap.get(key) || 0) + 1);
          });
        });
        return Array.from(tagMap.entries())
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([k]) => {
            for (const item of state.items) {
              for (const t of (item.tags || [])) {
                if (normalizeTag(t).toLowerCase() === k) return normalizeTag(t);
              }
            }
            return k;
          });
      }

      function isFilterActive() {
        return !!(state.searchQuery.trim() ||
                  state.filterGroup ||
                  state.filterTag ||
                  state.filterMastery ||
                  state.filterHasImage);
      }

      function getFilteredItems() {
        const q = state.searchQuery.trim().toLowerCase();
        const fg = state.filterGroup;
        const ft = state.filterTag ? state.filterTag.toLowerCase() : '';
        const fm = state.filterMastery;
        const fImg = state.filterHasImage;

        if (!q && !fg && !ft && !fm && !fImg) return state.items.slice();

        return state.items.filter(item => {
          if (q) {
            const hay = (item.title + ' ' + htmlToPlainText(item.content) + ' ' + (item.tags || []).join(' ')).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          if (fg && (item.group || '').trim() !== fg) return false;
          if (ft) {
            const hasTag = (item.tags || []).some(t => normalizeTag(t).toLowerCase() === ft);
            if (!hasTag) return false;
          }
          const level = item.masteryLevel || 0;
          if (fm === 'mastered' && level < MASTERED_THRESHOLD) return false;
          if (fm === 'unmastered' && level >= MASTERED_THRESHOLD) return false;
          if (fImg) {
            if (!Array.isArray(item.images) || item.images.length === 0) return false;
          }
          return true;
        });
      }

      // ============================================================
      // 语音
      // ============================================================
      const speechSupported = 'speechSynthesis' in window;
      let cachedVoices = [];

      function refreshVoices() {
        if (!speechSupported) return;
        try { cachedVoices = window.speechSynthesis.getVoices() || []; }
        catch (e) { cachedVoices = []; }
      }

      if (speechSupported) {
        refreshVoices();
        try { window.speechSynthesis.addEventListener('voiceschanged', refreshVoices); }
        catch (e) { window.speechSynthesis.onvoiceschanged = refreshVoices; }
      }

      function stopSpeaking() {
        if (speechSupported) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        state.speakingId = null;
        document.querySelectorAll('.speak-btn.speaking').forEach(btn => {
          btn.classList.remove('speaking');
          btn.textContent = '🔊';
        });
      }

      function getChineseVoice() {
        const voices = cachedVoices.length > 0 ? cachedVoices : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
        if (!voices || voices.length === 0) return null;
        return voices.find(v => v.lang === 'zh-CN' && v.localService)
          || voices.find(v => v.lang === 'zh-CN')
          || voices.find(v => v.lang && v.lang.startsWith('zh'))
          || null;
      }

      function normalizeSpeechText(raw) {
        if (!raw) return '';
        return String(raw)
          .replace(/\n+/g, '。')
          .replace(/。{2,}/g, '。')
          .replace(/\s+([，。！？；：、])/g, '$1')
          .replace(/([，。！？；：、])\s+/g, '$1')
          .trim();
      }

      function speakItem(item) {
        if (!speechSupported) { showToast('当前浏览器不支持语音朗读', true); return; }
        if (state.speakingId === item.id) { stopSpeaking(); return; }
        try { window.speechSynthesis.cancel(); } catch (e) {}

        const title = normalizeSpeechText(item.title);
        const content = normalizeSpeechText(htmlToPlainText(item.content || ''));
        let text = title;
        if (content) text += '。' + content;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = SPEECH_CONFIG.rate;
        utterance.pitch = SPEECH_CONFIG.pitch;
        utterance.volume = SPEECH_CONFIG.volume;
        utterance.lang = SPEECH_CONFIG.lang;
        const voice = getChineseVoice();
        if (voice) utterance.voice = voice;

        utterance.onend = utterance.onerror = () => {
          state.speakingId = null;
          const btn = document.querySelector(`.speak-btn[data-speak-id="${item.id}"]`);
          if (btn) { btn.classList.remove('speaking'); btn.textContent = '🔊'; }
        };

        state.speakingId = item.id;
        const btn = document.querySelector(`.speak-btn[data-speak-id="${item.id}"]`);
        if (btn) { btn.classList.add('speaking'); btn.textContent = '⏸'; }
        try { window.speechSynthesis.speak(utterance); }
        catch (e) { showToast('朗读启动失败', true); }
      }

      // ============================================================
      // 调色板注册表
      // ============================================================
      const paletteRegistry = new Map();
      let paletteBusBound = false;

      function bindPaletteBus() {
        if (paletteBusBound) return;
        paletteBusBound = true;

        let lastOpenTime = 0;
        const markOpen = () => { lastOpenTime = Date.now(); };
        window.__markPaletteOpen = markOpen;

        document.addEventListener('pointerdown', (e) => {
          if (Date.now() - lastOpenTime < 200) return;
          if (!e.target.closest('.color-btn-group') && !e.target.closest('.color-palette')) {
            closeAllPalettes();
          }
        });

        document.addEventListener('click', (e) => {
          const palette = e.target.closest('.color-palette');
          if (!palette) return;
          const editorId = palette.dataset.paletteFor;
          const reg = paletteRegistry.get(editorId);
          if (!reg) return;

          const swatch = e.target.closest('.color-swatch');
          if (swatch) {
            e.preventDefault();
            e.stopPropagation();
            const kind = palette.dataset.paletteKind;
            const value = swatch.dataset.colorValue;
            reg.editor.focus({ preventScroll: true });
            reg.restoreSelection();
            reg.applyColor(kind, value);
            reg.updatePaletteSelection(palette, kind);
            closeAllPalettes();
          }
        });

        const onCustomColor = (e) => {
          const input = e.target.closest('.color-custom-input');
          if (!input) return;
          const palette = input.closest('.color-palette');
          if (!palette) return;
          const editorId = palette.dataset.paletteFor;
          const reg = paletteRegistry.get(editorId);
          if (!reg) return;
          const kind = palette.dataset.paletteKind;
          reg.restoreSelection();
          reg.applyColor(kind, input.value);
          reg.updatePaletteSelection(palette, kind);
        };
        document.addEventListener('input', onCustomColor);
        document.addEventListener('change', onCustomColor);
      }

      function closeAllPalettes() {
        document.querySelectorAll('.color-palette.show').forEach(p => p.classList.remove('show'));
        document.querySelectorAll('.color-btn-group.open').forEach(g => g.classList.remove('open'));
      }

      function positionPalette(palette, anchorEl) {
        const rect = anchorEl.getBoundingClientRect();
        const pw = palette.offsetWidth || 260;
        const ph = palette.offsetHeight || 200;
        let left = rect.left;
        if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
        if (left < 8) left = 8;
        palette.style.left = left + 'px';
        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < ph + 12 && rect.top > ph + 12) {
          palette.style.top = 'auto';
          palette.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
        } else {
          palette.style.bottom = 'auto';
          palette.style.top = (rect.bottom + 6) + 'px';
        }
      }

      // ============================================================
      // 确认框
      // ============================================================
      function showConfirm(title, message, onConfirm) {
        el.confirmTitle.textContent = title;
        el.confirmMessage.textContent = message;
        state.confirmCallback = onConfirm;
        el.confirmOverlay.classList.add('show');

      function closeConfirm() {

        state.confirmCallback = null;
      }

      el.confirmOk.addEventListener('click', () => {
        const cb = state.confirmCallback;
        closeConfirm();
        if (cb) cb();
      });
      el.confirmCancel.addEventListener('click', closeConfirm);
      el.confirmOverlay.addEventListener('click', (e) => {
        if (e.target === el.confirmOverlay) closeConfirm();

      // ============================================================
      // 未保存检测（修复：改为脏标记，避免误报）
      // ============================================================
      function markEditDirty() {
        if (state.mode === 'edit') state.editDirty = true;
      }

      function bindEditDirtyTracking(ids) {
        ids.forEach(id => {
          const node = document.getElementById(id);
          if (!node) return;
          node.addEventListener('input', markEditDirty);
        });
      }

      function hasUnsavedEdit() {
        if (state.mode !== 'edit') return false;
        return state.editDirty === true;
      }

      function guardUnsaved(onProceed) {
        if (!hasUnsavedEdit()) { onProceed(); return; }
        showConfirm('未保存的修改', '当前编辑内容尚未保存，确定要放弃并离开吗？', onProceed);
      }

      // ============================================================
      // 侧边栏
      // ============================================================
      let sidebarRendered = false;

      function renderSidebarHeader() {
        el.sidebarHeader.classList.add('sidebar-header');
        el.sidebarHeader.classList.remove('selection-header');
        el.sidebarHeader.innerHTML = `
          <span>目录</span>
          <div class="sidebar-header-right">
            <span class="count-badge" id="counterBadge">0</span>
            <button class="sidebar-icon-btn add-btn" id="sidebarAddBtn" title="新建知识点">＋</button>
            <button class="sidebar-icon-btn" id="selectModeBtn" title="批量选择">☰</button>
          </div>
        `;
        const selectBtn = document.getElementById('selectModeBtn');
        if (selectBtn) selectBtn.addEventListener('click', enterSelectionMode);
        const addBtn = document.getElementById('sidebarAddBtn');
        if (addBtn) addBtn.addEventListener('click', handleSidebarAddClick);
      }

      function renderSidebar(force) {
        if (!force && sidebarRendered) { updateSidebarActive(); return; }
        sidebarRendered = true;

        if (state.selectionMode) {
          el.sidebarHeader.outerHTML = `
            <div class="selection-header" id="sidebarHeader">
              <div>
                已选 <span class="count">${state.selectedIds.size}</span>
              </div>
              <div style="display:flex; gap:2px;">
                <button id="selectAllBtn">全选</button>
                <button id="exitSelectionBtn">取消</button>
              </div>
            </div>
          `;
          el.sidebarHeader = document.getElementById('sidebarHeader');
          document.getElementById('selectAllBtn').addEventListener('click', selectAllInSidebar);
          document.getElementById('exitSelectionBtn').addEventListener('click', exitSelectionMode);
          el.selectionBar.style.display = '';
          renderSelectionBar();
        } else {
          if (!el.sidebarHeader.classList.contains('sidebar-header')) {
            el.sidebarHeader.outerHTML = `
              <div class="sidebar-header" id="sidebarHeader">
                <span>目录</span>
                <div class="sidebar-header-right">
                  <span class="count-badge" id="counterBadge">0</span>
                  <button class="sidebar-icon-btn add-btn" id="sidebarAddBtn" title="新建知识点">＋</button>
                  <button class="sidebar-icon-btn" id="selectModeBtn" title="批量选择">☰</button>
                </div>
              </div>
            `;
            el.sidebarHeader = document.getElementById('sidebarHeader');
            document.getElementById('selectModeBtn').addEventListener('click', enterSelectionMode);
            document.getElementById('sidebarAddBtn').addEventListener('click', handleSidebarAddClick);
          }
          el.selectionBar.style.display = 'none';
        }

        if (state.items.length === 0) {
          el.knowledgeList.innerHTML = '<div class="empty-list-msg">暂无知识点</div>';
          const badge = document.getElementById('counterBadge');
          if (badge) badge.textContent = '0';
          return;
        }

        const filtered = getFilteredItems();
        const { groups, groupMap, ungrouped } = buildGroups(filtered);

        if (filtered.length === 0) {
          el.knowledgeList.innerHTML = `<div class="empty-list-msg">🔍 没有匹配项</div>`;
          const badge = document.getElementById('counterBadge');
          if (badge) badge.textContent = `0/${state.items.length}`;
          return;
        }

        let html = '';
        groups.forEach(groupName => {
          const groupItems = groupMap.get(groupName) || [];
          const isCollapsed = state.collapsedGroups[groupName] === true;
          html += `
            <div class="group-section ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(groupName)}">
              <div class="group-header" data-action="toggle-group" data-group="${escapeHtml(groupName)}">
                <span class="group-arrow">▼</span>
                <span class="group-name">${escapeHtml(groupName)}</span>
                <span class="group-count">${groupItems.length}</span>
                <div class="group-actions">
                  <button class="group-action-btn delete-group" data-action="delete-group" data-group="${escapeHtml(groupName)}" title="删除该组">✕</button>
                </div>
              </div>
              <div class="group-items">
                ${groupItems.map(renderKnowledgeItem).join('')}
              </div>
            </div>
          `;
        });

        if (ungrouped.length > 0) {
          if (groups.length > 0) html += '<div class="ungrouped-label">未分组</div>';
          html += ungrouped.map(renderKnowledgeItem).join('');
        }

        el.knowledgeList.innerHTML = html;

        const badge = document.getElementById('counterBadge');
        if (badge) {
          badge.textContent = isFilterActive() ? `${filtered.length}/${state.items.length}` : String(state.items.length);
        }
      }

      function renderSelectionBar() {
        const n = state.selectedIds.size;
        el.selectionBar.innerHTML = `
          <button id="batchMoveBtn" ${n === 0 ? 'disabled' : ''}>
            <span class="ico">📁</span><span>移动</span>
          </button>
          <button id="batchResetBtn" ${n === 0 ? 'disabled' : ''}>
            <span class="ico">↺</span><span>重置</span>
          </button>
          <button id="batchDeleteBtn" class="danger" ${n === 0 ? 'disabled' : ''}>
            <span class="ico">🗑</span><span>删除</span>
          </button>
        `;
        document.getElementById('batchMoveBtn').addEventListener('click', batchMoveGroup);
        document.getElementById('batchResetBtn').addEventListener('click', batchResetMastery);
        document.getElementById('batchDeleteBtn').addEventListener('click', batchDelete);
      }

      function buildGroups(items) {
        const groupMap = new Map();
        const ungrouped = [];
        items.forEach(item => {
          const g = (item.group || '').trim();
          if (g) {
            if (!groupMap.has(g)) groupMap.set(g, []);
            groupMap.get(g).push(item);
          } else {
            ungrouped.push(item);
          }
        });
        return { groups: Array.from(groupMap.keys()).sort(), groupMap, ungrouped };
      }

      function updateSidebarActive() {
        const itemMap = new Map(state.items.map(i => [i.id, i]));
        const items = el.knowledgeList.querySelectorAll('.knowledge-item');
        items.forEach(node => {
          const id = node.dataset.id;
          const active = id === state.activeId && !state.isCreatingNew && !state.selectionMode;
          node.classList.toggle('active', active);
          const data = itemMap.get(id);
          if (data) node.classList.toggle('mastered', (data.masteryLevel || 0) >= MASTERED_THRESHOLD);
        });
      }

      function renderKnowledgeItem(item) {
        const isActive = item.id === state.activeId && !state.isCreatingNew && !state.selectionMode;
        const isSelected = state.selectionMode && state.selectedIds.has(item.id);
        const masteredClass = (item.masteryLevel || 0) >= MASTERED_THRESHOLD ? 'mastered' : '';
        const masteredBadge = masteredClass ? '<span class="mastered-badge">✓</span>' : '';

        const checkboxHtml = state.selectionMode
          ? `<span class="item-checkbox">✓</span>`
          : '';

        const actionsHtml = state.selectionMode ? '' : `
          <div class="item-actions">
            <button class="delete-btn" data-action="delete-item" data-id="${item.id}" title="删除">✕</button>
          </div>
        `;

        return `
          <div class="knowledge-item ${isActive ? 'active' : ''} ${masteredClass} ${isSelected ? 'selected' : ''}" data-id="${item.id}" data-action="select-item" title="${escapeHtml(item.title)}">
            ${checkboxHtml}
            <span class="item-body">${masteredBadge}${escapeHtml(item.title)}</span>
            ${actionsHtml}
          </div>
        `;
      }

      // ============================================================
      // 新建按钮处理（侧边栏头部）
      // ============================================================
      function handleSidebarAddClick() {
        guardUnsaved(() => {
          if (state.speakingId) stopSpeaking();
          clearPendingCardClick();
          closeAllPalettes();
          state.isCreatingNew = true;
          state.activeId = null;
          state.draftImages = [];
          state.draftTags = [];
          state.editingSessionId = null;
          state.editDirty = false;
          state.formatPainterArmed = false;
          state.formatPainterClip = null;
          state.formatPainterEditorId = null;
          renderSidebar(true);
          renderContent();
          setTimeout(() => {
            const t = document.getElementById('newTitleInput');
            if (t) t.focus();
          }, 120);
