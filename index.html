              if (!hc || hc === 'rgba(0, 0, 0, 0)' || hc === 'transparent' || hc === 'rgba(0,0,0,0)') {
                hc = document.queryCommandValue('backColor');
              }
              if (hc && hc !== 'rgba(0, 0, 0, 0)' && hc !== 'transparent' && hc !== 'rgba(0,0,0,0)') {
                const n = normalizeColor(hc);
                if (n && n !== '#ffffff') foundBg = n;
              }
            } catch (e) {}
          }

          if (!foundUnderline) {
            const candidates = [
              cs.textDecorationLine,
              cs.textDecoration,
              cs.webkitTextDecorationLine,
              cs.webkitTextDecoration
            ].filter(Boolean).join(' ');
            if (/underline/i.test(candidates)) foundUnderline = true;
          }
          if (!foundUnderline) {
            try { if (document.queryCommandState('underline')) foundUnderline = true; } catch (e) {}
          }

          clip.underline = foundUnderline;
          if (foundColor) clip.foreColor = foundColor;
          if (foundBg) clip.hiliteColor = foundBg;

          return clip;
        }

        function applyFormatToCurrentSelection() {
          if (!state.formatPainterClip) return false;
          const clip = state.formatPainterClip;

          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return false;
          const range = sel.getRangeAt(0);
          if (range.collapsed) return false;
          if (!editor.contains(range.commonAncestorContainer)) return false;

          const targetRange = range.cloneRange();
          editor.focus({ preventScroll: true });

          try {
            const sel2 = window.getSelection();
            sel2.removeAllRanges();
            sel2.addRange(targetRange);
          } catch (e) { return false; }

          ensureStyleWithCSS();

          try {
            const curBold = document.queryCommandState('bold');
            if (!!clip.bold !== !!curBold) document.execCommand('bold', false, null);
            const curItalic = document.queryCommandState('italic');
            if (!!clip.italic !== !!curItalic) document.execCommand('italic', false, null);
            applyUnderlineSafely(clip.underline);

            if (clip.foreColor) {
              try { document.execCommand('foreColor', false, clip.foreColor); } catch (e) {}
              if (!isColorApplied(clip.foreColor, 'color')) {
                wrapSelectionWithStyle('color', clip.foreColor);
              }
            }
            if (clip.hiliteColor) {
              try { document.execCommand('hiliteColor', false, clip.hiliteColor); } catch (e) {
                try { document.execCommand('backColor', false, clip.hiliteColor); } catch (e2) {}
              }
              if (!isColorApplied(clip.hiliteColor, 'background-color')) {
                wrapSelectionWithStyle('background-color', clip.hiliteColor);
              }
            }
          } catch (e) { console.warn(e); }

          saveSelection();
          updateActiveStates();
          return true;
        }

        function isColorApplied(color, prop) {
          try {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return false;
            const r = sel.getRangeAt(0);
            let node = r.startContainer;
            if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            if (!node) return false;
            const cs = window.getComputedStyle(node);
            const want = normalizeColor(color);
            const got = normalizeColor(prop === 'color' ? cs.color : cs.backgroundColor);
            return want && got && want === got;
          } catch (e) { return false; }
        }

        function wrapSelectionWithStyle(prop, color) {
          try {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            const r = sel.getRangeAt(0);
            if (r.collapsed) return;
            const span = document.createElement('span');
            span.style.setProperty(prop, color, 'important');
            try {
              r.surroundContents(span);
            } catch (e) {
              const frag = r.extractContents();
              span.appendChild(frag);
              r.insertNode(span);
            }
            const newSel = window.getSelection();
            newSel.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(span);
            newSel.addRange(newRange);
          } catch (e) { console.warn('wrapSelectionWithStyle 失败', e); }
        }

        function applyUnderlineSafely(wantUnderline) {
          ensureStyleWithCSS();
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return;
          const range = sel.getRangeAt(0);
          if (range.collapsed) return;

          let curUnderline = false;
          try { curUnderline = document.queryCommandState('underline'); } catch (e) {}

          if (wantUnderline !== curUnderline) {
            try { document.execCommand('underline', false, null); } catch (e) {}
          }

          let nowUnderline = false;
          try { nowUnderline = document.queryCommandState('underline'); } catch (e) {}
          if (nowUnderline === wantUnderline) return;

          const sel2 = window.getSelection();
          if (!sel2 || sel2.rangeCount === 0) return;
          const r = sel2.getRangeAt(0);

          if (wantUnderline) {
            let anc = r.startContainer;
            if (anc.nodeType === Node.TEXT_NODE) anc = anc.parentElement;
            let hasU = false;
            let walk = anc;
            while (walk && walk !== editor) {
              if (walk.nodeType === Node.ELEMENT_NODE &&
                  (walk.tagName === 'U' || walk.tagName === 'INS')) { hasU = true; break; }
              walk = walk.parentElement;
            }
            if (hasU) return;
            try {
              const u = document.createElement('u');
              try {
                r.surroundContents(u);
              } catch (e) {
                const frag = r.extractContents();
                u.appendChild(frag);
                r.insertNode(u);
              }
              const newSel = window.getSelection();
              newSel.removeAllRanges();
              const newRange = document.createRange();
              newRange.selectNodeContents(u);
              newSel.addRange(newRange);
            } catch (e) { console.warn('下划线兜底失败', e); }
          } else {
            const us = [];
            const root = r.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
              ? r.commonAncestorContainer
              : r.commonAncestorContainer.parentElement;
            if (root) {
              const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
              let n;
              while ((n = walker.nextNode())) {
                if (n.tagName === 'U' || n.tagName === 'INS') us.push(n);
              }
            }
            us.forEach(u => {
              if (!r.intersectsNode(u)) return;
              const text = document.createTextNode(u.textContent);
              u.parentNode.replaceChild(text, u);
            });
          }
        }

        function updateFormatPainterUI() {
          const btn = toolbar.querySelector('.format-painter-btn');
          if (!btn) return;
          const shouldArmed = state.formatPainterArmed && state.formatPainterEditorId === editorId;
          btn.classList.toggle('armed', shouldArmed);
        }

        toolbar.addEventListener('mousedown', (e) => {
          const cmdBtn = e.target.closest('.rich-btn[data-cmd]');
          if (cmdBtn) e.preventDefault();
        });
        toolbar.addEventListener('touchstart', (e) => {
          const cmdBtn = e.target.closest('.rich-btn[data-cmd]');
          if (cmdBtn) saveSelection();
        }, { passive: true });

        toolbar.addEventListener('click', (e) => {
          const btn = e.target.closest('.rich-btn[data-cmd]');
          const colorMain = e.target.closest('.color-btn-main');
          const colorArrow = e.target.closest('.color-btn-arrow');

          if (colorMain) {
            e.preventDefault();
            e.stopPropagation();
            const kind = colorMain.dataset.colorKind;
            const current = kind === 'text' ? state.lastTextColor : state.lastBgColor;
            editor.focus({ preventScroll: true });
            restoreSelection();
            applyColor(kind, current);
            closeAllPalettes();
            return;
          }

          if (colorArrow) {
            e.preventDefault();
            e.stopPropagation();
            const kind = colorArrow.dataset.colorKind;
            const palette = document.getElementById(`palette-${editorId}-${kind}`);
            if (!palette) return;
            const isOpen = palette.classList.contains('show');
            closeAllPalettes();
            if (!isOpen) {
              const group = colorArrow.closest('.color-btn-group');
              if (group) group.classList.add('open');

              palette.style.visibility = 'hidden';
              palette.classList.add('show');
              positionPalette(palette, colorArrow);
              palette.style.visibility = '';

              // 标记打开时间，防止 pointerdown 立刻关闭
              if (window.__markPaletteOpen) window.__markPaletteOpen();

              const customInput = palette.querySelector('.color-custom-input');
              if (customInput) {
                customInput.value = kind === 'text' ? state.lastTextColor : state.lastBgColor;
              }
              updatePaletteSelection(palette, kind);
            }
            return;
          }

          if (!btn) return;
          e.preventDefault();
          const cmd = btn.dataset.cmd;

          if (cmd === 'formatPainter') {
            if (state.formatPainterArmed && state.formatPainterEditorId === editorId) {
              const sel = window.getSelection();
              const hasSelection = sel && sel.rangeCount > 0 && !sel.isCollapsed &&
                sel.toString().length > 0 && editor.contains(sel.anchorNode);
              if (hasSelection) {
                const ok = applyFormatToCurrentSelection();
                if (ok) {
                  state.formatPainterArmed = false;
                  state.formatPainterClip = null;
                  state.formatPainterEditorId = null;
                  updateFormatPainterUI();
                  showToast('✓ 格式已应用');
                } else {
                  showToast('应用失败，请重新选中目标文字', true);
                }
              } else {
                state.formatPainterArmed = false;
                state.formatPainterClip = null;
                state.formatPainterEditorId = null;
                updateFormatPainterUI();
                showToast('已取消格式刷');
              }
              return;
            }

            editor.focus({ preventScroll: true });
            restoreSelection();
            const clip = readFormatFromSelection();
            if (!clip) {
              showToast('请把光标放在文字上再点格式刷', true);
              return;
            }
            const hasAny = clip.bold || clip.italic || clip.underline || clip.foreColor || clip.hiliteColor;
            if (!hasAny) {
              showToast('当前文字无特殊格式，无法复制', true);
              return;
            }
            state.formatPainterClip = clip;
            state.formatPainterArmed = true;
            state.formatPainterEditorId = editorId;
            updateFormatPainterUI();
            showToast('格式已复制，请选中目标文字后再次点击🖌');
            return;
          }

          editor.focus({ preventScroll: true });
          restoreSelection();
          if (cmd === 'removeFormat') {
            document.execCommand('removeFormat', false, null);
            try { document.execCommand('hiliteColor', false, 'transparent'); } catch (e) {}
            try { document.execCommand('backColor', false, 'transparent'); } catch (e) {}
          } else if (cmd === 'underline') {
            applyUnderlineSafely(true);
          } else {
            document.execCommand(cmd, false, null);
          }
          saveSelection();
          updateActiveStates();
        });

        function applyColor(kind, color) {
          ensureStyleWithCSS();
          if (kind === 'text') {
            try { document.execCommand('foreColor', false, color); } catch (e) {}
            if (!isColorApplied(color, 'color')) {
              wrapSelectionWithStyle('color', color);
            }
            state.lastTextColor = color;
          } else {
            try { document.execCommand('hiliteColor', false, color); }
            catch (e) { document.execCommand('backColor', false, color); }
            if (!isColorApplied(color, 'background-color')) {
              wrapSelectionWithStyle('background-color', color);
            }
            state.lastBgColor = color;
          }
          const group = toolbar.querySelector(`.color-btn-group[data-color-group="${editorId}-${kind}"]`);
          if (group) {
            const bar = group.querySelector('.color-btn-main .color-bar');
            if (bar) bar.style.background = color;
          }
          saveSelection();
          updateActiveStates();
        }

        function updatePaletteSelection(palette, kind) {
          if (!palette) return;
          const current = kind === 'text' ? state.lastTextColor : state.lastBgColor;
          palette.querySelectorAll('.color-swatch').forEach(sw => {
            sw.classList.toggle('selected', sw.dataset.colorValue.toLowerCase() === current.toLowerCase());
          });
        }

        editor.addEventListener('paste', (e) => {
          e.preventDefault();
          const html = (e.clipboardData || window.clipboardData).getData('text/html');
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          if (html) document.execCommand('insertHTML', false, sanitizeHtml(html));
          else document.execCommand('insertText', false, text);
        });

        editor.addEventListener('focus', () => {
          setTimeout(() => {
            try { editor.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            catch (e) { editor.scrollIntoView(); }
          }, 300);
        });

        updateFormatPainterUI();
      }

      // ---------- 图片区 ----------
      async function renderImageSection(images, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const resolved = await resolveImageArray(images);

        const currentContainer = document.getElementById(containerId);
        if (!currentContainer || currentContainer !== container || !container.isConnected) return;

        if (resolved.length === 0) {
          container.innerHTML = '<div class="no-images-hint">暂无图片</div>';
          return;
        }
        container.innerHTML = resolved.map((src, i) => `
          <div class="image-item" data-img-index="${i}">
            <img src="${src}" alt="知识点图片">
            <button type="button" class="remove-img-btn" data-action="remove-img" data-img-index="${i}" title="移除">✕</button>
          </div>
        `).join('');
      }

      function pickAndAddImages(onAdd) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = async () => {
          const files = Array.from(input.files || []);
          for (const file of files) {
            await new Promise((resolve) => {
              compressImage(file, async (dataUrl) => {
                try {
                  const imgId = generateId();
                  await saveImage(imgId, dataUrl);
                  onAdd(`img://${imgId}`);
                } catch (err) {
                  console.warn('图片保存失败', err);
                  showToast('图片保存失败，请重试', true);
                }
                resolve();
              });
            });
          }
        };
        input.click();
      }

      function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > IMG_MAX_SIZE || height > IMG_MAX_SIZE) {
              if (width >= height) {
                height = Math.round(height * IMG_MAX_SIZE / width);
                width = IMG_MAX_SIZE;
              } else {
                width = Math.round(width * IMG_MAX_SIZE / height);
                height = IMG_MAX_SIZE;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let dataUrl;
            try { dataUrl = canvas.toDataURL('image/jpeg', IMG_QUALITY); }
            catch (err) { dataUrl = canvas.toDataURL('image/png'); }
            if (dataUrl.length > 800 * 1024) dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            callback(dataUrl);
          };
          img.onerror = () => showToast('图片加载失败', true);
          img.src = e.target.result;
        };
        reader.onerror = () => showToast('图片读取失败', true);
        reader.readAsDataURL(file);
      }

      // ---------- 编辑模式 ----------
      function renderEditMode() {
        const activeItem = state.items.find(i => i.id === state.activeId);
        const sessionId = state.isCreatingNew ? '__new__' : (state.activeId || null);

        const isNewSession = state.editingSessionId !== sessionId;
        if (isNewSession) {
          state.editingSessionId = sessionId;
          state.draftImages = state.isCreatingNew
            ? []
            : ((activeItem && activeItem.images) ? activeItem.images.slice() : []);
        }

        if (state.isCreatingNew || !activeItem) {
          el.contentArea.innerHTML = `
            <div class="card-wrapper">
              <div class="edit-card">
                <div class="input-group">
                  <label>📌 标题</label>
                  <input type="text" id="newTitleInput" placeholder="例如：HTTP 状态码" value="">
                </div>
                <div class="input-group">
                  <label>📁 上级目录（可选）</label>
                  <input type="text" id="newGroupInput" list="newGroupList" placeholder="输入分组名称，如：前端基础" value="">
                  <datalist id="newGroupList">
                    ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                  </datalist>
                </div>
                <div class="input-group">
                  <label>📝 内容</label>
                  ${buildRichEditorHtml('newContentEditor', '')}
                </div>
                <div class="images-section">
                  <div class="images-section-header">
                    <label>🖼️ 图片</label>
                    <button type="button" class="add-image-icon-btn" id="addNewImagesBtn" title="添加图片" aria-label="添加图片">+</button>
                  </div>
                  <div class="image-list" id="newImageList"></div>
                </div>
                <div class="button-group">
                  <button class="btn btn-primary" id="addNewBtn">➕ 添加知识点</button>
                  <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
                </div>
              </div>
              <div class="edit-data-actions">
                <button class="data-btn" id="exportBtn">📤 导出</button>
                <button class="data-btn" id="importBtn">📥 导入</button>
              </div>
            </div>
          `;

          const newEditor = document.getElementById('newContentEditor');
          initRichEditor('newContentEditor');
          renderImageSection(state.draftImages, 'newImageList');

          document.getElementById('addNewImagesBtn').addEventListener('click', () => {
            pickAndAddImages(async (ref) => {
              state.draftImages.push(ref);
              await renderImageSection(state.draftImages, 'newImageList');
            });
          });

          document.getElementById('newImageList').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action="remove-img"]');
            if (!btn) return;
            const i = parseInt(btn.dataset.imgIndex, 10);
            state.draftImages.splice(i, 1);
            renderImageSection(state.draftImages, 'newImageList');
          });

          document.getElementById('addNewBtn').addEventListener('click', () => {
            const title = document.getElementById('newTitleInput').value.trim();
            const group = document.getElementById('newGroupInput').value.trim();
            const rawHtml = newEditor.innerHTML.trim();
            const content = sanitizeHtml(rawHtml);
            const isEmpty = !htmlToPlainText(content);
            if (!title) { showToast('请输入标题', true); return; }
            const newItem = {
              id: generateId(), title,
              content: isEmpty ? '' : content,
              group,
              masteryLevel: 0,
              images: state.draftImages.slice()
            };
            state.items.push(newItem);
            state.activeId = newItem.id;
            state.isCreatingNew = false;
            state.draftImages = [];
            state.editingSessionId = null;
            state.formatPainterArmed = false;
            state.formatPainterClip = null;
            state.formatPainterEditorId = null;
            saveToStorage();
            renderSidebar(true);
            renderContent();
            showToast('已添加');
          });

          document.getElementById('cancelAddBtn').addEventListener('click', () => {
            state.isCreatingNew = false;
            state.draftImages = [];
            state.editingSessionId = null;
            state.formatPainterArmed = false;
            state.formatPainterClip = null;
            state.formatPainterEditorId = null;
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
            renderSidebar(true);
            renderContent();
          });

          document.getElementById('exportBtn').addEventListener('click', openExportModal);
          document.getElementById('importBtn').addEventListener('click', openImportModal);
          return;
        }

        el.contentArea.innerHTML = `
          <div class="card-wrapper">
            <div class="edit-card">
              <div class="input-group">
                <label>✏️ 标题</label>
                <input type="text" id="editTitleInput" value="${escapeHtml(activeItem.title)}" placeholder="知识点标题">
              </div>
              <div class="input-group">
                <label>📁 上级目录（可选）</label>
                <input type="text" id="editGroupInput" list="editGroupList" value="${escapeHtml(activeItem.group || '')}" placeholder="输入分组名称，留空为无分组">
                <datalist id="editGroupList">
                  ${getAllGroups().map(g => `<option value="${escapeHtml(g)}">`).join('')}
                </datalist>
              </div>
              <div class="input-group">
                <label>📄 内容</label>
                ${buildRichEditorHtml('editContentEditor', activeItem.content)}
              </div>
              <div class="images-section">
                <div class="images-section-header">
                  <label>🖼️ 图片</label>
                  <button type="button" class="add-image-icon-btn" id="addEditImagesBtn" title="添加图片" aria-label="添加图片">+</button>
                </div>
                <div class="image-list" id="editImageList"></div>
              </div>
              <div class="button-group">
                <button class="btn btn-primary" id="saveEditBtn">💾 保存修改</button>
                <button class="btn btn-secondary" id="cancelEditBtn">↩️ 取消</button>
              </div>
            </div>
            <div class="edit-data-actions">
              <button class="data-btn" id="exportBtn">📤 导出</button>
              <button class="data-btn" id="importBtn">📥 导入</button>
            </div>
          </div>
        `;

        const editEditor = document.getElementById('editContentEditor');
        initRichEditor('editContentEditor');
        renderImageSection(state.draftImages, 'editImageList');

        document.getElementById('addEditImagesBtn').addEventListener('click', () => {
          pickAndAddImages(async (ref) => {
            state.draftImages.push(ref);
            await renderImageSection(state.draftImages, 'editImageList');
          });
        });

        document.getElementById('editImageList').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action="remove-img"]');
          if (!btn) return;
          const i = parseInt(btn.dataset.imgIndex, 10);
          state.draftImages.splice(i, 1);
          renderImageSection(state.draftImages, 'editImageList');
        });

        document.getElementById('saveEditBtn').addEventListener('click', () => {
          const newTitle = document.getElementById('editTitleInput').value.trim();
          const newGroup = document.getElementById('editGroupInput').value.trim();
          const rawHtml = editEditor.innerHTML.trim();
          const newContent = sanitizeHtml(rawHtml);
          const isEmpty = !htmlToPlainText(newContent);
          if (!newTitle) { showToast('标题不能为空', true); return; }
          const item = state.items.find(i => i.id === state.activeId);
          if (item) {
            item.title = newTitle;
            item.group = newGroup;
            item.content = isEmpty ? '' : newContent;
            item.images = state.draftImages.slice();
            saveToStorage();
            state.editingSessionId = null;
            state.draftImages = [];
            state.formatPainterArmed = false;
            state.formatPainterClip = null;
            state.formatPainterEditorId = null;
            renderSidebar(true);
            renderContent();
            showToast('已保存');
          }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
          state.draftImages = [];
          state.editingSessionId = null;
          state.formatPainterArmed = false;
          state.formatPainterClip = null;
          state.formatPainterEditorId = null;
          renderContent();
        });
        document.getElementById('exportBtn').addEventListener('click', openExportModal);
        document.getElementById('importBtn').addEventListener('click', openImportModal);
      }

      function updateSidebarAddButton() {
        const oldBtn = document.getElementById('sidebarAddBtn');
        if (oldBtn) oldBtn.remove();
        if (state.mode !== 'edit') return;

        const addBtn = document.createElement('button');
        addBtn.id = 'sidebarAddBtn';
        addBtn.className = 'btn btn-secondary';
        addBtn.style.cssText = 'margin:8px 6px 12px;padding:8px 4px;font-size:0.75rem;border-radius:30px;width:calc(100% - 12px);flex-shrink:0;background:#f8fafc;';
        addBtn.textContent = '➕ 新建';
        addBtn.addEventListener('click', () => {
          state.isCreatingNew = true;
          state.draftImages = [];
          state.editingSessionId = null;
          state.formatPainterArmed = false;
          state.formatPainterClip = null;
          state.formatPainterEditorId = null;
          renderSidebar(true);
          renderContent();
        });
        el.sidebar.appendChild(addBtn);
      }

      function setMode(mode) {
        if (mode === state.mode) { renderContent(); return; }
        if (state.speakingId) stopSpeaking();
        clearPendingCardClick();
        closeAllPalettes();

        if (state.mode === 'edit' && mode !== 'edit') {
          state.editingSessionId = null;
          state.draftImages = [];
        }
        if (mode === 'edit' && state.mode !== 'edit') {
          state.editingSessionId = null;
        }
        state.formatPainterArmed = false;
        state.formatPainterClip = null;
        state.formatPainterEditorId = null;

        state.mode = mode;
        if (mode !== 'edit') state.isCreatingNew = false;
        [el.globalModeBtn, el.reciteModeBtn, el.editModeBtn].forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        validateActiveId();
        renderSidebar(true);
        renderContent();
      }

      el.globalModeBtn.addEventListener('click', () => setMode('global'));
      el.reciteModeBtn.addEventListener('click', () => setMode('recite'));
      el.editModeBtn.addEventListener('click', () => setMode('edit'));

      // ---------- 导出 / 导入 ----------
      async function openExportModal() {
        el.exportStatus.textContent = '正在准备数据...';
        el.exportStatus.className = 'status-msg';
        el.exportModal.classList.add('show');

        const exportItems = await Promise.all(state.items.map(async (item) => {
          const resolved = await resolveImageArray(item.images);
          return { ...item, images: resolved };
        }));
        el.exportTextarea.value = JSON.stringify(exportItems, null, 2);
        el.exportStatus.textContent = '';
      }

      function closeExportModal() { el.exportModal.classList.remove('show'); }
      function openImportModal() {
        el.importTextarea.value = '';
        el.importStatus.textContent = '';
        el.importStatus.className = 'status-msg';
        state.importMode = 'merge';
        updateImportModeUI();
        el.importModal.classList.add('show');
      }
      function closeImportModal() { el.importModal.classList.remove('show'); }

      function updateImportModeUI() {
        el.importModeSelector.querySelectorAll('.import-mode-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.mode === state.importMode);
        });
      }

      el.importModeSelector.querySelectorAll('.import-mode-option').forEach(opt => {
        opt.addEventListener('click', () => {
          state.importMode = opt.dataset.mode;
          updateImportModeUI();
        });
      });

      async function copyExportData() {
        try {
          await navigator.clipboard.writeText(el.exportTextarea.value);
          el.exportStatus.textContent = '✓ 已复制到剪贴板！';
          el.exportStatus.className = 'status-msg';
        } catch (err) {
          el.exportTextarea.select();
          el.exportTextarea.setSelectionRange(0, 99999);
          try {
            const ok = document.execCommand('copy');
            el.exportStatus.textContent = ok ? '✓ 已复制到剪贴板！' : '复制失败，请手动全选复制';
            el.exportStatus.className = ok ? 'status-msg' : 'status-msg error';
          } catch (e2) {
            el.exportStatus.textContent = '复制失败，请手动全选复制';
            el.exportStatus.className = 'status-msg error';
          }
        }
      }

      function downloadExportData() {
        try {
          const blob = new Blob([el.exportTextarea.value], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const date = new Date();
          const stamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
          a.href = url;
          a.download = `知识点备份_${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          el.exportStatus.textContent = '✓ 文件已开始下载';
          el.exportStatus.className = 'status-msg';
        } catch (e) {
          el.exportStatus.textContent = '下载失败，请尝试复制到剪贴板';
          el.exportStatus.className = 'status-msg error';
        }
      }

      async function parseAndImport(rawText) {
        if (!rawText || !rawText.trim()) {
          el.importStatus.textContent = '❌ 没有可导入的数据';
          el.importStatus.className = 'status-msg error';
          return;
        }
        let parsed;
        try { parsed = JSON.parse(rawText); }
        catch (e) {
          el.importStatus.textContent = '❌ JSON 格式错误，请检查数据';
          el.importStatus.className = 'status-msg error';
          return;
        }
        if (!Array.isArray(parsed)) {
          el.importStatus.textContent = '❌ 数据格式错误，应为数组';
          el.importStatus.className = 'status-msg error';
          return;
        }

        const cleaned = [];
        for (const item of parsed) {
          if (!item || typeof item !== 'object' || item.title === undefined) continue;
          const normalized = normalizeItem(item);
          if (Array.isArray(normalized.images)) {
            const newImages = [];
            for (const ref of normalized.images) {
              if (ref.startsWith('data:image/')) {
                const id = generateId();
                try {
                  await saveImage(id, ref);
                  newImages.push(`img://${id}`);
                } catch (e) {
                  console.warn('导入图片失败', e);
                }
              } else {
                newImages.push(ref);
              }
            }
            normalized.images = newImages;
          }
          cleaned.push(normalized);
        }

        if (cleaned.length === 0) {
          el.importStatus.textContent = '❌ 没有有效的知识点数据';
          el.importStatus.className = 'status-msg error';
          return;
        }

        if (state.importMode === 'overwrite') {
          showConfirm('确认覆盖', `即将用 ${cleaned.length} 个知识点覆盖当前数据，\n当前 ${state.items.length} 个知识点将被删除。\n\n确定继续吗？`, () => {
            state.items = cleaned;
            state.activeId = state.items.length > 0 ? state.items[0].id : null;
            state.isCreatingNew = false;
            state.editingSessionId = null;
            state.draftImages = [];
            saveToStorage();
            renderSidebar(true);
            renderContent();
            el.importStatus.textContent = `✓ 成功覆盖，共导入 ${cleaned.length} 个知识点！`;
            el.importStatus.className = 'status-msg';
            showToast('导入成功');
            setTimeout(closeImportModal, 1000);
          });
        } else {
          const existingIds = new Set(state.items.map(i => i.id));
          const merged = cleaned.map(item => {
            const newItem = { ...item };
            while (existingIds.has(newItem.id)) newItem.id = generateId();
            existingIds.add(newItem.id);
            return newItem;
          });
          showConfirm('确认合并', `即将追加 ${merged.length} 个知识点，\n当前 ${state.items.length} 个知识点将被保留。\n合并后共 ${state.items.length + merged.length} 个。\n\n确定继续吗？`, () => {
            state.items = state.items.concat(merged);
            if (!state.activeId && state.items.length > 0) state.activeId = state.items[0].id;
            state.editingSessionId = null;
            state.draftImages = [];
            saveToStorage();
            renderSidebar(true);
            renderContent();
            el.importStatus.textContent = `✓ 成功合并，新增 ${merged.length} 个知识点！`;
            el.importStatus.className = 'status-msg';
            showToast('导入成功');
            setTimeout(closeImportModal, 1000);
          });
        }
      }

      function doImport() { parseAndImport(el.importTextarea.value); }

      function handleFileSelect(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.json') && file.type !== 'application/json') {
          el.importStatus.textContent = '❌ 请选择 .json 格式的文件';
          el.importStatus.className = 'status-msg error';
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          el.importTextarea.value = e.target.result;
          el.importStatus.textContent = `📄 已加载文件：${file.name}，请点击"确认导入"`;
          el.importStatus.className = 'status-msg';
        };
        reader.onerror = () => {
          el.importStatus.textContent = '❌ 文件读取失败，请重试';
          el.importStatus.className = 'status-msg error';
        };
        reader.readAsText(file);
      }

      el.fileDropZone.addEventListener('click', () => el.fileInput.click());
      el.fileInput.addEventListener('change', (e) => {
        handleFileSelect(e.target.files[0]);
        el.fileInput.value = '';
      });
      el.fileDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        el.fileDropZone.classList.add('dragover');
      });
      el.fileDropZone.addEventListener('dragleave', () => el.fileDropZone.classList.remove('dragover'));
      el.fileDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        el.fileDropZone.classList.remove('dragover');
        handleFileSelect(e.dataTransfer.files[0]);
      });

      document.getElementById('exportModalClose').addEventListener('click', closeExportModal);
      document.getElementById('exportCancelBtn').addEventListener('click', closeExportModal);
      document.getElementById('copyExportBtn').addEventListener('click', copyExportData);
      document.getElementById('downloadExportBtn').addEventListener('click', downloadExportData);

      document.getElementById('importModalClose').addEventListener('click', closeImportModal);
      document.getElementById('importCancelBtn').addEventListener('click', closeImportModal);
      document.getElementById('doImportBtn').addEventListener('click', doImport);

      el.exportModal.addEventListener('click', (e) => { if (e.target === el.exportModal) closeExportModal(); });
      el.importModal.addEventListener('click', (e) => { if (e.target === el.importModal) closeImportModal(); });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (el.exportModal.classList.contains('show')) closeExportModal();
          if (el.importModal.classList.contains('show')) closeImportModal();
          if (el.confirmOverlay.classList.contains('show')) closeConfirm();
          if (state.speakingId) stopSpeaking();
          if (state.formatPainterArmed) {
            state.formatPainterArmed = false;
            state.formatPainterClip = null;
            state.formatPainterEditorId = null;
            document.querySelectorAll('.format-painter-btn.armed').forEach(b => b.classList.remove('armed'));
          }
          closeAllPalettes();
        }
        if (state.mode === 'recite' && state.items.length > 0) {
          if (e.key === 'ArrowLeft') { e.preventDefault(); goToPrev(); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); goToNext(); }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.speakingId) stopSpeaking();
      });
      window.addEventListener('pagehide', () => {
        if (state.speakingId) stopSpeaking();
      });

      function updateOnlineStatus() {
        el.offlineBanner.classList.toggle('show', !navigator.onLine);
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      function init() {
        state.items = loadFromStorage();
        state.collapsedGroups = loadCollapsedState();
        state.activeId = state.items.length > 0 ? state.items[0].id : null;
        validateActiveId();
        renderSidebar(true);
        renderContent();
      }

      init();
    })();
  </script>
</body>
</html>
