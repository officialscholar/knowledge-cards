  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f7fc;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1e293b;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    .app-header {
      padding: 12px 16px 8px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      flex-wrap: wrap;
      gap: 8px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-toggle {
      display: flex;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 40px;
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: white;
      color: #1e3a8a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      font-weight: 600;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
      z-index: 5;
    }

    .sidebar.hidden-sidebar {
      display: none;
    }

    .sidebar-header {
      padding: 16px 16px 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header span:last-child {
      background: #eef2f6;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #334155;
    }

    .knowledge-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 #f1f5f9;
      -webkit-overflow-scrolling: touch;
    }

    .knowledge-list::-webkit-scrollbar {
      width: 4px;
    }
    .knowledge-list::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .knowledge-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .group-section {
      margin-bottom: 8px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .group-header:hover {
      background: #f1f5f9;
    }

    .group-header .group-arrow {
      font-size: 0.65rem;
      transition: transform 0.2s;
      color: #94a3b8;
      display: inline-block;
      width: 12px;
      text-align: center;
    }

    .group-section.collapsed .group-arrow {
      transform: rotate(-90deg);
    }

    .group-header .group-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-header .group-count {
      background: #eef2f6;
      color: #64748b;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .group-items {
      padding-left: 6px;
      overflow: hidden;
    }

    .group-section.collapsed .group-items {
      display: none;
    }

    .group-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .group-header:hover .group-actions {
      opacity: 1;
    }

    .group-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1;
      transition: all 0.1s;
    }

    .group-action-btn:hover {
      background: #e2e8f0;
      color: #334155;
    }

    .group-action-btn.delete-group:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .ungrouped-label {
      font-size: 0.7rem;
      color: #94a3b8;
      padding: 8px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      font-style: italic;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 4px 0;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #eef2f6;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      word-break: break-word;
      line-height: 1.4;
      position: relative;
    }

    .knowledge-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .knowledge-item.active {
      background: #eef4ff;
      border-left: 4px solid #2563eb;
      border-radius: 12px 8px 8px 12px;
      font-weight: 600;
      color: #1e3a8a;
    }

    .knowledge-item.mastered {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    .knowledge-item.mastered.active {
      background: #dcfce7;
      border-left-color: #16a34a;
      color: #14532d;
    }

    .mastered-badge {
      font-size: 0.65rem;
      color: #16a34a;
      background: #dcfce7;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      white-space: nowrap;
      margin-right: 2px;
    }

    .group-items .knowledge-item {
      margin-left: 4px;
      font-size: 0.9rem;
      padding: 10px 12px;
    }

    .item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .knowledge-item:hover .item-actions,
    .knowledge-item.active .item-actions {
      opacity: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      transition: all 0.1s;
      width: 28px;
      height: 28px;
      line-height: 1;
    }

    .delete-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .empty-list-msg {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      padding: 30px 10px;
      font-style: italic;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f7fc;
      -webkit-overflow-scrolling: touch;
    }

    .content-area.full-width {
      padding: 16px 16px 32px;
    }

    .content-area.recite-full {
      padding: 0;
      align-items: stretch;
      overflow: hidden;
    }

    .card-wrapper {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ========== 背诵模式 ========== */
    .recite-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .recite-slider {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-behavior: smooth;
      touch-action: pan-x;
    }

    .recite-slider::-webkit-scrollbar {
      display: none;
    }

    .recite-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 20px;
      overflow-y: auto;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .recite-slide-inner {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .knowledge-card {
      background: white;
      border-radius: 28px;
      padding: 28px 28px 32px;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.08), 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      word-break: break-word;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 18px;
      color: #0f172a;
      letter-spacing: -0.02em;
      padding-bottom: 8px;
      border-bottom: 3px solid #eef2ff;
      transition: color 0.25s, border-color 0.25s;
    }

    .card-content {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
      transition: color 0.25s;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 3px solid #eef2ff;
      transition: border-color 0.25s;
    }

    .card-title-row .card-title {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
      flex: 1;
      min-width: 0;
    }

    .speak-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #eff6ff;
      color: #2563eb;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
      line-height: 1;
      margin-top: -2px;
    }

    .speak-btn:hover {
      background: #dbeafe;
      transform: scale(1.05);
    }
    .speak-btn:active {
      transform: scale(0.95);
    }
    .speak-btn.speaking {
      background: #2563eb;
      color: white;
      animation: speakPulse 1.5s ease-in-out infinite;
    }
    .speak-btn.speaking:hover {
      background: #1e40af;
    }

    @keyframes speakPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
    }

    /* ========== 熟练度滑块 ========== */
    .mastery-slider-row {
      margin-top: 24px;
      width: 100%;
    }

    .mastery-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      user-select: none;
    }

    .mastery-labels .left-label,
    .mastery-labels .right-label {
      transition: color 0.25s;
    }

    .mastery-slider-container {
      position: relative;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      touch-action: none;
      user-select: none;
    }

    .mastery-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 12px;
      border-radius: 6px;
      background: #e2e8f0;
      overflow: hidden;
      transition: background 0.25s;
    }

    .mastery-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(to right, #94a3b8, #16a34a);
      transition: width 0.05s linear;
      border-radius: 6px 0 0 6px;
    }

    .mastery-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      border: 3px solid #94a3b8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transform: translate(-50%, -50%);
      cursor: grab;
      transition: border-color 0.25s, background 0.25s, transform 0.1s;
      z-index: 2;
    }

    .mastery-thumb.dragging {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    /* ========== 卡片下方左右切换按钮 ========== */
    .slide-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
      padding: 0 4px;
    }

    .slide-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: transform 0.12s, color 0.12s, opacity 0.12s;
      color: #64748b;
      line-height: 0;
      border-radius: 50%;
    }

    .slide-nav-btn svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .slide-nav-btn svg path {
      fill: currentColor;
      transition: fill 0.12s;
    }

    .slide-nav-btn:hover {
      color: #1e3a8a;
      transform: scale(1.08);
    }

    .slide-nav-btn:active {
      transform: scale(0.92);
    }

    .slide-nav-btn:disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }

    .slide-nav-btn:disabled:hover {
      transform: none;
      color: #64748b;
    }

    .slide-nav-position {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      letter-spacing: 0.05em;
      user-select: none;
      min-width: 64px;
      text-align: center;
    }

    /* ========== 全局模式 ========== */
    .global-group-section {
      width: 100%;
      margin-bottom: 28px;
    }

    .global-group-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }

    .global-group-divider .divider-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .global-group-divider .divider-name .group-icon {
      font-size: 0.85rem;
      color: #2563eb;
    }

    .global-group-divider .divider-count {
      background: #eef2f6;
      color: #64748b;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .global-group-divider .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #e2e8f0, transparent);
    }

    .global-group-section.ungrouped-section .global-group-divider {
      border-bottom-color: #f1f5f9;
    }

    .global-group-section.ungrouped-section .global-group-divider .divider-name {
      color: #94a3b8;
      font-style: italic;
    }

    .global-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .global-card {
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 6px 16px rgba(0, 20, 50, 0.08), 0 2px 4px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.8);
      cursor: grab;
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      height: 140px;
      overflow: hidden;
      position: relative;
      will-change: transform;
      touch-action: none;
      user-select: none;
    }

    .global-card:hover {
      transform: translateY(-4px);

      cursor: grabbing;
      transition: none;

      left: 8px;

      color: #cbd5e1;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;

      color: #94a3b8;

    .button-group {

    .btn {
      padding: 12px 24px;

    /* ========== 模态框 ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid #eef2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }

    .modal-close:hover {
      background: #f1f5f9;
      color: #334155;
    }

    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .modal-textarea {
      width: 100%;
      min-height: 200px;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      font-size: 0.85rem;
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      line-height: 1.55;
      background: #f8fafc;
      color: #1e293b;
      resize: vertical;
      outline: none;
      word-break: break-all;
    }

    .modal-textarea:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .modal-footer {

      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;

    .import-mode-option {

      background: rgba(15, 23, 42, 0.5);
